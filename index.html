@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0A1310;--card:#111C18;--paper:#0E1814;--ink:#E8EEEA;--ink2:#B3C0BA;--ink3:#7A8A83;--line:#22312B;--line2:#2E3F38;--brand:#3E9E7F;--brand2:#5DBA9B;--brandSoft:#16302A;--goldSoft:#2A2417;--okSoft:#14302A;--warnSoft:#2E2414;--badSoft:#331B1B;--sh:0 10px 30px -12px rgba(0,0,0,.5)}}
:root[data-theme=dark]{--bg:#0A1310;--card:#111C18;--paper:#0E1814;--ink:#E8EEEA;--ink2:#B3C0BA;--ink3:#7A8A83;--line:#22312B;--line2:#2E3F38;--brand:#3E9E7F;--brand2:#5DBA9B;--brandSoft:#16302A;--goldSoft:#2A2417;--okSoft:#14302A;--warnSoft:#2E2414;--badSoft:#331B1B;--sh:0 10px 30px -12px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.inp:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{padding-bottom:130px}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.serif{font-family:var(--serif)}
/* band */
.band{position:sticky;top:0;z-index:20;background:var(--folio);color:var(--folioInk);background-image:var(--lattice);background-size:72px;background-blend-mode:normal}
.band:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--folio) 30%,rgba(11,58,46,.82));pointer-events:none}
.bandin{position:relative;max-width:960px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.band h1{margin:0;font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .bt{flex:1;min-width:0}
.band .bt p{margin:0;font-size:13.5px;color:var(--folioMute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .meter{position:relative;height:3px;background:rgba(255,255,255,.12)}
.band .meter i{display:block;height:100%;background:var(--gold);transition:width .3s}
.bbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--folioInk);flex:none}
.bbtn svg{width:22px;height:22px}
.saved{font-size:12.5px;color:var(--folioMute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.saved i{width:7px;height:7px;border-radius:50%;background:#6FD3A5;display:block}
.saved.pending i{background:var(--gold)}.saved.err{color:#F3B4AE}.saved.err i{background:#E2554F}
/* home hero */
.hero{background:var(--folio);color:var(--folioInk);position:relative;overflow:hidden}
.hero .pat{position:absolute;inset:0;background-image:var(--lattice);background-size:96px;opacity:.55;-webkit-mask-image:linear-gradient(to left,#000 0%,rgba(0,0,0,.15) 70%);mask-image:linear-gradient(to left,#000 0%,rgba(0,0,0,.15) 70%)}
.hero .in{position:relative;max-width:960px;margin:0 auto;padding:18px 20px 34px}
.hero .tools{display:flex;align-items:center;gap:10px;justify-content:space-between}
.hero .brand{font-size:14px;color:var(--folioMute);display:flex;align-items:center;gap:8px}
.hero .brand b{color:var(--folioInk);font-weight:600}
.hero h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.25;margin:34px 0 4px}
.hero .date{font-size:16px;color:var(--folioMute)}
.hero .date b{color:var(--gold);font-weight:600}
.hero .acts{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:13px;border:1px solid var(--line2);background:var(--card);font-weight:500;font-size:16px;white-space:nowrap;color:var(--ink)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--folio);border-color:var(--folio);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1E1608;font-weight:600}
.btn.onfolio{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22);color:var(--folioInk)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{height:40px;padding:0 14px;font-size:14.5px;border-radius:11px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.4}
/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 0 12px;gap:10px}
.sec h2{font-family:var(--serif);font-size:22px;margin:0;font-weight:700}
.sec .c{font-size:14px;color:var(--ink3)}
.status{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:13px;font-size:14.5px;margin-top:16px;line-height:1.6}
.status.ok{background:var(--okSoft);color:var(--ok)}.status.warn{background:var(--warnSoft);color:var(--warn)}.status.bad{background:var(--badSoft);color:var(--bad)}
.status svg{width:20px;height:20px;flex:none}
.status .grow{flex:1}
/* ledger */
.ledger{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);overflow:hidden}
.lrow{display:flex;align-items:center;gap:18px;padding:16px 20px;width:100%;text-align:right;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow:active{background:var(--paper)}
.dblock{width:62px;flex:none;text-align:center;border-left:1px solid var(--line);padding-left:16px}
.dblock .d{font-family:var(--serif);font-weight:700;font-size:32px;line-height:1;color:var(--folio2)}
.dblock .m{font-size:12px;color:var(--ink3);margin-top:4px;line-height:1.3}
.lrow .grow{flex:1;min-width:0}
.lrow .t{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .s{font-size:13.5px;color:var(--ink3)}
.pct{flex:none;text-align:center;min-width:56px}
.pct b{font-size:18px;font-weight:600;display:block;line-height:1.2}
.pct .track{height:4px;border-radius:4px;background:var(--line);margin-top:6px;overflow:hidden}
.pct .track i{display:block;height:100%;background:var(--gold)}
.pct.done b{color:var(--ok)}.pct.done .track i{background:var(--ok)}
.empty{text-align:center;padding:42px 20px;color:var(--ink3);border:1.5px dashed var(--line2);border-radius:20px;background:var(--card)}
.empty b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink);margin-bottom:4px}
/* visit */
.facts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:18px 0 0;font-size:14.5px;color:var(--ink2)}
.facts span b{color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;text-align:right;box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;position:relative;min-height:148px}
.tile .t{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.35}
.tile .m{font-size:13.5px;color:var(--ink3)}
.tile .dist{display:flex;height:8px;border-radius:8px;overflow:hidden;background:var(--line);margin-top:auto;gap:2px}
.tile .dist i{display:block;height:100%}
.tile .st{position:absolute;top:18px;left:18px;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px}
.st.new{background:var(--paper);color:var(--ink3);border:1px solid var(--line)}
.st.go{background:var(--goldSoft);color:var(--goldDeep)}
.st.done{background:var(--okSoft);color:var(--ok)}
.i1{background:var(--l1)}.i2{background:var(--l2)}.i3{background:var(--l3)}.i4{background:var(--l4)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:block}
/* forms */
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh);margin-top:16px}
.panel h3{font-family:var(--serif);font-size:22px;margin:0 0 4px}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--ink2);font-weight:500}
label.f .opt{font-weight:400;color:var(--ink3);font-size:12.5px}
.inp,textarea.inp,select.inp{height:50px;border:1px solid var(--line2);border-radius:12px;background:var(--paper);padding:0 14px;font-size:17px;color:var(--ink);width:100%;outline:none}
textarea.inp{height:auto;min-height:84px;padding:10px 14px;resize:vertical;line-height:1.7}
.inp:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(194,160,97,.25)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:13px;padding:3px;background:var(--card);gap:2px}
.seg button{height:40px;padding:0 16px;border-radius:10px;font-size:14.5px;color:var(--ink2);font-weight:500}
.seg button.on{background:var(--folio);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink3);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 11px;border-radius:999px;background:var(--brandSoft);color:var(--brand2);font-weight:600}
.pill.warn{background:var(--warnSoft);color:var(--warn)}
.pill.gold{background:var(--goldSoft);color:var(--goldDeep)}
/* fill */
.toolrow{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.toolrow .count{margin-inline-start:auto;font-size:14px;color:var(--ink2)}
.toolrow .count b{font-family:var(--serif);font-size:22px;color:var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dot{width:38px;height:38px;border-radius:11px;border:1.5px solid var(--line2);font-size:13.5px;font-weight:600;display:grid;place-items:center;background:var(--card);color:var(--ink2)}
.dot.meta{width:auto;padding:0 12px;font-weight:500}
.dot.s1{background:var(--l1);border-color:var(--l1);color:#fff}.dot.s2{background:var(--l2);border-color:var(--l2);color:#fff}.dot.s3{background:var(--l3);border-color:var(--l3);color:#fff}.dot.s4{background:var(--l4);border-color:var(--l4);color:#fff}
.dot.sk{border-style:dashed;border-color:var(--warn);color:var(--warn);background:var(--warnSoft)}
.dot.ok{background:var(--okSoft);border-color:var(--ok);color:var(--ok)}
.dot.cur{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--gold)}
.item{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:var(--sh);margin-top:18px;scroll-margin-top:96px}
.ihead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.inum{font-family:var(--serif);font-weight:700;font-size:42px;line-height:1;color:var(--gold);min-width:40px}
.icode{font-size:13px;color:var(--ink3)}
.icode b{color:var(--ink2);font-weight:600}
.skipflag{margin-inline-start:auto}
.itext{font-family:var(--serif);font-size:25px;font-weight:700;line-height:1.6;margin:0 0 18px}
.note{background:var(--warnSoft);color:var(--warn);font-size:14.5px;padding:9px 14px;border-radius:12px;margin:0 0 14px}
details.qs{border-right:3px solid var(--gold);background:var(--paper);border-radius:4px 14px 14px 4px;padding:2px 18px;margin:0 0 18px}
details.qs summary{font-weight:600;font-size:15px;color:var(--goldDeep);padding:10px 0;cursor:pointer;list-style:none}
details.qs summary::-webkit-details-marker{display:none}
details.qs ol{margin:0 0 12px;padding-inline-start:22px;font-size:16.5px}
details.qs li{margin:6px 0}
.evs{display:grid;gap:8px}
.ev{display:flex;gap:14px;align-items:flex-start;text-align:right;padding:14px 16px;border:1.5px solid var(--line);border-radius:15px;background:var(--paper);font-size:17px;line-height:1.6;width:100%;transition:border-color .15s,background .15s}
.ev .bx{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);flex:none;display:grid;place-items:center;margin-top:1px;background:var(--card);transition:all .15s}
.ev .bx svg{width:18px;height:18px;opacity:0;color:#fff}
.ev.on{border-color:var(--folio2);background:var(--brandSoft)}
.ev.on .bx{background:var(--folio);border-color:var(--folio)}
.ev.on .bx svg{opacity:1}
.more{display:grid;gap:12px;margin-top:16px}
.scorebox{margin-top:20px}
.scorehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.scorehead b{font-family:var(--serif);font-size:20px}
.scorehead .cnt{font-size:14px;color:var(--ink2)}
.gauge{display:grid;grid-template-columns:repeat(4,1fr);border:1.5px solid var(--line2);border-radius:18px;overflow:hidden;background:var(--card)}
.gseg{padding:12px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;border-left:1px solid var(--line);transition:background .2s,color .2s}
.gseg:last-child{border-left:0}
.gseg .n{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.05}
.gseg .w{font-size:13px;font-weight:600;color:var(--ink2);line-height:1.35}
.gseg .bd{font-size:11.5px;color:var(--ink3)}
.gseg.on{color:#fff}.gseg.on .w,.gseg.on .bd{color:rgba(255,255,255,.9)}
.gseg.on.l1{background:var(--l1)}.gseg.on.l2{background:var(--l2)}.gseg.on.l3{background:var(--l3)}.gseg.on.l4{background:var(--l4)}
.gseg.below{background:var(--brandSoft)}
.ovr{font-size:13.5px;color:var(--warn);margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ovr svg{width:16px;height:16px}
.ovr button{color:var(--brand2);text-decoration:underline;font-size:13.5px}
.ovr.hint{color:var(--ink3)}
.inkrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inkthumb{height:72px;border:1px solid var(--line);border-radius:10px;background:#fff;max-width:220px;object-fit:contain}
.metacard .head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.metacard .head .grow{flex:1}
.stepbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 20px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px -16px rgba(11,58,46,.3)}
.stepbar .in{max-width:960px;margin:0 auto;display:flex;gap:10px;align-items:center}
.stepbar .btn{height:56px;font-size:17px}
.stepbar .grow{flex:1}
.stepbar .skip{color:var(--ink2)}
/* modal & sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(6,20,16,.55);display:flex;align-items:center;justify-content:center;padding:16px}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.scrim:has(.pad){padding:0!important}
.modal{background:var(--card);width:100%;max-width:620px;border-radius:24px;margin:auto;padding:24px;max-height:92vh;overflow:auto;border-top:4px solid var(--gold)}
@media (min-width:700px){.modal{border-radius:24px}}
.modal h3{margin:0 0 6px;font-size:25px;font-family:var(--serif)}
.modal p{margin:0 0 6px;color:var(--ink2)}
.modal .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal.nudge{max-width:480px}
.modal.pad{max-width:none;height:100%;max-height:none;border-radius:0;display:flex;flex-direction:column;padding:12px;border-top:0}
.padbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.padbar .sp{flex:1}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line2)}
.swatch.on{box-shadow:0 0 0 2.5px var(--gold)}
.canvaswrap{flex:1;border-radius:14px;overflow:hidden;border:1px solid var(--line2);background:#fff;position:relative;background-image:linear-gradient(#EDF1EF 1px,transparent 1px);background-size:100% 40px}
.canvaswrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:80;background:var(--folio);color:#fff;padding:13px 20px;border-radius:14px;font-size:15px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh);max-width:92vw}
.toast button{color:var(--gold);font-weight:600}
.misslist{display:grid;gap:8px;margin-top:10px}
.misslist button{text-align:right;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:14.5px;line-height:1.6}
.misslist button em{font-style:normal;color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
html,body{font-size:16px}.hero h1{font-size:36px}.itext{font-size:22px}.item{padding:18px}.gseg .n{font-size:26px}.gseg .w{font-size:11.5px}.gseg .bd{font-size:10.5px}.lrow{gap:12px;padding:14px}.paper{padding:20px 16px}.stepbar .btn{padding:0 14px}
}
.paperwrap{background:#E9E4D8;border-radius:18px;padding:18px;margin-top:16px;overflow:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .paperwrap{background:#1E2723}}
.paper{background:#fff;color:#111;width:100%;max-width:820px;margin:0 auto 18px;padding:34px 38px;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.12);font-family:var(--sans);font-size:14px;line-height:1.65}
.paper h2{font-family:var(--serif);font-size:22px;margin:0;font-weight:700;color:#0E3B30}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0E3B30;padding-bottom:10px;margin-bottom:12px;gap:16px}
.paper .ph .d{font-size:12px;color:#555;text-align:left;line-height:1.5}
.paper table.info{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:13px}
.paper table.info td{border:1px solid #CFC6B2;padding:5px 9px}
.paper table.info td.k{background:#F4EFE4;width:15%;font-weight:600;white-space:nowrap}
.paper .q{break-inside:avoid;page-break-inside:avoid;margin:0 0 10px}
.paper .qt{font-weight:600;font-size:14.5px;display:flex;gap:6px}
.paper .qt .c{font-size:10.5px;color:#8a7a5a;font-weight:500;white-space:nowrap;margin-top:3px}
.paper .opts{margin:3px 26px 0 0;display:grid;gap:1px}
.paper .opt{display:flex;gap:8px;align-items:center;color:#9a9a9a;font-size:13.5px}
.paper .opt .o{width:13px;height:13px;border-radius:50%;border:1.5px solid #bbb;flex:none}
.paper .opt.sel{color:#000;font-weight:700}
.paper .opt.sel .o{background:#0E3B30;border-color:#0E3B30;box-shadow:inset 0 0 0 2px #fff}
.paper .opt.sel:after{content:"✓";color:#0E3B30;font-weight:700}
.paper .unset{color:#B23A3A;font-size:12.5px;margin:3px 26px 0 0}
.paper .extra{margin:4px 26px 0 0;font-size:12.5px;color:#333;background:#FAF7F0;border-right:3px solid #C9A465;padding:4px 10px}
.paper .extra img{max-height:120px;max-width:100%;display:block;margin-top:4px}
.paper table.sum{width:100%;border-collapse:collapse;font-size:13px}
.paper table.sum th{background:#0E3B30;color:#fff;padding:7px 8px;font-weight:600;text-align:right}
.paper table.sum td{border:1px solid #D9D1BE;padding:6px 8px;vertical-align:top}
.paper table.sum tr{break-inside:avoid;page-break-inside:avoid}
.paper table.sum td.n{text-align:center;width:34px;color:#7A5A28;font-weight:700}
.paper table.sum td.s{text-align:center;width:118px;white-space:nowrap;font-weight:700}
.paper table.sum td.code{width:72px;font-size:11px;color:#777;text-align:center}
.paper .stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;font-size:12.5px}
.paper .stats span{border:1px solid #D9D1BE;border-radius:6px;padding:3px 10px}
.paper .sig{display:flex;justify-content:space-between;margin-top:26px;font-size:13px;gap:20px}
.paper .sig div{flex:1;border-top:1px dotted #999;padding-top:6px;text-align:center;color:#555}
.paper .inkfull{max-width:100%;max-height:420px;border:1px solid #eee;margin-top:8px}
#printRoot{display:none}
@media print{
@page{size:A4;margin:12mm}
html,body{background:#fff!important}
#app,.toast,.scrim,.stepbar{display:none!important}
#printRoot{display:block}
#printRoot .paper{box-shadow:none;padding:0;margin:0;max-width:none;border-radius:0;page-break-after:always;break-after:page}
#printRoot .paper:last-child{page-break-after:auto;break-after:auto}
}
@media (max-width:560px){
html,body{font-size:16px}
.itext{font-size:19px}
.lv .n{font-size:24px}.lv .w{font-size:12px}
.hero .hi{font-size:27px}
.paper{padding:20px 16px}
.item{padding:16px}
}
.scrim:has(.pad){padding:0!important}
/* hijri picker */
.flab2{font-size:14px;color:var(--ink2);font-weight:500;display:block;margin-bottom:5px}
.hdate{border:1px solid var(--line2);border-radius:14px;background:var(--paper);padding:14px}
.hshow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hshow b{font-family:var(--serif);font-size:26px;line-height:1.2}
.hshow span{font-size:17px;font-weight:600;color:var(--brand2)}
.hshow small{font-size:13px;color:var(--ink3)}
.dchips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:2px}
.dchip{flex:none;border:1.5px solid var(--line2);background:var(--card);border-radius:12px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;line-height:1.35;min-width:78px}
.dchip b{font-size:14px}.dchip span{font-size:12px;color:var(--ink3)}
.dchip.on{background:var(--folio);border-color:var(--folio);color:#fff}.dchip.on span{color:#CFE2D9}
.hsel{display:grid;grid-template-columns:80px 1fr 100px;gap:8px}
/* PDF-style card (fill + print) */
.item.fcard{padding:0;overflow:hidden;border-radius:6px;border:1px solid #BFC9C4;background:#fff;color:#14231d;box-shadow:var(--sh)}
.fbar{background:#0B3A2E;color:#fff;padding:8px 14px;font-weight:600;font-size:15px}
.fskip{background:#FAF0DC;color:#9A6210;font-size:12px;padding:1px 8px;border-radius:6px;margin-inline-start:8px}
.frow{display:grid;grid-template-columns:96px 1fr;border-top:1px solid #D5DDD9}
.frow.fhead{grid-template-columns:96px 1fr auto}
.flab{background:#EEF2F0;padding:10px;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;text-align:center;border-left:1px solid #D5DDD9}
.ftxt{padding:10px 14px;font-weight:700;font-size:16.5px;line-height:1.6;display:flex;flex-direction:column;justify-content:center}
.fnote{font-weight:500;font-size:12.5px;color:#9A6210;margin-top:4px}
.fbody{padding:10px 14px;font-size:15px}
.fscw{border-right:1px solid #D5DDD9;align-self:stretch;display:flex;flex-direction:column}
.fsc{display:grid;grid-template-columns:repeat(4,72px);height:100%}
.fs{border-left:1px solid #D5DDD9;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px;background:#F7F9F8;color:#14231d}
.fs:last-child{border-left:0}

.sbar{display:grid;grid-template-columns:minmax(80px,30%) 1fr auto;gap:10px;align-items:center;margin:8px 0}.sbar span{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sbar i{display:block;height:12px;border-radius:99px;background:var(--gold)}.sbar b{min-width:26px;text-align:left}

I('1-1-4-6','تطبق المدرسة إجراءات التقويم الذاتي وأدواته وفقًا للأدلة المعتمدة من الهيئة.','1-2,3,4,5+','تطبّق إجراءات التقويم الذاتي وفقًا للأدلة والنماذج المعتمدة من الهيئة|تشرك منسوبيها وأصحاب المصلحة في تطبيق عمليات التقويم الذاتي|تُطلع منسوبيها وأصحاب المصلحة على نتائج التقويم الذاتي|تعزز ثقافة التقويم المدرسي بين جميع منسوبيها بأساليب متنوعة|تعزز ثقافة التقويم المدرسي بين جميع منسوبيها بأساليب مبتكرة'),
I('1-1-4-7','تحلل المدرسة نتائج التقويم المدرسي، وتوظفها في تطوير خطة شاملة للتحسين، وتتابعها.','1-2,3-4,5,6+','تحلّل نتائج التقويم المدرسي لتحديد أولويات التحسين ومجالات التطوير|توظّف نتائج التحليل في تطوير خطة تحسين شاملة ومتكاملة|تطبّق إجراءات متنوعة لمتابعة تنفيذ الخطة الشاملة للتحسين|تقوّم خطة التحسين بانتظام في ضوء نتائج التقويم المدرسي|تطوّر خطة التحسين وتحدّثها بعد التنفيذ في ضوء نتائج المتابعة والتقويم|تضع أهداف خطة التحسين وفق الأولويات'),
I('1-1-5-1','تطبق المدرسة إجراءات واضحة؛ للمحافظة على حقوق المتعلمين وحمايتهم.','1-2,3,4,5+','تطبّق إجراءات واضحة تسهم في حماية حقوق المتعلمين داخل البيئة التعليمية|تطبق أساليب متنوعة لتوعية المتعلمين بحقوقهم|تطبق أساليب مبتكرة لتوعية المتعلمين بحقوقهم|تزوّد المتعلمين ببيانات التواصل مع الجهات المختصة بخدمات الحماية وكيفية الوصول إليها|تنفذ برامج وأنشطة إرشادية وتوعوية متنوعة لتوعية المتعلمين بحقوقهم'),
I('1-1-5-2','تطبق المدرسة برامج وأنشطة تضمن مناخًا آمنًا للتعلم، وتحد من حالات التنمر.','1-2,3-4,5-6,7+','تنفذ برامج وأنشطة وقائية متنوعة للحد من التنمر|تنفذ برامج وأنشطة علاجية متنوعة للحد من التنمر|تنفذ برامج وأنشطة تدعم النمو النفسي والاجتماعي للمتعلمين|تطبق إجراءات تحقق مناخًا آمنًا للتعلم بأساليب متنوعة|تتابع تنفيذ أنشطة وبرامج الوقاية والعلاج لمشكلات التنمر بأساليب متنوعة|تتابع تنفيذ أنشطة وبرامج الوقاية والعلاج لمشكلات التنمر بأساليب مبتكرة|تتيح للمتعلمين فرصًا آمنة للتعبير عن احتياجاتهم ومخاوفهم'),
I('2-1-1-2','تُتابع المدرسة تنفيذ المناهج؛ لتحقيق نواتج التعلم (المعارف، القيم، المهارات) المستهدفة وفق الخطة الدراسية.','1-2,3-4,5-6,7+','يتوافق تنفيذ المنهج مع الخطة الزمنية بنسبة أكثر من 90%|تدعم تنفيذ المناهج بأنشطة متنوعة تسهم في تحقيق نواتج التعلم|تؤمّن حصصًا للمعلم المتأخر في المنهج للسير وفق الخطة الدراسية|تتابع تنفيذ المناهج بأساليب متنوعة وفق الخطة الدراسية|تتابع تنفيذ المناهج بأساليب مبتكرة وفق الخطة الدراسية|تدعم تنفيذ المناهج بمصادر تعلم متنوعة|تتابع مدى تحقق نواتج التعلم المستهدفة من خلال تنفيذ المناهج'),
I('2-2-1-1','تطبق المدرسة أساليب وأدوات تقويم متنوعة تشخيصية وبنائية وختامية؛ لتحديد مستويات أداء المتعلمين المختلفة.','1-2,3-4,5-6,7+','تنوّع أساليب وأدوات التقويم بما يتناسب مع طبيعة نواتج التعلم وخصائص المتعلمين|تحدد مستويات أداء المتعلمين المختلفة والفروق الفردية من خلال نتائج التقويم|تعزّز مشاركة المتعلمين في تقويم أدائهم لتحسين تعلمهم بشكل مستمر|تطبّق أساليب وأدوات تقويم تشخيصية تكشف الفروق الفردية قبل التعلم وأثناءه|توظّف أدوات تقويم بنائية لقياس التقدم ودعم تحسين الأداء|تنفّذ أدوات تقويم ختامية لقياس مدى تحقق نواتج التعلم|تطبّق أساليب وأدوات تقويم مبتكرة (تشخيصية - بنائية - ختامية)'),
I('2-2-1-3','تحلل المدرسة نتائج تقويم أداء المتعلمين، وتوظفها في تحسين الممارسات التعليمية، وبناء خطط علاجية وإثرائية.','1-2,3-4,5,6+','تحلّل نتائج تقويم الأداء وتفسرها لتحديد مستويات التحصيل والفجوات في نواتج التعلم|توظّف نتائج التقويم في اتخاذ قرارات لتحسين الممارسات التعليمية|تبني خططًا علاجية تستند إلى تحليل نتائج التقويم|تنفّذ برامج إثرائية لدعم المتعلمين في تحقيق النواتج المستهدفة|تتابع أثر الخطط العلاجية والبرامج الإثرائية بأساليب متنوعة|تتابع تنفيذ الخطط العلاجية والبرامج الإثرائية بأساليب مبتكرة'),
I('2-2-1-4','تقدم المدرسة تغذية راجعة للمتعلمين، وتُتابع تقدمهم بشكل مستمر.','1-2,3-4,5-6,7+','تقدم تغذية راجعة بناءة للمتعلمين بأساليب متنوعة|تقدم تغذية راجعة بناءة للمتعلمين بأساليب مبتكرة|تقدم تغذية راجعة توضح مستوى تقدم المتعلمين في تحقيق التوقعات العالية|تتابع تقدم المتعلمين بشكل مستمر من خلال أدوات تقويم متنوعة|تزوّد أولياء الأمور بتغذية راجعة منتظمة حول تقدم أبنائهم|توظّف نتائج التغذية الراجعة في تحسين الممارسات التعليمية ودعم التعلم|توجّه المتعلمين إلى الاستفادة من التغذية الراجعة في تحسين أدائهم'),
I('3-2-1-4','يشارك المتعلمون في أعمال تطوعية تخدم المجتمع.','1-2,3-4,5-6,7+','يشارك المتعلمون في برامج وأنشطة التطوع لخدمة المجتمع داخل المدرسة وخارجها|تبيّن الوثائق اطلاع المتعلمين على إرشادات المشاركة في الأعمال التطوعية وتنظيم الوقت|تحفز المتعلمين على المشاركة الفاعلة في الأعمال التطوعية بأساليب متنوعة|تشارك جميع فئات المتعلمين في برامج التطوع داخل المدرسة|تتنوع مشاركة المتعلمين في الأعمال التطوعية|تتابع مشاركة المتعلمين وتقدم لهم الدعم بأساليب متنوعة|تتابع مشاركة المتعلمين وتقدم لهم الدعم بأساليب مبتكرة'),
I('3-2-1-5','يلتزم المتعلمون بقواعد السلوك والانضباط المدرسي.','1-2,3-4,5-6,7+','تزوّد المتعلمين بقواعد السلوك والانضباط بأساليب متنوعة|يلتزم جميع المتعلمين بالحضور المدرسي وفق قواعد الانضباط|تعدّ أدلة ومنشورات توجيهية تدعم نشر ثقافة الانضباط السلوكي|تطبق إجراءات متنوعة للحد من الغياب وتعزيز الانضباط|تفيد الوثائق بمتابعة التزام جميع المتعلمين بقواعد السلوك بأساليب متنوعة|يشارك المتعلمون في أنشطة وبرامج متنوعة تعزّز المسؤولية والانضباط الذاتي|يشارك المتعلمون في أنشطة وبرامج مبتكرة تعزّز المسؤولية والانضباط الذاتي'),
I('4-1-1-1','توفر المدرسة شهادة مطابقة المبنى للمواصفات والاشتراطات المعتمدة من حيث النوع والخدمات المساندة.','1,2,3,4+','توفّر مبنى تعليميًا يستوفي جميع المواصفات والاشتراطات المعتمدة|يوجد لدى المدرسة شهادة مطابقة المبنى من الجهات المختصة|تقدّم خدمات مساندة متنوعة تلبي متطلبات العملية التعليمية لجميع المتعلمين|تطبّق إجراءات متنوعة لمتابعة جودة الخدمات المساندة وضمانها'),
I('4-2-1-1','يوجد لدى المدرسة شهادة الأمن والسلامة من الدفاع المدني سارية العمل بها.','1-2,3,4,5+','يوجد شهادة الأمن والسلامة من الدفاع المدني أو تقرير معتمد من جهات مختصة|تنفذ التوجيهات الواردة في التقرير أو الشهادة الصادرة عن الجهات المختصة|شهادة الأمن والسلامة سارية المفعول|توجد إجراءات محددة للحفاظ على سلامة المرافق والمعدات داخل المدرسة|تطبق إجراءات الصيانة الدورية لمرافق المبنى المدرسي')
]},
{id:'cls',title:'بطاقة الملاحظة الصفية',short:'الملاحظة الصفية',group:'main',multi:true,unit:'حصة',mark:'ص',meta:[['subj','المادة'],['grade','الصف'],['sec','الفصل'],['period','الحصة'],['teacher','اسم المعلم/ة'],['nid','الهوية الوطنية']],items:[
I('1-1-2-1','تُنفّذ المدرسة برامج وأنشطة؛ لتعزيز القيم الإسلامية والهوية الوطنية لدى المتعلمين.','1-2,3-4,5,6+','ينفّذ المعلم أنشطة متنوعة (2 أو أكثر) تعزّز القيم الإسلامية لدى المتعلمين|ينفذ المعلم أنشطة مبتكرة تنمي الهوية الوطنية والانتماء لدى المتعلمين|يستشهد المعلم بالمنجزات أو الرموز الوطنية في بيئة الصف|يحفز المعلم المتعلمين على استشعار مسؤوليتهم تجاه خدمة الوطن والمجتمع|يشجع المعلم المتعلمين على الاعتزاز بالهوية الوطنية|يوظف المعلم مواقف التعلم اليومية لتعزيز القيم الإسلامية والهوية الوطنية'),
I('1-1-5-2','تنفذ المدرسة إجراءات تضمن مناخًا آمنًا للتعلم والنمو نفسيًا واجتماعيًا.','1-2,3-4,5,6+','ينفذ المعلم في بيئة الصف أنشطة تعزز النمو النفسي والاجتماعي للمتعلمين|يتعامل المعلم مع مواقف التنمر أو الإيذاء بين المتعلمين متى وقعت|تخلو بيئة الصف من مصادر التهديد أو الخوف للمتعلمين|تشجع بيئة الصف المتعلمين على المشاركة الآمنة والتعبير بحرية|تُظهر بيئة الصف علاقات إيجابية بين المتعلمين تدعم نموهم النفسي والاجتماعي|يُعزز المعلم الشعور بالأمان والانتماء لدى المتعلمين'),
I('2-1-1-1','يتوافر في بيئة التعلم مصادر وأنشطة متنوعة للتعلم تلبي احتياجات المتعلمين، ومنهم ذوو الإعاقة والموهوبون.','1-2,3-4,5,6+','تتنوع أنشطة التعلم في بيئة التعلم (2 فأكثر)|تتنوع مصادر التعلم (2 أو أكثر)|تتوافر في بيئة التعلم أنشطة متنوعة تلبي احتياجات جميع المتعلمين|تتوافر في بيئة التعلم مصادر متنوعة تلبي احتياجات جميع المتعلمين|تتوافر في بيئة التعلم أنشطة تعليمية مبتكرة تراعي الفروق الفردية|تتوافر في بيئة التعلم مصادر تعليمية مبتكرة تراعي الفروق الفردية'),
I('2-1-1-1','يدار الوقت في بيئة التعلم بفاعلية؛ لدعم التعلم وتلبية احتياجات المتعلمين، ومنهم ذوو الإعاقة والموهوبون.','1-2,3-4,5-6,7+','يستخدم المعلم وقت الحصة كاملًا بفاعلية في التعليم والتعلم والتقويم|يوزّع المعلم الوقت على مراحل الدرس (التهيئة – التنفيذ – التقويم)|يتوافق تنفيذ محتوى المنهج المستهدف بنسبة 90% مع الخطة الزمنية|يتوافق عدد الأنشطة وأسلوب تنفيذها مع الوقت المخصص|يخصص المعلم وقتًا للإجابة عن استفسارات المتعلمين والتحقق من فهمهم|يحافظ المعلم على الوقت عند الانتقال بين الموضوعات والأنشطة|يوزع المعلم الوقت بتوازن لتلبية احتياجات المتعلمين بمختلف فئاتهم'),
I('2-1-1-1','يتاح للمتعلمين فرص متكافئة في الأنشطة والمناقشة الصفية، واستخدام مصادر التعلم.','1-2,3-4,5,6+','تحقق بيئة الصف فرصًا متكافئة للمتعلمين للمشاركة في تنفيذ الأنشطة الصفية|يشارك جميع المتعلمين في فرص متكافئة في الأنشطة المرتبطة بالهوية الدينية والوطنية *|تتاح فرص متكافئة لجميع المتعلمين لاستخدام مصادر التعلم|تشجع بيئة الصف المتعلمين على المشاركة في الأنشطة بأساليب متنوعة (2 أو أكثر)|تشجع بيئة الصف المتعلمين على المشاركة في الأنشطة بأساليب مبتكرة|تشجع بيئة الصف جميع المتعلمين على المناقشة الصفية',null,'* الشاهد مرتبط بمادة القرآن الكريم والدراسات الاجتماعية واللغة العربية'),
I('2-1-1-2','توفر المدرسة مصادر تعلم متنوعة تدعم تنفيذ المناهج؛ لتحقيق نواتج التعلم المستهدفة.','1,2,3,4+','تُهيّئ المدرسة بيئة تعلم غنية بمصادر تعلم تدعم تنفيذ المناهج|يوظف المعلم مصادر تعلم متنوعة (2 أو أكثر) في تنفيذ المنهج تحقق نواتج التعلم|تدعم المصادر اكتساب المتعلمين المعارف والقيم والمهارات بأساليب متنوعة|تتاح مصادر تعلم تدعم تحقيق نواتج التعلم المستهدفة لجميع المتعلمين'),
I('2-1-1-2','ينفذ المعلم أنشطة وإستراتيجيات تدريس تستوفي نواتج التعلم المستهدفة في المنهج، وتتسق معها بوضوح.','1-2,3-4,5-6,7+','تتسق الأنشطة المنفذة مع نواتج التعلم المستهدفة في المنهج|ينفّذ المعلم إستراتيجيات تدريس تتّسق مع نواتج التعلم المستهدفة|يُنفذ المعلم إستراتيجيات وأنشطة تدعم تنفيذ المنهج وفقًا للخطة الزمنية|يُنفذ المعلم محتوى الدرس وفقًا للمنهج المعتمد|يُفعّل المعلم إستراتيجيات تدريس متنوعة تراعي الفروق الفردية|تتنوع الأنشطة التعليمية بما يستوفي نواتج التعلم المستهدفة|يدعم المعلم الأنشطة التعليمية بمصادر تعلم متنوعة'),
I('2-1-1-3','تتنوع إستراتيجيات التدريس وفقًا لقدرات المتعلمين وتراعي الفروق الفردية بينهم.','1-2,3-4,5,6+','يطبق المعلم إستراتيجيات تعليم وتعلم متنوعة تراعي خصائص المرحلة العمرية (3 أو أكثر)|تحفز الإستراتيجيات المتعلمين على المشاركة والتعلم بأساليب متنوعة (2 أو أكثر)|تحفز الإستراتيجيات المتعلمين على المشاركة والتعلم بأساليب مبتكرة|تتنوع في بيئة الصف إستراتيجيات تُلبي احتياجات جميع المتعلمين|تدعم بيئة الصف إستراتيجيات تراعي الفروق الفردية بين المتعلمين وقدراتهم|تدعم بيئة الصف تعلم منخفضي الأداء من خلال أساليب وطرق متنوعة'),
I('2-1-1-4','يستخدم المعلم مصادر تعلم رقمية تلبي احتياجات المتعلمين بمختلف فئاتهم.','1-2,3-4,5,6+','يوظّف المعلم داخل الصف مصادر تعلم رقمية متنوعة|يقدم المعلم أنشطة تعلم رقمية متنوعة (2 أو أكثر) تتسق مع الموقف ونواتج التعلم|يوظف المتعلمون التطبيقات والأدوات والمنصات الرقمية لدعم تعلمهم|يدمج المعلم التقنية الرقمية بأساليب متنوعة بما يعزز نواتج التعلم|يدمج المعلم التقنية الرقمية بأساليب مبتكرة بما يعزز نواتج التعلم|تشجع بيئة التعلم المتعلمين على استخدام مصادر التعلم الرقمية',null,'إذا استخدم المعلم جهاز العرض للعرض فقط فهذا لا يعني ممارسة التعلم الرقمي'),
I('2-1-1-5','تنفذ المدرسة أنشطة تعليم وتعلم تركز على تطبيقات عملية ترتبط بحياة المتعلمين.','1-2,3-4,5,6+','تحفز بيئة الصف المتعلمين على تطبيق المعرفة والمهارات في مواقف حياتهم|تُنفّذ أنشطة تعلم تطبيقية تربط المحتوى بمواقف جديدة من واقع الحياة|يوظف المعلم أدوات ومصادر من واقع الحياة بأساليب متنوعة (2 أو أكثر)|يوظف المعلم أدوات ومصادر من واقع الحياة بأساليب مبتكرة|يوظّف المعلم أساليب تعليم تركز على التطبيق العملي للمعارف والمهارات|ينوع المعلم الأنشطة والتطبيقات العملية المرتبطة بحياة المتعلمين (2 أو أكثر)'),
I('2-1-1-6','تشجع بيئة التعلم داخل الصف على تنمية مهارات القراءة والكتابة لدى المتعلمين.','1-2,3-4,5,6+','توجد مصادر متنوعة في بيئة الصف تدعم تنمية مهارات القراءة والكتابة|تدعم بيئة الصف برامج وأنشطة إثرائية مبتكرة للقراءة والكتابة|يقدم المعلم أنشطة تعلم تركز على تنمية مهارات القراءة|يوظف المتعلمون مهارات القراءة والكتابة في أنشطة متنوعة (2 أو أكثر)|يعزز المعلم مهارات الفهم القرائي بأساليب متنوعة|يتابع المعلم مستوى تقدم المتعلمين في القراءة والكتابة',null,'تشمل دعم مهارات القراءة والكتابة في جميع التخصصات الإنسانية والطبيعية'),
I('2-1-1-6','تشجع بيئة التعلم داخل الصف على تنمية المهارات العددية (الحساب) لدى المتعلمين.','1-2,3-4,5,6+','توجد مصادر في بيئة الصف تدعم تنمية المهارات العددية|يستخدم المعلم طرقًا وأساليب متنوعة (2 أو أكثر) تعزز المهارات العددية|تدعم بيئة التعلم برامج وأنشطة إثرائية مبتكرة للمهارات العددية|يقدم المعلم أنشطة تعلم تركز على تنمية المهارات العددية|يوظف المتعلمون المهارات العددية في تنفيذ أنشطة التعلم|يتابع المعلم مستوى تقدم المتعلمين في المهارات العددية',null,'تشمل دعم المهارات العددية في جميع التخصصات الإنسانية والطبيعية'),
I('2-1-1-7','تشجع الممارسات التدريسية على تنمية مهارات التفكير والبحث والابتكار لدى المتعلمين.','1-2,3-4,5,6+','تشجع بيئة الصف مهارات التفكير الناقد (التحليل، الاستنتاج، التقويم)|تعزز بيئة الصف مهارات التفكير الإبداعي (الطلاقة، المرونة، الأصالة)|تدعم بيئة الصف تنمية مهارات البحث وحل المشكلات بأساليب متنوعة|تعزز بيئة الصف الابتكار من خلال الأنشطة والمشروعات|تهيئ بيئة الصف برامج إثرائية متنوعة (2 أو أكثر) لمهارات البحث والتفكير|تهيئ بيئة الصف برامج إثرائية مبتكرة لمهارات البحث والتفكير'),
I('2-1-1-8','تشجع بيئة التعلم تنمية المهارات العاطفية والاجتماعية لدى المتعلمين.','1-2,3-4,5-6,7+','تحفز بيئة الصف على التواصل الفعال (اللفظي أو باستخدام لغة الجسد)|تشجع بيئة الصف على التعاطف والاحترام المتبادل بين المتعلمين|تدعم بيئة الصف التعاون والعمل بروح الفريق بأساليب متنوعة|تدعم بيئة الصف التعاون والعمل بروح الفريق بأساليب مبتكرة|تعزز بيئة الصف ثقة المتعلمين في أنفسهم وقدرتهم على الحوار|تشجع بيئة الصف على تنمية القدرة على ضبط الانفعالات|يعبر المتعلمون عن مشاعرهم وأفكارهم بثقة ووضوح'),
I('2-1-1-9','يستخدم المعلم أساليب تحفيز تعزز الدافعية لدى المتعلمين.','1-2,3-4,5,6+','تحقق بيئة الصف الرفاه للمتعلمين وتشجعهم على التعلم|تدعم بيئة الصف أنشطة تعلم تراعي ميول المتعلمين واهتماماتهم|تعزز أنشطة التعلم الفضول وحب الاستطلاع لدى جميع المتعلمين|تحفز بيئة الصف المتعلمين على المشاركة بإيجابية بأساليب متنوعة|تحفز بيئة الصف المتعلمين على المشاركة بإيجابية بأساليب مبتكرة|يعزز المعلم دافعية المتعلمين للتعلم باستخدام أساليب مناسبة'),
I('2-1-1-9','يشارك المتعلمون في أنشطة التعلم بفاعلية، ويستمتعون بها.','1-2,3-4,5,6+','تعزز بيئة الصف مشاركة المتعلمين في الأنشطة بأساليب متنوعة (2 أو أكثر)|تعزز بيئة الصف مشاركة المتعلمين في أنشطة التعلم بأساليب مبتكرة|يُشارك المتعلمون في تنفيذ أنشطة التعلم بإيجابية مع أقرانهم|يُظهر المتعلمون الاستمتاع والرغبة في التعلم|يُظهر المتعلمون الاندماج في تنفيذ أنشطة التعلم|تشجع بيئة الصف المتعلمين على المبادرة للمشاركة في أنشطة التعلم'),
I('2-2-1-1','يستخدم المعلمون أساليب وأدوات تقويم متنوعة تشخيصية وبنائية وختامية؛ للكشف عن الفروق الفردية في مستويات أداء المتعلمين.','1-2,3,4,5','يُطبق المعلم أساليب تقويم تشخيصية في بداية الموقف التعليمي|يطبق المعلم أساليب تقويم بنائية أثناء الموقف التعليمي|ينفذ المعلم أساليب تقويم ختامية في نهاية الموقف التعليمي|يطبق المعلم أدوات تقويم مبتكرة للكشف عن الفروق الفردية|يوظف المعلم أساليب وأدوات تقويم متنوعة (2 أو أكثر) في الكشف عن الفروق الفردية'),
I('2-2-1-2','يطبق المعلم أساليب وأدوات تقويم متنوعة؛ لقياس مستوى تحقق نواتج التعلم المستهدفة في المنهج لدى المتعلمين.','1-2,3-4,5,6+','يشجع المعلم المتعلمين على تقويم تعلمهم لتحديد جوانب القوة وفرص التحسين|يوظف المعلم مواقف تقويم متنوعة للتحقق من توظيف المعارف والمهارات في مواقف جديدة|يتابع المعلم باستمرار تقدم المتعلمين خلال عملية التعلم|يطبق المعلم أدوات تقويم متنوعة لقياس نواتج التعلم المستهدفة|يطبق المعلم أدوات تقويم مبتكرة لقياس نواتج التعلم المستهدفة|يُشرك المعلم المتعلمين في تقويم أدائهم وتحديد الجوانب التي تحتاج إلى تحسين'),
I('2-2-1-4','يقدم المعلم تغذية راجعة متنوعة للمتعلمين حسب الموقف التعليمي تركز على تحسين أدائهم.','1-2,3-4,5,6+','يقدم المعلم تغذية راجعة فورية أثناء التعلم|يقدم المعلم التغذية الراجعة بأساليب متنوعة بما يناسب طبيعة المهمة|يقدم المعلم تغذية راجعة بأساليب مبتكرة|يقدم المعلم تغذية راجعة بناءة مرتبطة بالموقف التعليمي|تلبي التغذية الراجعة المقدمة احتياجات المتعلمين|التغذية الراجعة المقدمة واضحة ومحددة'),
I('3-2-1-1','يظهر المتعلمون الاعتزاز بالقيم والهوية الوطنية.','1-2,3,4,5+','يظهر المتعلمون احترامهم للرموز الوطنية|يشارك المتعلمون بفاعلية في الأنشطة التي تتناول منجزات المملكة وحضارتها|يعبر المتعلمون عن اعتزازهم بانتمائهم للوطن وولائهم لقيادته|يطبق المتعلمون القيم الإسلامية في تعاملهم مع زملائهم ومعلميهم|يظهر المتعلمون حرصًا على المحافظة على مقدرات الوطن وموارده'),
I('3-2-1-2','يظهر المتعلمون الاتجاهات الإيجابية نحو ذواتهم والآخرين.','1-2,3-4,5,6+','يظهر المتعلمون الثقة بأنفسهم بأساليب متنوعة في المواقف الصفية|يظهر المتعلمون الثقة بأنفسهم بأساليب مبتكرة في المواقف الصفية|يعبر المتعلمون عن آرائهم بثقة واحترام أمام زملائهم ومعلميهم|يُظهر المتعلمون اتجاهات إيجابية من خلال سلوكيات قابلة للملاحظة|يتفاعل المتعلمون بإيجابية مع المواقف الصفية لفظيًا وسلوكيًا|يُظهر المتعلمون تقديرًا لجهود الآخرين وإسهاماتهم'),
I('3-2-1-3','يظهر المتعلمون التزامًا بالممارسات الصحية السليمة.','1-2,3,4,5+','يظهر المتعلمون وعيًا بالنظافة الشخصية والمظهر العام في بيئة الصف|يشارك المتعلمون في الأنشطة التي تُعزّز الوعي بالصحة والسلامة|يلتزم المتعلمون بالممارسات الصحية السليمة أثناء الحصة|يُظهر المتعلمون يقظة ذهنية ونشاطًا مناسبًا أثناء تنفيذ الأنشطة|يُراعي المتعلمون متطلبات الصحة والسلامة أثناء استخدام الأدوات'),
I('3-2-1-5','يلتزم المتعلمون بقواعد السلوك والانضباط المدرسي.','1-2,3-4,5,6+','يلتزم المتعلمون بقواعد الانضباط المدرسي في بيئة الصف|يُظهر المتعلمون سلوكًا مهذبًا في التعامل مع المعلم وزملائهم|يلتزم المتعلمون بالتعليمات والإجراءات المنظمة للعمل داخل الصف|يُظهر المتعلمون قدرة على ضبط سلوكهم وتصحيحه ذاتيًا|يُظهر المتعلمون مسؤولية ذاتية في المواقف الصفية|يحافظ المتعلمون على النظام بما يضمن استمرارية التعلم'),
I('3-2-1-6','يظهر المتعلمون الاستقلالية والقدرة على التعلم الذاتي.','1-2,3,4,5+','يظهر المتعلمون القدرة على البحث عن المعلومات باستخدام مصادر مناسبة|يُظهر المتعلمون القدرة على إدارة وقت التعلم أثناء أداء الأنشطة والمهام|يبادر المتعلمون إلى بدء المهام وتنفيذها دون انتظار توجيه مستمر|يظهر المتعلمون القدرة على تحمل المسؤولية في أداء مهامهم باستقلالية|يتحمّل المتعلمون مسؤولية مراجعة أخطائهم وتحسين أدائهم'),
I('3-2-1-7','يظهر المتعلمون الاعتزاز بثقافتهم واحترام التنوع الثقافي في المجتمع.','1-2,3,4,5+','يظهر المتعلمون اهتمامهم بالمحافظة على تراث المملكة التاريخي والثقافي والحضاري|يُظهر المتعلمون اعتزازهم باللغة العربية|يتفاعل المتعلمون بإيجابية مع الاختلافات الثقافية بين زملائهم|يتحدث المتعلمون باللغة العربية في المواقف الصفية المناسبة|يُظهر المتعلمون احترامهم للعادات والتقاليد الثقافية المتنوعة')
]},
{id:'env',title:'بطاقة ملاحظة البيئة التعليمية',short:'البيئة التعليمية',group:'main',multi:false,mark:'ب',meta:[],items:[
I('1-1-3-1','يسود المدرسة علاقات إيجابية والعمل بروح الفريق بين منسوبيها.','1,2,3,4+','تظهر العلاقات الإيجابية والاحترام المتبادل بين منسوبي المدرسة بوضوح|تتواجد الإدارة المدرسية ميدانيًا وتدعم المعلمين في أثناء العمل|يسود التعاون بين منسوبي المدرسة في أداء المهام المشتركة|يظهر في البيئة التعليمية ما يدعم التواصل بين المنسوبين بأساليب متنوعة'),
I('1-1-5-2','تنفذ المدرسة إجراءات تضمن مناخًا آمنًا للتعلم والنمو نفسيًا واجتماعيًا.','1-2,3,4,5+','تخلو البيئة التعليمية من مصادر التهديد أو الخوف|تظهر العلاقات الاجتماعية الإيجابية والاحترام المتبادل بين المتعلمين|تُهيأ في المدرسة مساحات تضمن مناخًا آمنًا للتعلم والنمو النفسي والاجتماعي|تهيئ المدرسة بيئة تعليمية تحد من فرص حدوث التنمر أو الإساءة|تُهيأ المرافق بما يدعم الراحة النفسية للمتعلمين'),
I('3-2-1-1','يظهر المتعلمون الاعتزاز بالقيم والهوية الوطنية.','1-2,3,4,5+','يظهر المتعلمون التزامًا بالقيم الإسلامية في سلوكهم داخل البيئة التعليمية|يظهر المتعلمون الاعتزاز بالهوية الوطنية|تعكس بيئة المدرسة مظاهر الانتماء للوطن والولاء لقيادته|تُبرز بيئة المدرسة أعمالًا ومنتجات متنوعة للمتعلمين في الأنشطة والمناسبات الوطنية|تظهر في البيئة التعليمية أعمال أو منتجات مبتكرة للمتعلمين تعبر عن القيم والهوية الوطنية'),
I('3-2-1-3','يظهر المتعلمون التزامًا بالممارسات الصحية السليمة.','1,2,3,4+','يمارس المتعلمون ما يحافظ على صحتهم وسلامتهم من الأمراض|يظهر المتعلمون اهتمامًا بالنظافة الشخصية والمظهر العام|يظهر المتعلمون التزامًا بالممارسات الغذائية السليمة|يشارك المتعلمون في الأنشطة البدنية والعملية المتنوعة'),
I('3-2-1-5','يلتزم المتعلمون بقواعد السلوك والانضباط المدرسي.','1-2,3,4,5+','يظهر المتعلمون التزامًا ذاتيًا بقواعد الانضباط دون الحاجة إلى توجيه متكرر|يلتزم المتعلمون بالنظام العام في الساحات والمرافق المشتركة|يحافظ المتعلمون على الهدوء وقواعد السلوك في المرافق وعند ممارسة الأنشطة|يُظهر المتعلمون سلوكًا مهذبًا في التعامل مع زملائهم ومعلميهم|يجسد المتعلمون المسؤولية الذاتية في المحافظة على نظافة المرافق والممتلكات'),
I('3-2-1-7','يظهر المتعلمون الاعتزاز بثقافتهم واحترام التنوع الثقافي في المجتمع.','1,2,3,4+','يظهر المتعلمون الاعتزاز باللغة العربية والتحدث بها بصورة سليمة|يظهر المتعلمون اهتمامًا بتراث المملكة والمحافظة عليه في البيئة التعليمية|يظهر المتعلمون احترامًا للتنوع الثقافي في تعاملهم مع الآخرين|يشارك المتعلمون بأعمال ومنتجات تعكس اعتزازهم بالثقافة السعودية'),
I('4-1-1-1','توفر المدرسة مبنى تعليميًا وخدمات مساندة تستوفي المواصفات والاشتراطات المعتمدة بما يلبي متطلبات العملية التعليمية.','1-2,3,4,5+','يستوفي المبنى المدرسي المواصفات والاشتراطات المعتمدة من الجهات المختصة|يحافظ المبنى المدرسي على المظهر الحضاري|توفر المدرسة مرافق وخدمات مساندة متنوعة (2 فأكثر)|يحقق المبنى المدرسي متطلبات داعمة تلبي احتياجات المتعلمين والمنسوبين|تتيح المرافق والخدمات المساندة للمتعلمين استعمالًا فعليًا وآمنًا'),

I('2-1-1-6','تقدم المدرسة برامج وأنشطة متنوعة؛ لتنمية مهارات القراءة والكتابة والمهارات العددية لدى المتعلمين.','1-2,3-4,5,6+','يطبق المتعلمون أنشطة تعلم تنمي مهارات القراءة والكتابة|يطبق المتعلمون أنشطة تعلم تنمي المهارات العددية (الحساب)|توجد أنشطة علاجية وإثرائية متنوعة لتنمية مهارات القراءة والكتابة|توجد أنشطة علاجية وإثرائية متنوعة لتنمية المهارات العددية (الحساب)|تنفذ المدرسة برامج وأنشطة تعلم متنوعة أو مبتكرة تنمي مهارات القراءة والكتابة لدى جميع المتعلمين|تنفذ المدرسة برامج وأنشطة تعلم متنوعة أو مبتكرة تنمي المهارات العددية لدى جميع المتعلمين','ما الأنشطة التي تساعدك على تعلم القراءة والكتابة؟ أعطنا مثالًا.|ما أكثر الأنشطة التي تستمتع بها وتساعدك على القراءة أو الكتابة؟|ما الأنشطة التي تساعدك على تعلم الحساب؟ أعطنا مثالًا.|هل تستخدمون ألعابًا أو مسابقات أو مواقف من الحياة لتعلم الحساب؟ أعطنا مثالًا.|إذا احتجت إلى مساعدة في القراءة أو الكتابة أو الحساب، ماذا تقدم لك المدرسة؟|كيف يساعد المعلم من لديهم مهارات عالية في القراءة أو الحساب لتطوير مهاراتهم؟'),
I('2-2-1-4','تقدم المدرسة تغذية راجعة تساعد على التعلم وتحسين الأداء بشكل مستمر.','1-2,3-4,5,6+','يقدم المعلمون تغذية راجعة فورية أثناء التعلم|تعزز التغذية الراجعة التعلم الذاتي لدى المتعلمين|تقدم المدرسة تغذية راجعة بنّاءة لجميع المتعلمين بطرق متنوعة (2 فأكثر) أو مبتكرة|تُسهم التغذية الراجعة المستمرة في دعم تعلّم المتعلمين وتحسين أدائهم|تتابع المدرسة مستوى تقدم المتعلمين بشكل مستمر|تقدم المدرسة تغذية راجعة لجميع المتعلمين بطرق مبتكرة','كيف يخبركم المعلمون إذا كان أداؤكم جيدًا أو بحاجة إلى تحسين؟|ماذا يفعل المعلم كي يساعدكم عندما تخطئون أو لا تفهمون الدرس؟|ما الذي تفعله عندما تعرف أنك أخطأت في الإجابة؟|ما الأساليب التي يستخدمها المعلم حتى يخبركم بمستوى أدائكم؟ وهل تساعدكم على تحسين وتطوير أدائكم؟','يطلب المحاور من المتعلمين أثناء طرح الأسئلة أمثلة دالة على تأثير التغذية الراجعة في دعم تعلمهم'),
I('3-2-1-2','يظهر المتعلمون القدرة على التحدث بثقة والمشاركة بإيجابية مع زملائهم.','1-2,3-4,5,6+','يظهر المتعلمون اتجاهات إيجابية نحو ذواتهم والآخرين|يظهر المتعلمون تقديرًا لذواتهم واحترامًا لزملائهم أثناء الحديث والتفاعل|يشارك المتعلمون بإيجابية مع زملائهم في أنشطة التعلّم والعمل بروح الفريق|يعبر المتعلمون عن آرائهم بثقة|يظهر المتعلمون مهارات التحدث والتعبير عن الرأي بأساليب متنوعة|يستمع المتعلمون إلى آراء زملائهم، ويناقشونها باحترام، ويتقبلون اختلاف الرأي','كيف يعاملكم المعلم وزملاؤكم في المدرسة؟ وكيف تتعاملون أنتم معهم؟|هل تعملون مع زملائكم في أنشطة أو مجموعات داخل الفصل؟ أعط مثالًا.|كيف تتصرف إذا أخطأ زميلك في الإجابة؟ أو لم تعجبك الفكرة التي طرحها؟|كيف يشجعكم المعلم على المشاركة مع زملائكم في الأنشطة داخل الصف وخارجه؟|هل تعبرون عن آرائكم في الفصل بدون تردد؟ أعط مثالًا على ذلك.|هل يشجعكم المعلم على التحدث دون تردد؟ كيف؟'),
I('3-2-1-4','يشارك المتعلمون في الأنشطة المجتمعية والأعمال التطوعية.','1-2,3-4,5,6+','يشارك المتعلمون في الأنشطة المجتمعية داخل المدرسة|يشارك المتعلمون في الأنشطة والأعمال التطوعية المتنوعة|يشارك المتعلمون في الأنشطة المجتمعية والأعمال التطوعية خارج المدرسة بالتنسيق مع الجهات المختصة|يتلقى المتعلمون دعمًا متنوعًا من المدرسة للمشاركة في الأنشطة المجتمعية والأعمال التطوعية|تحفز المدرسة المتعلمين على المشاركة في العمل التطوعي من خلال تكريم المتميزين بشكل مستمر|تتابع المدرسة المتعلمين في الأنشطة المجتمعية والأعمال التطوعية','ما الأعمال التطوعية التي شاركتم بها داخل المدرسة؟|ما الأنشطة والأعمال التي تخدم المجتمع حولكم وشاركتم بها داخل المدرسة أو خارجها؟|ما الأساليب التي تستخدمها المدرسة لتشجيعكم على العمل التطوعي؟|كيف تساعدكم المدرسة عند مشاركتكم في الأعمال التطوعية؟'),
I('3-2-1-6','يظهر المتعلمون الاستقلالية، والقدرة على تحمل المسؤولية.','1-2,3-4,5,6+','يظهر المتعلمون قدرة على التعلم الذاتي من خلال البحث والاطلاع واستخدام مصادر التعلم المتنوعة|يتحمل المتعلمون مسؤولية تعلمهم وأعمالهم دون اعتماد كامل على الآخرين|يُظهر المتعلمون استقلالية في إنجاز المهام والأنشطة التعليمية المختلفة|يكتسب المتعلمون مهارات حياتية متنوعة كإدارة الوقت وحل المشكلات واتخاذ القرار|يمارس المتعلمون أدوارًا ومسؤوليات داخل الفصل والمدرسة (عريف، قائد)|توفر المدرسة أنشطة وبرامج متنوعة تشجع المتعلمين على تحمل المسؤولية والاستقلالية في التعلم','ما هي المهام أو الواجبات التي تستطيع القيام بها دون مساعدة الكبار؟|هل يكلفكم المعلم بمسؤوليات داخل الفصل؟ مثل ماذا؟|هل تقدم لكم مدرستكم أنشطة تعلمكم كيف تحلّون مشكلاتكم بأنفسكم؟|هل تشعرون بالثقة في اتخاذ قراراتكم الخاصة أثناء أداء الأنشطة المدرسية؟ كيف ذلك؟|كيف تشجعكم المدرسة على تحمل المسؤولية والاستقلالية في التعلم؟'),
I('3-2-1-7','يظهر المتعلمون الاعتزاز بثقافتهم واحترام التنوع الثقافي في المجتمع.','1-2,3-4,5,6+','يظهر المتعلمون اعتزازهم باللغة العربية من خلال استخدامها في الأنشطة الصفية والإذاعية والتواصل اليومي|يظهر المتعلمون وعيًا بتراث المملكة العربية السعودية التاريخي والثقافي والحضاري|يبرز المتعلمون أهمية المحافظة على تراث المملكة من خلال مشاركتهم في الأنشطة والبرامج المدرسية|يحترم المتعلمون التنوع الثقافي في المجتمع|تشجع المدرسة المتعلمين على احترام التنوع الثقافي|تنفذ المدرسة أنشطة وبرامج بأساليب متنوعة لتنمية وعي المتعلمين بالتراث واللغة العربية والتنوع الثقافي','هل تحب أن تتحدث باللغة العربية في المدرسة؟ متى تستخدمها؟|حدثنا عن مكان أو تراث أو عادة في المملكة تحبها ولماذا؟|إذا رأيت أحدًا لا يعرف عاداتنا أو ثقافتنا، كيف تتعامل معه؟|كيف تحافظ على تراث وطنك أو تعرّف الآخرين به؟ أعطنا مثالًا.|ما هي الأنشطة التي شاركتم فيها للتعريف بتراث المملكة؟'),
I('4-1-1-2','تنظيم مبنى المدرسة يتوافق مع خصائص المرحلة العمرية (ابتدائي، متوسط، ثانوي).','1-2,3-4,5,6+','يلبّي المبنى المدرسي احتياجات جميع المتعلمين|تنظّم المدرسة الأثاث والتجهيزات بما يحقق بيئة تعليمية جاذبة ومريحة|تتيح المدرسة لذوي الإعاقة إمكانية الوصول والحركة والتنقل بسهولة وأمان|تسهم بيئة المدرسة (المبنى والتجهيزات) في تحقيق الرفاه النفسي والجسدي للمتعلمين|تراعي المدرسة في تنظيم المبنى خصائص المرحلة العمرية للمتعلمين|توفر المدرسة بيئة آمنة تتيح لجميع المتعلمين التنقل والحركة داخل المبنى بسهولة','هل تشعر بالراحة في مدرستك؟ ولماذا؟|هل الفصل والساحة والمرافق مناسبة لكم؟|هل تستطيع الذهاب إلى المكتبة أو المصلى أو الملعب؟ هل الوصول لها بسهولة؟|هل المرافق مزدحمة أم تكفي جميع المتعلمين؟|هل يستطيع جميع زملائك استخدام مرافق المدرسة بسهولة؟')
];
const st2=st1.map(x=>Object.assign({},x,{ev:x.ev.slice(),q:x.q.slice()}));
const Q2=[
'كيف تضمن المدرسة المحافظة على حقوقكم وحمايتكم؟|إذا تعرض أحد المتعلمين لمشكلة أو احتاج لمساعدة، فما الجهات التي يمكنه اللجوء إليها؟|كيف تعرفكم المدرسة على آلية التواصل مع الجهات التي يمكن اللجوء لها عند الحاجة إلى الحماية؟|ما القنوات التي تتيحها المدرسة للإبلاغ عن المشكلات أو طلب المساعدة؟|كيف تتعامل المدرسة مع بلاغاتكم عندما يتعرض أحدكم للأذى؟',
'ما مصادر التعلم التي تقدمها المدرسة لتلبية احتياجاتكم؟|ما الأنشطة التي تقدمها المدرسة لكم؟|كيف يتيح المعلمون فرصًا متكافئة لكم في استخدام المصادر والمشاركة في الأنشطة؟|هل يدير معلموكم وقت الحصة بفاعلية بما يراعي احتياجاتكم ويمنحكم فرصة كافية للفهم والمشاركة؟ كيف يتم ذلك؟',
'ما هي الإستراتيجيات وطرق التدريس التي يستخدمها المعلم أثناء الدرس؟|هل تراعي إستراتيجيات التعليم والتعلم الفروق الفردية بينكم؟ أعط مثالًا.|ما الأساليب أو الأنشطة التي يستخدمها المعلمون لتلبية احتياجات جميع المتعلمين؟|كيف تشجعكم إستراتيجيات التعليم في المدرسة على المشاركة بفاعلية؟|هل يشارك جميع زملائكم في الدرس بمختلف قدراتهم؟ كيف؟',
'ما الأنشطة التطبيقية العملية التي يقدمها المعلمون لكم وترتبط بحياتكم؟|كيف تشجعكم المدرسة على تنفيذ تجارب أو مشروعات واقعية داخل المدرسة أو خارجها؟|كيف يساعدك تطبيق الأنشطة العملية في فهم الدروس بطريقة أفضل؟|أعط أمثلة لتطبيقكم المعارف والمهارات التي تعلمتموها في مواقف جديدة؟',
'ما الأنشطة أو البرامج التي تنفذها المدرسة لتنمية مهاراتك في القراءة والكتابة والمهارات العددية (الحساب)؟|ما الأساليب أو الطرق المبتكرة التي تجعل تعلم القراءة والكتابة أكثر تشويقًا ومتعة؟ أعطنا أمثلة عليها.|كيف تدعم المدرسة من لديهم صعوبات في القراءة أو الحساب لتطوير مهاراتهم؟|كيف تدعم المدرسة من لديهم مهارات عالية والموهوبين في القراءة أو الحساب؟|كيف تشجعكم أنشطة التعلم على تنمية المهارات القرائية والعددية للمنافسة في المسابقات الوطنية والدولية؟',
'كيف يقدم لكم المعلمون ملاحظاتهم أو توجيهاتهم أثناء التعلم لمساعدتكم على تحسين أدائكم؟|كيف تساعدكم التغذية الراجعة من المعلمين على تطوير تعلمكم الذاتي؟|ما الأساليب التي يقدم بها المعلمون التغذية الراجعة لكم؟|كيف تستفيدون من التغذية الراجعة في تحسين أدائكم بانتظام؟|كيف تتابع المدرسة تقدمكم الدراسي وتساعدكم في تحسين أدائكم باستمرار؟',
'كيف تساعدكم المدرسة على تكوين اتجاهات إيجابية نحو ذواتكم ونحو زملائكم؟|ما الأنشطة أو المواقف التي تشجعكم المدرسة من خلالها على التعاون والعمل بروح الفريق؟|ما الأساليب التي تستخدمها المدرسة لدعم مهاراتكم في التحدث والتعبير عن الرأي أمام الآخرين؟|كيف تسهم المدرسة في تعزيز ثقتكم بأنفسكم وتقديركم لذواتكم؟|عندما تختلف مع زميلك في الرأي ماذا تفعل؟',
'ما هي الأنشطة المجتمعية والأعمال التطوعية المتاحة للمشاركة فيها بالمدرسة؟|ما الأنشطة والأعمال التي شاركتم بها داخل المدرسة وخارجها؟|كيف تسهم المدرسة في دعم مشاركتكم بالأعمال التطوعية داخل المدرسة وخارجها؟|ما الأساليب التي تستخدمها المدرسة لتشجيع المتعلمين المتميزين على العمل التطوعي؟|كيف تتابع المدرسة مشاركتكم في الأنشطة المجتمعية والأعمال التطوعية؟',
'هل تتيح لكم المدرسة فرصًا لإنجاز مهام أو مشاريع تعليمية بشكل مستقل؟ مثل ماذا؟|كيف تُسهم الأنشطة والبرامج المدرسية في تنمية مهاراتكم في التعلم الذاتي؟|هل تتحملون مسؤوليات محددة داخل الفصل أو المدرسة؟ مثل ماذا؟|ما هي المهارات الحياتية التي اكتسبتموها من خلال الأنشطة؟',
'كيف تعزز المدرسة استخدامك للغة العربية في الأنشطة والتواصل اليومي؟|ما الأنشطة أو الفعاليات التي تنفذها المدرسة لتعريفك بثقافة المملكة وتاريخها وتراثها؟|كيف تشجعكم المدرسة على احترام التنوع الثقافي بين أفراد المجتمع؟|ما دورك تجاه تراث المملكة التاريخي والثقافي والحضاري؟',
'كيف تشعر تجاه البيئة التعليمية ومدى دعمها لراحتك ورفاهك أثناء التعلم؟|كيف تراعي المرافق أو الأماكن في المدرسة خصائص مرحلتكم العمرية؟|كيف تنظم المدرسة المساحات بما يتيح حرية الحركة والتفاعل الإيجابي بين المتعلمين؟|هل ترى أن الفصول والساحات والمرافق مناسبة لمرحلتكم الدراسية؟ كيف؟'];
st2.forEach((x,i)=>{x.q=Q2[i].split('|');});

I('1-1-2-2','تطبق المدرسة إجراءات محددة؛ لمتابعة الالتزام بقيم مهنة التعليم وأخلاقياتها.','1-2,3,4,5+','تعزز المدرسة قيم مهنة التعليم وأخلاقياتها في التعامل مع منسوبيها|تطبق المدرسة ممارسات متنوعة لتعزيز قيم مهنة التعليم وأخلاقياتها لدى منسوبيها|تطبق المدرسة إجراءات واضحة لمتابعة التزام منسوبيها بقيم المهنة بأساليب مبتكرة|ترسخ المدرسة قيم مهنة التعليم وأخلاقياتها بين منسوبيها بأساليب مبتكرة|يلتزم جميع منسوبي المدرسة بقيم المهنة وأخلاقياتها','كيف تعزز المدرسة قيم مهنة التعليم وأخلاقياتها في تعاملها مع منسوبيها؟|ما الممارسات التي تطبقها المدرسة لتعزيز قيم مهنة التعليم لدى منسوبيها؟|ما الأساليب التي تتبعها المدرسة في متابعة التزامكم بقيم مهنة التعليم وأخلاقياتها؟|ما الأساليب التي تطبقها المدرسة لترسيخ قيم مهنة التعليم بين منسوبيها؟|ما مدى التزام منسوبي المدرسة بقيم المهنة وأخلاقياتها؟ أعط مثالًا.'),
I('1-1-3-1','تعزز المدرسة العلاقات الإيجابية والتعاون في المجتمع المدرسي.','1-2,3-4,5-6,7+','تعزّز المدرسة ثقافة العمل بروح الفريق والتعاون بين منسوبيها|تُطبّق المدرسة ممارسات متنوعة تُسهم في ترسيخ بيئة قائمة على الاحترام المتبادل|تُطبّق المدرسة ممارسات مبتكرة تُسهم في ترسيخ بيئة قائمة على الاحترام المتبادل|تسود المدرسة علاقات إيجابية قائمة على الاحترام المتبادل بين منسوبيها|تطور المدرسة أساليب تعزيز العلاقات الإيجابية والتعاون بين منسوبيها|تعزز المدرسة التواصل الفعال بين منسوبيها بأساليب متنوعة|تتابع المدرسة أثر ممارسات تعزيز العلاقات الإيجابية والتعاون بين منسوبيها','ما الممارسات التي تطبقها المدرسة لتعزيز العمل بروح الفريق بين منسوبيها؟|ما الممارسات التي تطبقها المدرسة وتسهم في ترسيخ بيئة قائمة على الاحترام المتبادل والتعاون؟|كيف تطور المدرسة أساليب تعزيز العلاقات الإيجابية والتعاون بين منسوبيها؟|ما الأساليب التي توظفها المدرسة في تعزيز التواصل الفعال بين منسوبيها؟|ما الأساليب التي توظفها المدرسة في متابعة أثر تعزيز العلاقات الإيجابية والتعاون؟'),
I('1-1-4-1','توفر المدرسة بيئة عمل مهنية للمعلمين تضمن استقرارهم الوظيفي، واستبقائهم.','1-2,3,4,5+','تعزّز المدرسة بيئة مهنية جاذبة ومحفّزة للعمل تدعم الاستقرار الوظيفي للكادر التعليمي|تُوفر المدرسة بيئة عمل جاذبة بتجهيز المرافق التعليمية وتوفير الدعم الإداري والتقني اللازم|تُنفّذ المدرسة برامج دعم مهني مستمرة للمعلمين حديثي التعيين|تقدم المدرسة حوافز تسهم في تقدير المعلمين واستبقائهم|تحفز المدرسة الإبداع في العمل لتحقيق بيئة مهنية جاذبة','ما الممارسات في بيئة العمل التي تشجعكم على الاستقرار الوظيفي؟|ما الإجراءات التي تتخذها المدرسة لتوفير بيئة عمل جاذبة لكم؟|ما الدعم الذي تقدمه المدرسة للمعلمين حديثي التعيين، إن وجدوا؟|ما الممارسات التي تقوم بها المدرسة، ضمن صلاحياتها، لدعم استقرار المعلمين المؤهلين وتحفيزهم على الاستمرار؟|كيف تعزز المدرسة الإبداع في بيئة العمل؟'),
I('1-1-4-5','تدعم المدرسة منسوبيها على التطوير المهني المستمر بطرق متنوعة.','1-2,3-5,6-7,8+','تبني المدرسة خطة تطوير مهني شاملة تلبي احتياجات منسوبيها|تتضمن خطة التطوير المهني أنشطة وبرامج متنوعة|تتضمن خطة التطوير المهني أنشطة وبرامج مبتكرة|تنفذ المدرسة خطة تطوير مهني مرتبطة بنتائج التقويم المدرسي|تدعم المدرسة منسوبيها وتشجعهم على الالتحاق بالبرامج التدريبية وإجراء الدراسات والبحوث الإجرائية|تدعم المدرسة مشاركة منسوبيها في مجتمعات التعلّم المهنية|تشجّع برامج خطة التطوير المهني وأنشطتها على الابتكار في عمليات التعليم والتعلم والتقويم|تتابع المدرسة تنفيذ خطة التطوير المهني بأساليب متنوعة','كيف تُحدد المدرسة احتياجاتكم المهنية؟ وكيف تضمنها في خطة التطوير المهني؟|ما البرامج أو الأنشطة المهنية التي شاركت فيها ضمن خطة التطوير المهني، وكيف ارتبطت بنتائج التقويم المدرسي؟|ما الدعم الذي تقدمه المدرسة للمشاركة في البرامج التدريبية والبحوث الإجرائية؟|كيف تدعم المدرسة مشاركتكم في مجتمعات التعلّم المهنية؟|كيف تسهم برامج خطة التطوير المهني في تطوير ممارساتكم في عمليات التعليم والتعلم والتقويم؟|ما الأساليب التي تتخذها المدرسة لمتابعة تنفيذ خطة التطوير المهني؟'),
I('2-1-1-2','تدعم المدرسة المعلمين في تنفيذ المناهج؛ لتحقيق نواتج التعلم (المعارف، القيم، المهارات) المستهدفة لدى جميع المتعلمين.','1-2,3-4,5,6+','تدعم المدرسة المعلمين لتنفيذ المناهج وفق الخطة الدراسية بجودة عالية|توفر المدرسة مصادر تعلم متنوعة تدعم تحقيق نواتج التعلم المستهدفة|تدعم المدرسة تنفيذ المناهج بأنشطة تعليم وتعلم متنوعة تسهم في إكساب المتعلمين نواتج التعلم|تدعم المدرسة المعلمين في تنفيذ أنشطة تعليم وتعلم متنوعة لتحقيق التوقعات العالية لنواتج التعلم|تتابع المدرسة تنفيذ المناهج وفقًا للخطة الدراسية بأساليب متنوعة|تتابع المدرسة تنفيذ المناهج وفقًا للخطة الدراسية بأساليب مبتكرة','ما أساليب الدعم التي تقدمها المدرسة لكم لتنفيذ المناهج وفق الخطة الدراسية؟|ما مصادر التعلم التي توفرها المدرسة لدعم تحقيق نواتج التعلم المستهدفة؟|ما الأنشطة التي تدعم المدرسة تنفيذها لتحقيق المعارف والمهارات والقيم المستهدفة؟|كيف تدعمكم المدرسة في رفع مستوى تعلم المتعلمين والوصول بهم إلى نواتج التعلم المستهدفة؟|كيف تتابع المدرسة تنفيذ المناهج وفقًا للخطة الدراسية؟'),
I('2-1-1-4','تدعم المدرسة تفعيل التقنية الرقمية؛ لدعم التعلم وتلبية احتياجات المتعلمين.','1-2,3-4,5-6,7+','تدعم المدرسة تفعيل التقنية الرقمية لدعم التعلم وتلبية احتياجات المتعلمين|تدعم المدرسة بيئة التعلم بمصادر تعلم رقمية متنوعة لتنفيذ المناهج|تدعم المدرسة بيئة التعلم بتجهيزات تقنية متنوعة|تشجع المدرسة المعلمين على استخدام التقنية الرقمية وتفعيلها بأساليب متنوعة|تشجع المدرسة المعلمين على استخدام التقنية الرقمية وتفعيلها بأساليب مبتكرة|تلبي مصادر التعلم الرقمية احتياجات المتعلمين بمختلف فئاتهم|تحدّث المدرسة المصادر الرقمية والتجهيزات التقنية بما يواكب التطور التقني المستمر','كيف تدعم المدرسة تفعيل التقنية الرقمية في عملية التعلم؟|ما مصادر التعلم الرقمية التي تدعم بها المدرسة تنفيذ المناهج الدراسية؟|ما التجهيزات التقنية التي تدعم بها المدرسة بيئة التعلم من أجل تحقيق نواتج التعلم المستهدفة؟|كيف تشجعكم المدرسة على استخدام التقنية الرقمية وتفعيلها؟|كيف تلبي مصادر التعلم الرقمية احتياجات المتعلمين بمختلف فئاتهم؟|كيف تحدث المدرسة تجهيزاتها ومصادرها الرقمية لتلبية احتياجات المتعلمين؟'),
I('2-1-1-7','تقدم المدرسة برامج وأنشطة متنوعة؛ لتنمية مهارات التفكير والبحث والابتكار.','1-2,3-4,5,6+','تدعم المدرسة بيئة التعلم ببرامج وأنشطة تعلم متنوعة لتنمية مهارات التفكير الناقد والإبداعي|تنفذ المدرسة في بيئة التعلم برامج وأنشطة تشجع المتعلمين على ممارسة مهارات البحث والابتكار|تقدم المدرسة برامج وأنشطة إثرائية مبتكرة تنمي مهارات التفكير الناقد والإبداعي|تُطوّر المدرسة برامج تنمية مهارات التفكير الناقد والإبداعي بشكل مستمر|تُطوّر المدرسة برامج تنمية مهارات البحث والابتكار بشكل مستمر|تتابع المدرسة مستوى تقدم المتعلمين في مهارات التفكير وحل المشكلات والبحث والابتكار','ما الأنشطة الصفية التي تطبقونها لتنمية التفكير الناقد والإبداعي لدى المتعلمين؟|ما البرامج والأنشطة التي تنفذونها لتشجيع المتعلمين على ممارسة مهارات البحث والابتكار؟|كيف تراعي الأنشطة مستويات المتعلمين المختلفة في تنمية التفكير الناقد والإبداعي؟|ما الأساليب التي تتخذها المدرسة لتطوير مهارات التفكير الناقد والإبداعي والابتكار والبحث بشكل مستمر؟|ما الأدوات والأساليب التي تعتمدون عليها في متابعة مدى تقدم المتعلمين في مهارات التفكير وحل المشكلات والبحث؟'),
I('2-1-1-8','تدعم المدرسة تنمية المهارات العاطفية والاجتماعية لدى المتعلمين.','1-2,3-4,5-6,7+','تشجع بيئة التعلم على الاحترام والتعاطف بين المتعلمين (تقبل الرأي الآخر، تقبل التنوع، المبادرة في تقديم الدعم)|تدعم المدرسة بيئة التعلم بأنشطة لتنمية القدرة على التحكم في العواطف وضبط الانفعالات|تمكّن بيئة التعلم المتعلمين من التعبير عن مشاعرهم وأفكارهم|توفر المدرسة بيئة تعلم تحفز على التواصل الفعال|تعزز بيئة التعلم ثقة المتعلمين في أنفسهم وقدرتهم على الحوار|تتيح المدرسة للمتعلمين تنفيذ برامج وأنشطة تشجعهم على التعاون والعمل بروح الفريق بأساليب متنوعة|تتيح المدرسة للمتعلمين تنفيذ برامج وأنشطة تشجعهم على التعاون والعمل بروح الفريق بأساليب مبتكرة','ما الممارسات الصفية التي تنمي الاحترام وتقبل الاختلاف بين المتعلمين؟|كيف توظفون المواقف الصفية في تدريب المتعلمين على ضبط الانفعالات؟|كيف تمكن بيئة التعلم المتعلمين من التعبير عن مشاعرهم وأفكارهم، وتحفزهم على التواصل الفعال؟|كيف تعزز بيئة التعلم ثقة المتعلمين بأنفسهم؟ وكيف تدعم قدرتهم على الحوار؟|ما البرامج والأنشطة التي تنفذونها لتشجع المتعلمين على التعاون والعمل بروح الفريق؟'),
I('2-1-1-9','تحفز بيئة التعلم على المشاركة في الأنشطة والاستمتاع بالتعلم.','1-2,3-4,5,6+','توفر المدرسة بيئة تعلم داعمة تحقق الرفاه للمتعلمين وتعزز دافعيتهم نحو التعلم|توفر المدرسة في بيئة التعلم أنشطة تحفز الفضول لدى جميع المتعلمين|يشارك المتعلمون بفاعلية في أنشطة تعلم متنوعة|تدعم المدرسة بيئة التعلم بأنشطة تراعي ميول المتعلمين واهتماماتهم|تُطبّق المدرسة في بيئة التعلم أساليب تحفيزية متنوعة تشجع المتعلمين على المشاركة والاستمتاع بالتعلم|تُطبّق المدرسة في بيئة التعلم أساليب تحفيزية مبتكرة تشجع المتعلمين على المشاركة والاستمتاع بالتعلم','ما الممارسات التي تنفذها المدرسة لتوفير بيئة مدرسية مريحة ومحفزة للتعلم تدعم رفاه المتعلمين؟|ما الأنشطة التي توفرها المدرسة لتحفيز الفضول لدى جميع المتعلمين؟|كيف يشارك المتعلمون في أنشطة التعلم داخل الصف؟|كيف تتم مراعاة ميول المتعلمين واهتماماتهم في بيئة التعلم؟|ما الأساليب التحفيزية التي تُطبّقها المدرسة لتشجيع المتعلمين على المشاركة في أنشطة التعلم والاستمتاع بها؟'),
I('2-2-1-1','تطبق المدرسة أساليب وأدوات تقويم متنوعة تشخيصية وبنائية وختامية؛ للكشف عن الفروق الفردية في مستويات أداء المتعلمين المختلفة.','1-2,3-4,5-6,7+','تدعم المدرسة تطبيق أساليب تقويم تشخيصية في بداية الموقف التعليمي لتحديد مستوى أداء المتعلمين|تدعم المدرسة تطبيق أساليب تقويم بنائية أثناء الموقف التعليمي لتحديد مستوى التقدم وتحسين التعلم|تدعم المدرسة تطبيق أساليب تقويم ختامية في نهاية الموقف التعليمي لتحديد مستوى تحقق نواتج التعلم|تشجع المدرسة على توظيف أدوات التقويم في دعم عملية التعلم|توظف المدرسة أساليب وأدوات تقويم متنوعة للكشف عن الفروق الفردية في مستويات أداء المتعلمين|توظف المدرسة أساليب وأدوات تقويم مبتكرة للكشف عن الفروق الفردية في مستويات أداء المتعلمين|تُشرك المدرسة المتعلمين في تحديد مستوى أدائهم وتحسينه بطرق متنوعة','ما أساليب التقويم التي تطبقونها في مراحل الموقف التعليمي (قبل التعلم وفي أثنائه وبعده)؟|ما أدوات التقويم التي تستخدمونها لمتابعة تعلم المتعلمين؟|ما أساليب التقويم وأدواته التي توظفونها في الكشف عن الفروق الفردية بين المتعلمين؟|كيف تشركون المتعلمين في تقويم أدائهم وتحديد جوانب التحسين؟'),
I('2-2-1-2','تنفذ المدرسة أساليب وأدوات متنوعة؛ لتقويم نواتج التعلم (المعارف، القيم، المهارات) المستهدفة في مناهج التعليم.','1-2,3-4,5,6+','يوظف المعلم أدوات تقويم شاملة لتقويم نواتج التعلم (المعارف، المهارات، القيم)|يطبق المعلم أساليب وأدوات تقويم متنوعة لتقويم نواتج التعلم|يطبق المعلم أساليب وأدوات تقويم مبتكرة لتقويم نواتج التعلم|تدعم بيئة التعلم المتعلمين في تقويم تعلمهم لتحديد جوانب القوة وفرص التحسين|يتابع المعلم باستمرار تقدم المتعلمين خلال عملية التعلم لقياس مدى تحقق نواتج التعلم|تشرك المدرسة المتعلمين في تقويم أدائهم وتحديد الجوانب التي تحتاج إلى تحسين','ما أدوات التقويم التي توظفونها لتقويم نواتج التعلم؟|كيف يتم تحديد أساليب وأدوات التقويم بما يتناسب مع طبيعة نواتج التعلم المستهدفة، سواء كانت معارف أو مهارات أو قيمًا؟|كيف تتم مساعدة المتعلمين في تحديد جوانب القوة وفرص التحسين في أدائهم؟|كيف تتم متابعة تقدم المتعلمين خلال عملية التعلم لضمان التحسن المستمر؟|كيف تشركون المتعلمين في تقويم أدائهم؟ وما أثر ذلك في تحسين تعلمهم؟'),
I('2-2-1-3','يوظف المعلمون نتائج التقويم في تطوير ممارساتهم المهنية، وتحسين نواتج التعلم.','1-2,3-4,5,6+','تحلّل المدرسة نتائج تقويم أداء المتعلمين وتفسرها لتحسين نواتج التعلم|تحدد المدرسة الفجوة في الأداء وأسبابها استنادًا لنتائج التحليل|يوظف المعلمون نتائج التقويم في اتخاذ قرارات لتحسين الممارسات التعليمية|يبني المعلم خططًا علاجية وإثرائية تستند إلى تحليل نتائج التقويم لمعالجة جوانب الضعف ومجالات التحسين|تتابع المدرسة تنفيذ الخطط العلاجية والإثرائية بأساليب متنوعة|تتابع المدرسة تنفيذ الخطط العلاجية والإثرائية بأساليب مبتكرة','كيف تحلل المدرسة نتائج المتعلمين وتفسرها لتحسين نواتج التعلم؟|كيف تحدد المدرسة الفجوة في الأداء وأسبابها؟|كيف توظفون نتائج تقويم أداء المتعلمين في تحسين ممارساتكم التعليمية؟|كيف توظفون نتائج التقويم في معالجة جوانب الضعف ومجالات التحسين لنواتج التعلم؟|ما الأساليب التي تتابع بها المدرسة تنفيذ الخطط العلاجية والإثرائية؟')
]});

CARDS.push({id:'cns',title:'بطاقة مقابلة الموجه الطلابي',short:'مقابلة الموجه الطلابي',group:'int',multi:false,mark:'ط',meta:MC,items:[
I('1-1-2-1','تنفذ المدرسة برامج وأنشطة؛ لتعزيز القيم الإسلامية، والهوية الوطنية لدى المتعلمين، وتتابعها.','1-2,3-4,5,6+','تفعّل المدرسة المناسبات الدينية من خلال أنشطة مخططة تعزز القيم الإسلامية وتتيح للمتعلمين المشاركة الفاعلة|تفعّل المدرسة المناسبات الوطنية من خلال أنشطة مخططة تعزز الهوية الوطنية وتتيح للمتعلمين المشاركة الفاعلة|تنفذ المدرسة برامج وأنشطة متنوعة لتعزيز القيم الإسلامية والهوية الوطنية|تنفذ المدرسة برامج وأنشطة مبتكرة لتعزيز القيم الإسلامية والهوية الوطنية|تُتابع المدرسة تنفيذ البرامج والمناسبات المرتبطة بالقيم والهوية وتقيس أثرها في سلوك المتعلمين بأساليب متنوعة|تسهم البرامج والأنشطة في ترسيخ القيم الإسلامية والهوية الوطنية لدى المتعلمين','كيف تفعّل المدرسة المناسبات لتعزيز القيم الإسلامية لدى المتعلمين؟|كيف تفعّل المدرسة المناسبات لتعزيز الهوية الوطنية لدى المتعلمين؟|ما الأنشطة والبرامج التي تنفذها المدرسة لتعزيز القيم الإسلامية والهوية الوطنية؟|كيف تتابع المدرسة تنفيذ الأنشطة والبرامج؟ وما الأساليب المستخدمة لقياس أثرها في سلوك المتعلمين؟|كيف تسهم البرامج والأنشطة في ترسيخ القيم الإسلامية والهوية الوطنية لدى المتعلمين؟'),
I('1-1-2-3','تطبق المدرسة إجراءات محددة؛ لدعم الانضباط المدرسي، وتتابع الالتزام بها.','1-2,3-4,5,6+','تطبق المدرسة إجراءات محددة لتعزيز الانضباط المدرسي والحد من غياب المتعلمين وتأخرهم|تحفز المدرسة المتعلمين على الانضباط بأساليب متنوعة ومناسبة لمراحلهم العمرية|تعزز المدرسة الانضباط لدى المتعلمين بأساليب مبتكرة|تقيس المدرسة أثر إجراءات دعم الانضباط في التزام المتعلمين وتقدمهم في نواتج التعلم|تحدد المدرسة أسباب الغياب والتأخر والمخالفات المتكررة وتوظفها في تطبيق إجراءات الدعم المناسبة|تتابع المدرسة التزام المتعلمين بإجراءات الانضباط المدرسي بأساليب متنوعة','ما الإجراءات التي تطبقها المدرسة لدعم الانضباط المدرسي؟|كيف تحفز المدرسة المتعلمين على الانضباط المدرسي؟|كيف تقيس المدرسة أثر تلك الإجراءات في التزام المتعلمين وتحقيق نواتج التعلم؟|كيف تحدد المدرسة أسباب الغياب والتأخر والمخالفات المتكررة؟ وكيف توظف ذلك في إجراءات الدعم؟|كيف تتابع المدرسة التزام المتعلمين بإجراءات الانضباط المدرسي؟'),
I('1-1-2-4','تطبق المدرسة إجراءات محددة؛ للكشف عن المشكلات السلوكية، ومعالجتها.','1-2,3-4,5,6+','تطبق المدرسة إجراءات محددة للكشف عن المشكلات السلوكية لدى المتعلمين|تطبق المدرسة إجراءات متنوعة ومبتكرة للكشف عن المشكلات السلوكية|تنفذ المدرسة برامج وأنشطة وقائية داعمة للسلوك الإيجابي ومناسبة لجميع الفئات|تنفذ المدرسة برامج وأنشطة علاجية تستند إلى نتائج الكشف ودراسة أسبابها|تقدم المدرسة الدعم العلاجي بأساليب متنوعة ومناسبة لطبيعة المشكلات واحتياجات المتعلمين|تتابع المدرسة تنفيذ البرامج والخطط العلاجية وتقيس أثرها وفق مؤشرات ونتائج موثقة','ما الإجراءات التي تتبعها المدرسة للكشف عن المشكلات السلوكية لدى المتعلمين؟|ما البرامج والأنشطة الوقائية التي تنفذها المدرسة لدعم السلوك الإيجابي؟|كيف تبني المدرسة برامج وأنشطة علاجية للمشكلات السلوكية؟|ما الأساليب العلاجية التي تستخدمها المدرسة؟ وكيف تتابع أثرها؟'),
I('1-1-3-2','توفر المدرسة فرصًا لمشاركة الأسرة في الأنشطة والفعاليات التي تنفذها.','1-2,3-4,5-6,7+','تقدم المدرسة برامج وأنشطة متنوعة وفاعلة تعزز التواصل مع الأسرة|تقدم المدرسة برامج وأنشطة مبتكرة تعزز التواصل مع الأسرة|تتواصل المدرسة مع الأسرة بصورة فعّالة ومستمرة من خلال قنوات رسمية متنوعة وتوثّق النتائج|تتيح المدرسة فرصًا متنوعة لمشاركة الأسرة في الأنشطة وتستفيد من خبراتها في تنفيذها|تُشرك المدرسة الأسرة في دعم تعلم أبنائها ومتابعة تقدمهم والتحضير لمستقبلهم|تُشرك المدرسة الأسرة في تقويم خدماتها وتطويرها|تُشرك المدرسة الأسرة في تطوير الأنشطة والفعاليات التي تنفذها','ما البرامج والأنشطة التي تقدمها المدرسة لتعزيز التواصل مع الأسرة؟|ما الفرص التي تتيحها المدرسة لمشاركة الأسرة في الأنشطة والبرامج المدرسية؟|كيف تُشرك المدرسة الأسرة في دعم تعلم أبنائها، ومتابعة تقدمهم والتحضير لمستقبلهم؟|كيف تحافظ المدرسة على تواصل فعال ومستمر مع الأسرة؟|كيف تُشرك المدرسة الأسرة في تقويم خدماتها وتطويرها؟|كيف تُشرك المدرسة الأسرة في تطوير الأنشطة والفعاليات التي تنفذها؟'),
I('1-1-5-1','تطبق المدرسة إجراءات واضحة؛ للمحافظة على حقوق المتعلمين وحمايتهم.','1-2,3-4,5,6+','تطبق المدرسة إجراءات واضحة وآمنة للمحافظة على حقوق المتعلمين وحمايتهم، وتوثق التعامل مع الحالات وفق الأنظمة|توعي المدرسة المتعلمين بحقوقهم وواجباتهم وطرق طلب المساعدة والحماية بأساليب متنوعة ومناسبة|تطبق المدرسة أساليب مبتكرة لتوعية المتعلمين بحقوقهم|تزود المدرسة المتعلمين ببيانات التواصل المعتمدة للجهات المختصة بالحماية|تيسر المدرسة للمتعلمين الوصول إلى وسائل طلب الحماية والإبلاغ عند الحاجة|تعرّف المدرسة المتعلمين بآلية التواصل بجهات الحماية، وتتحقق من معرفتهم بكيفية استخدامها','ما الإجراءات التي تطبقها المدرسة للمحافظة على حقوق المتعلمين وحمايتهم؟|ما الأساليب التي تطبقها المدرسة لتوعية المتعلمين بحقوقهم وواجباتهم؟|كيف تزود المدرسة المتعلمين ببيانات التواصل مع الجهات المختصة بالحماية؟ وكيف تتحقق من معرفتهم بكيفية استخدامها؟|كيف تيسر المدرسة للمتعلمين الوصول إلى وسائل طلب الحماية والإبلاغ بما يتناسب مع أعمارهم؟|ما أساليب تعريف المتعلمين بآلية التواصل بالجهات المقدمة لخدمات الحماية؟'),
I('1-1-5-2','تنفذ المدرسة برامج وأنشطة لمعالجة مشكلات التنمر، والوقاية منها، وتتابع تنفيذها.','1-2,3-4,5,6+','تنفذ المدرسة برامج وأنشطة وقائية متنوعة للحد من التنمر|تطبق المدرسة برامج وأنشطة علاجية متنوعة لحالات التنمر|تنفذ المدرسة برامج وأنشطة تدعم النمو النفسي والاجتماعي للمتعلمين|تنفذ المدرسة أنشطة وبرامج تحقق مناخًا آمنًا للتعلم بأساليب متنوعة|تتابع المدرسة تنفيذ برامج الوقاية والعلاج للحد من التنمر بأساليب متنوعة|تتابع المدرسة تنفيذ برامج الوقاية والعلاج لمشكلات التنمر بأساليب مبتكرة','ما البرامج والأنشطة الوقائية التي تنفذها المدرسة للحد من التنمر؟|ما البرامج والأنشطة العلاجية التي تنفذها المدرسة للحد من التنمر؟|كيف تدعم المدرسة النمو النفسي والاجتماعي للمتعلمين؟|كيف توفر المدرسة مناخًا آمنًا للتعلم؟|كيف تتابع المدرسة تنفيذ البرامج والأنشطة الوقائية والعلاجية؟'),
I('2-2-1-3','توظف المدرسة نتائج تقويم أداء المتعلمين في بناء الخطط العلاجية والإثرائية، وتتابع تنفيذها.','1-2,3-4,5,6+','تحلل المدرسة نتائج تقويم أداء المتعلمين وتفسرها|توظف المدرسة نتائج التقويم في اتخاذ قرارات لبناء الخطط العلاجية|تبني المدرسة خططًا علاجية تستند إلى نتائج التقويم لتحقيق التوقعات العالية|تبني المدرسة خططًا إثرائية مرتبطة بنتائج تقويم المتعلمين|تتابع المدرسة تنفيذ الخطط العلاجية والإثرائية بأساليب متنوعة|تتابع المدرسة تنفيذ الخطط العلاجية والإثرائية بأساليب مبتكرة','كيف تحلل المدرسة نتائج تقويم أداء المتعلمين وتفسرها؟|كيف توظف المدرسة نتائج تقويم أداء المتعلمين في بناء الخطط العلاجية؟|كيف تبني المدرسة خططًا إثرائية وفق نتائج التقويم؟|كيف تتابع المدرسة تنفيذ الخطط العلاجية والإثرائية؟'),
I('3-2-1-1','يظهر المتعلمون الاعتزاز بالقيم والهوية الوطنية.','1-2,3-4,5,6+','يظهر 90% فأكثر من المتعلمين اعتزازًا بالقيم الإسلامية والهوية الوطنية وفق بيانات وأدوات قياس موثقة|تظهر القيم الإسلامية والهوية الوطنية في سلوك المتعلمين اليومي داخل المدرسة وخارجها|يشارك المتعلمون في مشروعات ومنتجات ومبادرات تبرز مقدرات المملكة ومكانتها ومنجزاتها|يشارك المتعلمون بفاعلية في المناسبات الوطنية بأساليب متنوعة|يظهر المتعلمون الانتماء للوطن والولاء لقيادته الرشيدة في سلوكهم وممارساتهم|يبتكر المتعلمون مبادرات وأعمالًا تعكس اعتزازهم بالقيم الإسلامية والهوية الوطنية','ما نسبة المتعلمين الذين يظهرون اعتزازًا بالقيم الإسلامية والهوية الوطنية؟ وعلى أي بيانات تستند المدرسة؟|كيف يظهر المتعلمون الاعتزاز بالقيم الإسلامية والهوية الوطنية؟|كيف يظهر المتعلمون اعتزازهم بهوية المملكة ومقدراتها ومكانتها ومنجزاتها؟|كيف يشارك المتعلمون في المناسبات الوطنية؟|كيف يظهر المتعلمون انتماءهم للوطن والولاء لقيادته الرشيدة؟|ما الأعمال والمبادرات التي تعكس اعتزاز المتعلمين بالقيم الإسلامية والهوية الوطنية؟'),
I('3-2-1-3','يظهر المتعلمون التزامًا بالممارسات الصحية السليمة.','1-2,3-4,5,6+','يُظهر 90% فأكثر من المتعلمين التزامًا بالممارسات الصحية السليمة وفق بيانات ومؤشرات موثقة|يظهر المتعلمون وعيًا بالنظافة الشخصية والغذاء الصحي، ويطبقون السلوكيات المرتبطة بهما|تنفذ المدرسة برامج وأنشطة متنوعة ومناسبة لتعزيز الممارسات الصحية السليمة|تقدم المدرسة دعمًا مناسبًا للصحة العقلية والنفسية والجسمية، وتحيل الحالات إلى الجهات المختصة|تتابع المدرسة التزام المتعلمين بالممارسات الصحية السليمة|تطور المدرسة مبادراتها وبرامجها لتعزيز التزام المتعلمين بالممارسات الصحية السليمة','ما نسبة المتعلمين الذين يظهرون التزامًا بالممارسات الصحية السليمة؟ وعلى أي بيانات تستند المدرسة؟|كيف يظهر المتعلمون وعيهم بالنظافة الشخصية والغذاء الصحي؟|ما البرامج والأنشطة التي تنفذها المدرسة لتعزيز الممارسات الصحية السليمة؟|كيف تدعم المدرسة الصحة العقلية والنفسية والجسمية للمتعلمين؟|كيف تتابع المدرسة التزام المتعلمين بالممارسات الصحية السليمة؟|كيف تطور المدرسة مبادراتها وبرامجها لتعزيز التزام المتعلمين؟'),
I('3-2-1-5','يظهر المتعلمون التزامًا بقواعد السلوك والانضباط المدرسي.','1-2,3-4,5-6,7+','يظهر لدى 90% فأكثر من المتعلمين التزام بقواعد السلوك والانضباط المدرسي وفق بيانات موثقة|يظهر المتعلمون احترامًا لمنسوبي المدرسة وزملائهم، ويلتزمون بالتعليمات ويتحملون مسؤولية سلوكهم|تُعد المدرسة أدلة ومنشورات تسهم في التوجيه النوعي للمتعلمين بقواعد السلوك والانضباط|تتابع المدرسة التزام المتعلمين بقواعد السلوك والانضباط بأساليب متنوعة|تتابع المدرسة التزام المتعلمين بقواعد السلوك والانضباط بأساليب مبتكرة|يظهر المتعلمون انضباطًا ذاتيًا في الالتزام بقواعد السلوك دون الحاجة إلى توجيه متكرر|يشارك المتعلمون في برامج وأنشطة متنوعة ومبتكرة لتعزيز التزامهم بقواعد السلوك والانضباط','ما نسبة المتعلمين الملتزمين بقواعد السلوك والانضباط المدرسي؟ وعلى أي بيانات تستند المدرسة؟|كيف يظهر التزام المتعلمين بقواعد السلوك والانضباط في تعاملهم مع منسوبي المدرسة وزملائهم؟|كيف توجّه المدرسة المتعلمين إلى قواعد السلوك والانضباط؟|كيف تتابع المدرسة التزام المتعلمين بقواعد السلوك والانضباط؟|كيف يظهر المتعلمون الالتزام دون الحاجة إلى توجيه متكرر؟|ما البرامج والأنشطة التي يشارك فيها المتعلمون لتعزيز التزامهم بقواعد السلوك والانضباط المدرسي؟')
]});
