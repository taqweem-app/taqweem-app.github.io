const PER_DEF={'الأولى':'7:00','الثانية':'7:45','الثالثة':'8:30','الرابعة':'9:15','الخامسة':'10:15','السادسة':'11:00','السابعة':'11:45','الثامنة':'12:30'};
function perTimes(){return Object.assign({},PER_DEF,DB.settings.perTimes||{});}
function remindOn(){const s=DB.settings.remind;return s==null?!isLegacyAcct():!!s;}
function perMin(t){const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'').trim());return m?(+m[1])*60+(+m[2]):null;}
let remTimer=null;
function remindTick(){if(!DB||!remindOn())return;const now=new Date(),mins=now.getHours()*60+now.getMinutes(),T=perTimes(),seen=DB.settings.remSeen||(DB.settings.remSeen={}),tk=today();
  Object.keys(seen).forEach(k=>{if(k.indexOf(tk)!==0)delete seen[k]});
  todayList().forEach(({v,cls})=>cls.forEach(ins=>{const m=ins.meta||{},st=perMin(T[m.period]);if(st==null||insDone('cls',ins))return;const left=st-mins,k=tk+'|'+ins.id;
    if(left<=10&&left>=0&&!seen[k]){seen[k]=1;saveNow();const msg='الحصة '+m.period+(left?' بعد '+left+' دقايق':' الحين')+': '+clsLabel(ins)+(m.teacher?' · '+m.teacher:'');
      toast(msg,'افتحها',()=>go({v:'fill',vid:v.id,cid:'cls',iid:ins.id,i:0}));try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
      try{if(window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('بطاقات التقويم',{body:msg+(coTxt(ins)?' · '+coTxt(ins):''),dir:'rtl',lang:'ar',tag:k}))}catch(e){}}}));}
function remindStart(){if(remTimer)return;remTimer=setInterval(remindTick,30e3);setTimeout(remindTick,3000);}

/* ---------- حالة توصيل الحصص: التطبيق يبلّغ اللوحة إذا نزلت، أو ليش ما نزلت ----------
   يكتب في حسابه: inAt (آخر مرة تحقق) و inErr (السبب لو تعذّر، وفاضي لو نجح). */
function inWhy(r){if(!r)return navigator.onLine===false?'ما فيه نت':'ما قدرت أجيب الحصص، تأكد من النت';
  if(r.err==='fetch')return r.status===403?(subState()==='expired'?'الاشتراك منتهي، فالحصص الجديدة موقفة لين يتجدد':subState()==='off'?'الحساب موقوف':subState()==='moved'?'الحساب مفتوح في جهاز ثاني':'ما عنده صلاحية يستلم الحصص (الحساب ما زال يتفعّل)'):!r.status?'انقطع النت أو الاتصال ضعيف':'خطأ من الخادم ('+r.status+')';
  if(r.err==='key')return 'تعذّر فك تشفير الحصص (مفتاح التوصيل ما وصل للجهاز)';
  if(r.err==='bad')return 'الحصص وصلت بس تعذّر قراءتها: '+String(r.msg||'').slice(0,120);
  return 'سبب غير معروف';}
let inRepBusy=false;
/* ملخص حالة الجهاز (أعداد بس، بدون أي محتوى) يوصل للوحة مع حالة التسليم، عشان نعرف لو شغل أحد مو ظاهر عنده */
function devDiag(){try{const st={};Object.keys(DB.stash||{}).forEach(k=>{const x=DB.stash[k];st[k==='anon'?'anon':k.slice(0,6)]=Object.keys((x&&x.visits)||{}).length});
  const vs=Object.values(DB.visits||{});let ev=0;vs.forEach(v=>Object.keys(v.cards||{}).forEach(c=>(v.cards[c]||[]).forEach(i=>{try{if(insHasData(c,i))ev++}catch(e){}})));
  return {n:vs.filter(v=>!v.deleted).length,e:ev,s:st,o:String(DB.owner||'').slice(0,6),u:String((DB.acct&&DB.acct.uid)||'')}}catch(e){return {}}}
function inReport(err){if(!acct()||(DB.sub&&DB.sub.moved))return;const now=Date.now(),dg=devDiag(),k=(err||'ok')+'|'+JSON.stringify(dg);
  if(DB.settings.inRepK===k&&now-(DB.settings.inRepAt||0)<(err?30:360)*60e3)return;if(inRepBusy)return;inRepBusy=true;
  const cur={m:err?String(err).slice(0,200):'',v:(typeof BUILD!=='undefined'?BUILD:''),d:devLabel()};
  /* ملخص كل جهاز لحاله (أعداد بس)، عشان لو المشترك عنده أكثر من جهاز يبين كل واحد في اللوحة */
  const path='/accounts/'+encodeURIComponent(acctEmail());
  fsReq('GET',path).then(doc=>{let old={};try{old=JSON.parse((doc&&doc.fields&&doc.fields.inErr&&doc.fields.inErr.stringValue)||'{}')||{}}catch(e){}
    const devs=Object.assign({},old.devs||{}),id=String(devId()||'x').slice(0,12);devs[id]=Object.assign({d:cur.d,at:now,v:cur.v,m:cur.m},dg);
    const ids=Object.keys(devs).sort((a,b)=>(devs[b].at||0)-(devs[a].at||0)).slice(0,6),keep={};ids.forEach(x=>keep[x]=devs[x]);
    const body={fields:{inErr:{stringValue:JSON.stringify(Object.assign(cur,dg,{devs:keep}))},inAt:{integerValue:String(now)}}};
    return fsReq('PATCH',path+'?updateMask.fieldPaths=inErr&updateMask.fieldPaths=inAt&currentDocument.exists=true',body);})
    .then(()=>{DB.settings.inRepK=k;DB.settings.inRepAt=now;saveNow();}).catch(()=>{}).then(()=>{inRepBusy=false});}
(function(){const _f=inboxFetch;inboxFetch=async function(force){let r;try{r=await _f(force)}catch(e){inReport('خطأ في التطبيق: '+String(e&&e.message||e).slice(0,150));throw e}
  try{if(r&&(r.o||r.same||r.none))inReport('');else if(r&&r.err&&!(r.err==='fetch'&&!r.status))inReport(inWhy(r));}catch(e){}return r;};
  const _a=autoSyncClasses;autoSyncClasses=function(){try{if(DB&&acct()&&navigator.onLine!==false&&subLocked()){const st=subState();inReport(st==='expired'?'الاشتراك منتهي، فالحصص الجديدة موقفة لين يتجدد':st==='off'?'الحساب موقوف':st==='moved'?'الحساب مفتوح في جهاز ثاني':st==='none'?'الحساب غير مفعّل':st==='clock'?'تاريخ جهازه راجع ورا، التطبيق مقفول لين يصححه':st==='stale'?'ما اتصل بالنت من أسبوع، التطبيق مقفول لين يتحقق':'');}}catch(e){}return _a.apply(this,arguments);};
  const _i=incomingApply;incomingApply=function(o){try{return _i.apply(this,arguments)}catch(e){inReport('الحصص وصلت بس تعذّر إضافتها: '+String(e&&e.message||e).slice(0,150));throw e}};})();

/* ---------- تنبيه قبل انتهاء الاشتراك: نافذة أول ما يفتح التطبيق (مرة باليوم) + إشعار الجهاز لو مسموح ---------- */
function renewNotify(){try{if(isLegacyAcct()||subState()!=='ok')return;const s=DB.sub;if(!s||!s.exp||s.legacy)return;
  const trial=s.plan==='trial',d=subDays();if(d==null||d>(trial?2:3))return;const t=today();if(DB.settings.renewNt===t)return;
  if(document.getElementById('scrim')||document.getElementById('gate')||document.getElementById('tour'))return;
  DB.settings.renewNt=t;saveNow();
  const dd=d<=0?'اليوم':d===1?'بكرة':d===2?'بعد يومين':'بعد '+d+' أيام';
  const msg=(trial?'التجربة المجانية تنتهي ':'اشتراكك ينتهي ')+dd+'. بعدها يتقفل التطبيق وما يبقى لك إلا تصدير تقاريرك. جدّد مع منشئ التطبيق عشان يستمر كل شي.';
  try{if(window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('بطاقات التقويم',{body:msg,dir:'rtl',lang:'ar',tag:'renew'}))}catch(e){}
  modal('<h3>'+(trial?'التجربة المجانية قربت تخلص':'اشتراكك قرب ينتهي')+'</h3><p>'+esc(msg)+'</p><div class="acts">'+(typeof supBtn==='function'?supBtn('تجديد الاشتراك','primary'):'')+'<button class="btn ghost" onclick="closeModal()">لاحقًا</button></div>','nudge');}catch(e){}}
/* التطبيق مقفول: صفحة التصدير بس مفتوحة، ونوضح له ليش */
(function(){const _v=vExport;vExport=function(){let h=_v.apply(this,arguments);try{if(acct()&&subHard(subState()))h=h.replace('<div class="wrap">','<div class="wrap"><div class="status bad">'+IC.alert+'<div class="grow"><b>التطبيق مقفول.</b> تقدر تصدّر تقاريرك وتطبعها بس، وترجع للصفحة الرئيسية بعد ما تجدّد.</div></div>')}catch(e){}return h};})();
/* ---------- تنظيف لمرة وحدة: حصص ما تخص المشترك (وصلت من النسخة القديمة قبل إلزام الدخول، مثل حصص الوالد).
   المرجع هو الجدول اللي أرسله منشئ التطبيق لهالمشترك. أي مدرسة من الجدول ما تخصه وما فيها ولا تقييم منه تنشال من جهازه ومن حسابه،
   وداخل مدارسه تنشال الحصص اللي ما هي له لو كانت فاضية. أي شي فيه تقييم يبقى مثل ما هو. ---------- */
let ownCleanBusy=false;
async function ownClean(){if(ownCleanBusy||!DB||!acct()||isLegacyAcct()||DB.settings.ownClean===1||subLocked()||navigator.onLine===false)return;
  ownCleanBusy=true;try{const r=await inboxFetch(true);if(!r||!(r.o||r.none))return;const o=r.o||null;
    if(o){try{incomingApply(o)}catch(e){}}
    const mine=new Set();if(o)schedPlan(o,true).forEach(g=>{const v=findVisitFor(g);if(v)mine.add(v.id)});
    let n=0;Object.values(DB.visits).forEach(v=>{if(v.src!=='sched'||mine.has(v.id))return;
      const has=Object.keys(v.cards||{}).some(cid=>(v.cards[cid]||[]).some(i=>{try{return insHasData(cid,i)}catch(e){return true}}));if(has)return;
      delete DB.visits[v.id];(DB.purged=DB.purged||{})[v.id]=Date.now();n++;});
    DB.settings.ownClean=1;saveNow();if(n){try{cloudSoon(500)}catch(e){}}if(n||o)render();}
  catch(e){}finally{ownCleanBusy=false;}}
/* يشتغل بعد أول مزامنة ناجحة مع الحساب، عشان يشمل اللي نزل من الحساب بعد */
(function(){const _c=cloudSync;cloudSync=async function(){const r=await _c.apply(this,arguments);try{if(cloudState==='ok'&&DB&&DB.settings.ownClean!==1)setTimeout(ownClean,300)}catch(e){}return r};})();
/* ---------- تنبيه التثبيت: لو فتح التطبيق من المتصفح (مو من أيقونة الشاشة) تطلع له نافذة تشرح كيف يضيفه.
   تختفي لما يكون مثبّت، ولو ضغط «لاحقًا» ما تطلع له إلا بعد يوم. الأفضل يثبّته قبل الدخول، لأن الآيفون يفصل بيانات الأيقونة عن سفاري ---------- */
let instEvt=window.__bip||null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instEvt=e;});window.addEventListener('tq-bip',()=>{if(window.__bip)instEvt=window.__bip});
/* العنوان الجديد: التطبيق نفسه يسجّل عامل التخزين (في القديم كانت الواجهة تسجّله) */
if(APP_TARGET==='new'&&'serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
function isStandalone(){try{return (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true}catch(e){return false}}
function installNudge(force){try{
  const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),and=/Android|HarmonyOS|HUAWEI/i.test(ua);
  if(isStandalone()||!(ios||and))return;if(typeof isLegacyAcct==='function'&&isLegacyAcct())return;
  if(!force){let t=0,nv='';try{t=+localStorage.getItem('tq_instLater')||0;nv=localStorage.getItem('tq_instNever')||''}catch(e){}if(nv||Date.now()-t<3*864e5)return;if(document.getElementById('scrim')||document.getElementById('instAsk'))return;
    /* أول شي سؤال صغير تحت، ما يغطي الشاشة */
    const dv=ios?((/iPad/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))?'الآيباد':'الآيفون'):'جوالك';
    const b=document.createElement('div');b.id='instAsk';b.className='instaskw';
    b.innerHTML='<div class="instask"><b>تبغى تثبّت التطبيق على شاشة '+dv+'؟</b><span>يفتح مثل أي تطبيق، بدون المتصفح.</span><div class="r"><button class="btn primary sm" onclick="instAns(1)">إيه، وريني كيف</button><button class="btn sm" onclick="instAns(2)">ذكّرني لاحقًا</button><button class="btn ghost sm" onclick="instAns(3)">لا تذكرني</button></div></div>';
    document.body.appendChild(b);return;}
  instGuide(ios,and);
}catch(e){}}
function instGo(){if(!instEvt)return;const e=instEvt;instEvt=null;e.prompt();e.userChoice.then(r=>{instClose();if(r.outcome==='accepted')toast('انضاف التطبيق لشاشتك ✓ افتحه من الأيقونة');}).catch(()=>{})}
window.addEventListener('appinstalled',()=>{try{instClose();const a=document.getElementById('instAsk');if(a)a.remove()}catch(e){}});
(function tryNudge(n){setTimeout(()=>{if(typeof DB==='undefined'||!DB){if(n<10)tryNudge(n+1);return}installNudge()},n?600:1800)})(0);
function instAns(k){const b=document.getElementById('instAsk');if(b)b.remove();try{if(k===2)localStorage.setItem('tq_instLater',Date.now());if(k===3)localStorage.setItem('tq_instNever','1')}catch(e){}if(k===1){if(instEvt&&!/iPhone|iPad|iPod/.test(navigator.userAgent))return instGo();installNudge(true)}}
/* شرح التثبيت خطوة خطوة: صورة وحدة كبيرة، وأزرار التالي والسابق، وزر إغلاق فوق دايم ظاهر */
let instI=0;
function instGuide(ios,and){instClose();instI=0;const ua=navigator.userAgent,ipad=/iPad/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),dev=ios?(ipad?'الآيباد':'الآيفون'):'جوالك';
  const el=document.createElement('div');el.id='instG';el.className='instg2';
  el.innerHTML='<div class="ic2"><div class="ih"><b>ثبّت التطبيق على '+dev+'</b><button class="ix" aria-label="إغلاق" onclick="instClose()">✕</button></div><div class="ib" id="instB"></div></div>';
  el.onclick=e=>{if(e.target===el)instClose()};document.body.appendChild(el);instDraw(ios);}
const INST_IOS=['اضغط <b>☰</b> تحت، داخل خانة الرابط','اضغط <b>«مشاركة»</b>','اضغط <b>«عرض المزيد»</b> في آخر صف','اضغط <b>«إضافة إلى الشاشة الرئيسية»</b>','اضغط <b>«إضافة»</b> فوق','خلاص! افتحه من شاشتك، وادخل لحسابك'];
function instDraw(ios){const B=document.getElementById('instB');if(!B)return;const ua=navigator.userAgent;
  if(!ios){B.innerHTML=(instEvt?'<p class="il">اضغط الزر، وبعدها اضغط «تثبيت».</p><button class="btn primary ibig" onclick="instGo()">تثبيت التطبيق</button>':
    '<ol class="helpl" style="font-size:18px;line-height:1.8;padding-right:22px;margin:0 0 12px"><li>اضغط <b>⋮</b> فوق.</li><li>اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.</li><li>اضغط <b>«تثبيت»</b>.</li></ol><button class="btn ibig" onclick="instClose()">تمام</button>');return;}
  const n=INST_IOS.length,i=instI,ns=/CriOS|FxiOS|EdgiOS|FBAN|FBAV|Instagram|Line\//.test(ua);
  B.innerHTML=(ns&&i===0?'<p class="iw">افتح الرابط في <b>سفاري</b> أول، وبعدها سوّ الخطوات.</p>':'')+
    '<p class="il"><span class="inum">'+(i<n-1?'٠١٢٣٤٥٦'[i+1]:'✓')+'</span><span>'+INST_IOS[i]+'</span></p><div class="iimg"><img src="guide/ios'+(i+1)+'.png" alt=""></div>'+
    '<div class="idots">'+INST_IOS.map((x,k)=>'<i class="'+(k===i?'on':'')+'"></i>').join('')+'</div>'+
    '<div class="inav">'+(i>0?'<button class="btn" onclick="instI--;instDraw(true)">السابق</button>':'<span></span>')+(i<n-1?'<button class="btn primary" onclick="instI++;instDraw(true)">التالي</button>':'<button class="btn primary" onclick="instClose()">تمام</button>')+'</div>'+
    (i===0?'<p class="ism">ما لقيت ☰؟ اضغط ••• أو زر المشاركة ⇪ تحت.</p>':'');
  [1,2,3,4,5,6].forEach(k=>{const im=new Image();im.src='guide/ios'+k+'.png'});}
function instClose(){const g=document.getElementById('instG');if(g)g.remove();}

/* الوالد: لو شغله القديم انحفظ جانبًا على جهازه (من قبل الدخول أو من حسابه القديم)، يرجع له لحاله. ما ينحذف شي */
function legacyRescue(){try{if(!DB||!acct()||!isLegacyAcct()||!DB.stash)return 0;let n=0;
  ['anon',typeof ALI_OLD_UID!=='undefined'?ALI_OLD_UID:''].forEach(k=>{const x=k&&DB.stash[k];if(!x||!x.visits||x.rescued)return;
    Object.values(x.visits).forEach(v=>{const cur=DB.visits[v.id];if(!cur){DB.visits[v.id]=v;n++}else if((v.updated||0)>(cur.updated||0)&&!cur.deleted){DB.visits[v.id]=v;n++}});x.rescued=Date.now();});
  if(n){saveNow();try{cloudSoon(1500)}catch(e){}render();toast('رجعت '+n+' زيارة من شغلك القديم ✓');}return n}catch(e){return 0}}
setTimeout(legacyRescue,2500);

/* ---------- الانتقال للعنوان الجديد (يتشغّل من اللوحة) ----------
   يطلع للمشترك على العنوان القديم بس، وبعد ما يتأكد من السيرفر إن كل شغله محفوظ في حسابه. ما يقفل شي ولا يمسح شي:
   يقدر يكمل هنا، وشغله يتزامن عادي، ولما ينقل يدخل بنفس رقمه وينزل له كل شي */
let moveOk=false,moveChk=0;
async function moveFetch(){try{if(APP_TARGET!=='old'||!acct())return;const d=await fsReq('GET','/cfg/move');const o=d?UF(d.fields):{};
    const was=JSON.stringify(DB.settings.move||null);DB.settings.move=o.on&&o.url?{url:String(o.url)}:null;if(JSON.stringify(DB.settings.move)!==was)saveNow();
    if(DB.settings.move&&!moveOk&&Date.now()-moveChk>60e3&&cloudState==='ok'){moveChk=Date.now();const v=await verifySynced();moveOk=v.ok;}
    if(S.v==='home')render();}catch(e){}}
function moveBanner(){const m=DB.settings&&DB.settings.move;if(APP_TARGET!=='old'||!m||!acct())return '';
  if(!moveOk)return '<div class="news"><div class="grow"><small>تحديث مهم</small><p>التطبيق ينتقل لعنوان جديد أكثر أمانًا. لحظة أتأكد إن كل شغلك محفوظ في حسابك… (يحتاج نت)</p></div></div>';
  return '<div class="news renew"><div class="grow"><small>تحديث مهم · شغلك كله محفوظ في حسابك ✓</small><p>التطبيق انتقل لعنوان جديد أكثر أمانًا. اضغط الزر، وثبّت التطبيق الجديد، وادخل بنفس رقم جوالك والرقم السري. كل زياراتك وتقييماتك تنزل لك فيه.</p></div><a class="btn primary sm" href="'+esc(m.url)+'start.html" target="_blank" rel="noopener">افتح التطبيق الجديد</a></div>';}

/* ---------- إيقاف العنوان القديم: يحوّل للجديد لحاله بدون ما يسأل ----------
   اللي مو داخل: يتحوّل على طول. اللي داخل: يرفع شغله ويتأكد من السيرفر إنه كامل، وبعدها يتحوّل.
   لو ما فيه نت وهو داخل، يبقى هنا لين يرجع النت عشان ما يضيع شي */
const NEW_HOME='https://taqweem-app.github.io/';
let fwdBusy=false;
async function forwardNew(){if(APP_TARGET!=='old'||fwdBusy||location.protocol==='file:'&&!window.__testFwd)return;
  if(!DB)return;if(!acct()){window.__fwdTo=NEW_HOME;if(!window.__testFwd)location.replace(NEW_HOME);return;}
  if(navigator.onLine===false)return;fwdBusy=true;
  try{for(let k=0;k<40&&cloudBusy;k++)await new Promise(r=>setTimeout(r,500));await cloudSync(true);
    if(cloudState==='ok'){const v=await verifySynced();if(v.ok){saveNow();window.__fwdTo=NEW_HOME;if(!window.__testFwd)location.replace(NEW_HOME);}}}
  catch(e){}finally{fwdBusy=false;}}
if(APP_TARGET==='old'){setTimeout(forwardNew,1500);setInterval(forwardNew,60e3);window.addEventListener('online',()=>setTimeout(forwardNew,2000));}
