I('1-1-1-1','تضع المدرسة خطة تشغيلية شاملة تتضمن مبادرات نوعية؛ لتحقيق أهدافها التطويرية.','1-2,3-4,5,6+','تضع المدرسة خطة تشغيلية شاملة تغطي جميع مجالات العملية التعليمية|تضع المدرسة خطة تشغيلية مرنة تتيح استيعاب المستجدات والاحتياجات الطارئة أثناء التنفيذ|تشمل الخطة التشغيلية أهدافًا تطويرية محددة|تتضمن الخطة التشغيلية أهدافًا تطويرية طموحة|يشارك الكادر التعليمي في تطوير الخطة التشغيلية واتخاذ القرارات المتعلقة بها|تتضمن الخطة التشغيلية مبادرات نوعية مبتكرة تسهم في تحقيق أهدافها واستدامة التميز','ما الجوانب التي تتضمنها خطة المدرسة التشغيلية، وكيف يتم تحديدها؟|كيف تتعامل المدرسة مع المستجدات أو الاحتياجات التي تظهر أثناء تنفيذ الخطة؟|كيف تحدد المدرسة أهداف خطتها التشغيلية؟|كيف تطور المدرسة خطتها التشغيلية؟|كيف يشارك الكادر التعليمي في المدرسة في إعداد الخطة التشغيلية؟|ما المبادرات التي تتضمنها الخطة التشغيلية وتسهم في تحقيق الأهداف التطويرية واستدامة التميز؟'),
I('1-1-1-2','تطبق المدرسة إجراءات محددة في تطوير خطتها التشغيلية، وتتابعها.','1-2,3-4,5,6+','تتابع المدرسة تنفيذ برامج الخطة التشغيلية وأنشطتها وفق إجراءات محددة ومنظمة|تُقوّم المدرسة خطتها التشغيلية بأساليب متنوعة|تلتزم المدرسة بخطة زمنية محددة لتنفيذ إجراءات المتابعة والتقويم على مدار العام|تطوّر المدرسة خطتها التشغيلية وفق نتائج التقويم المدرسي وخطة التحسين|تتابع المدرسة خطتها التشغيلية بأساليب متنوعة ومبتكرة بما يضمن تحقيق جميع أهدافها|توظف المدرسة نتائج التقويم وخطة التحسين في تحديث أهداف الخطة ومبادراتها وإجراءات تنفيذها','ما الإجراءات التي تتخذها المدرسة لمتابعة تنفيذ الخطة التشغيلية؟|ما الأساليب التي تطبقها المدرسة لتقويم خطتها التشغيلية؟|كيف تلتزم المدرسة بالخطة الزمنية المحددة عند متابعة خطتها التشغيلية وتقويمها؟|كيف تطور المدرسة خطتها التشغيلية بما يضمن تحقيق أهدافها؟|كيف تتابع المدرسة خطتها التشغيلية بما يضمن تحقيق جميع أهدافها؟|كيف توظف المدرسة نتائج التقويم وخطة التحسين في تطوير خطتها التشغيلية؟'),
I('1-1-2-2','تطبق المدرسة إجراءات محددة؛ لمتابعة التزام منسوبيها بقيم مهنة التعليم وأخلاقياتها.','1-2,3-4,5-6,7+','تطبق المدرسة قيم مهنة التعليم وأخلاقياتها في التعامل مع منسوبيها|يظهر 90% وأكثر من منسوبي المدرسة التزامًا بقواعد السلوك الوظيفي وأخلاقيات المهنة|تتعامل المدرسة مع حالات عدم الالتزام بقيم المهنة وفق إجراءات واضحة ومحددة|تتابع المدرسة التزام منسوبيها بقيم المهنة وأخلاقياتها وفق إجراءات محددة|تعزز المدرسة قيم المهنة وأخلاقياتها لدى منسوبيها بممارسات مهنية متنوعة|تعزز المدرسة قيم المهنة وأخلاقياتها لدى منسوبيها بممارسات مهنية مبتكرة|ترسّخ المدرسة قيم المهنة وأخلاقياتها لدى منسوبيها من خلال تعزيز وعيهم المستمر بها','كيف تطبق المدرسة قيم مهنة التعليم وأخلاقياتها في تعاملها مع منسوبيها؟|ما نسبة التزام منسوبي المدرسة بقواعد السلوك الوظيفي وأخلاقيات المهنة في ممارساتهم اليومية؟|كيف تتعامل المدرسة مع حالات عدم الالتزام بقيم المهنة عند رصدها؟|ما الإجراءات التي تطبقها المدرسة لمتابعة التزام منسوبيها بقيم المهنة وأخلاقياتها؟|كيف تعزز المدرسة قيم مهنة التعليم وأخلاقياتها لدى منسوبيها؟|كيف تُسهم إجراءات المدرسة في ترسيخ قيم مهنة التعليم وأخلاقياتها لدى منسوبيها؟'),
I('1-1-2-3','تطبق المدرسة إجراءات محددة؛ لدعم الانضباط المدرسي، وتتابع الالتزام بها.','1-2,3-4,5-6,7+','تطبق المدرسة إجراءات محددة لدعم الانضباط المدرسي لدى المتعلمين|تتابع المدرسة مستوى التزام المتعلمين بإجراءات الانضباط المدرسي بأساليب متنوعة|تتابع المدرسة مستوى التزام المتعلمين بإجراءات الانضباط المدرسي بأساليب مبتكرة|تطبق المدرسة أساليب تحفيزية متنوعة لتشجيع المتعلمين على الالتزام بالانضباط|تعزز المدرسة ثقافة الانضباط المدرسي وتحفز المتعلمين على الالتزام بها|تقيس المدرسة أثر التزام المتعلمين بالانضباط المدرسي في تحقيق نواتج التعلم باستمرار|تقيس المدرسة أثر إجراءات وأساليب دعم الانضباط المدرسي في تحقيق نواتج التعلم','ما الإجراءات التي تطبقها المدرسة لدعم الانضباط المدرسي لدى المتعلمين؟|كيف تتابع المدرسة التزام المتعلمين بإجراءات الانضباط المدرسي؟|ما أساليب التحفيز التي تعتمدها المدرسة لتشجيع المتعلمين على الالتزام بالانضباط المدرسي؟|كيف تعزز المدرسة ثقافة الانضباط المدرسي وتحفز المتعلمين على الالتزام بها؟|كيف تقيس المدرسة أثر الانضباط المدرسي في تعلم المتعلمين؟|كيف توظف المدرسة نتائج قياس أثر الانضباط المدرسي في تطوير إجراءاتها وأساليبها؟'),
I('1-1-2-5','تنفذ المدرسة برامج إثرائية؛ لتطوير مواهب المتعلمين، وتهيئهم للمستقبل، وتتابعها.','1-2,3-4,5-6,7+','تطبّق المدرسة إجراءات متنوعة ومنظمة للكشف عن المتعلمين الموهوبين|تنفذ المدرسة برامج وأنشطة إثرائية متنوعة لتطوير مواهب المتعلمين|تنفذ المدرسة برامج وأنشطة إثرائية مبتكرة لتطوير مواهب المتعلمين|تراعي المدرسة تنوع مواهب المتعلمين وقدراتهم عند تصميم البرامج والأنشطة الإثرائية|تلبي البرامج والأنشطة الإثرائية احتياجات المتعلمين الموهوبين وتهيئهم للمستقبل|تتابع المدرسة أثر البرامج والأنشطة الإثرائية في تطوير مواهب المتعلمين|توظف المدرسة نتائج متابعة أثر البرامج والأنشطة الإثرائية في تطويرها بما يعزز تحقيق أهدافها','ما الإجراءات التي تطبقها المدرسة للكشف عن المتعلمين الموهوبين؟|ما البرامج والأنشطة الإثرائية التي تنفذها المدرسة لتطوير مواهب المتعلمين؟|كيف تراعي المدرسة تنوع مواهب المتعلمين وقدراتهم عند تصميم برامجها وأنشطتها الإثرائية؟|كيف تلبي البرامج والأنشطة الإثرائية احتياجات المتعلمين الموهوبين وتهيئهم للمستقبل؟|كيف تتابع المدرسة أثر البرامج والأنشطة الإثرائية في تطوير مواهب المتعلمين؟|كيف توظف المدرسة نتائج متابعة أثر البرامج والأنشطة الإثرائية في تطويرها؟'),
I('1-1-3-1','تعزز المدرسة العلاقات الإيجابية والتعاون في المجتمع المدرسي.','1-2,3-4,5,6+','تعزز المدرسة ثقافة التعاون والعمل بروح الفريق بين منسوبيها|ترسخ المدرسة بيئة قائمة على الاحترام المتبادل والتعاون بين جميع منسوبيها|تعزز المدرسة التواصل الفعال بين منسوبيها بأساليب متنوعة|تعزز المدرسة العلاقات الإيجابية مع مختلف فئات المجتمع المدرسي بأساليب مبتكرة|تعزز المدرسة بناء العلاقات الإيجابية القائمة على الاحترام المتبادل والتعاون والعمل بروح الفريق باستمرار|تتابع المدرسة أثر الأنشطة المشتركة في تعزيز العلاقات الإيجابية والعمل بروح الفريق','كيف تعزز المدرسة ثقافة التعاون والعمل بروح الفريق بين منسوبيها؟|كيف ترسخ المدرسة بيئة قائمة على الاحترام المتبادل والتعاون بين جميع منسوبيها؟|كيف تعزز المدرسة التواصل الفعال بين منسوبيها؟|كيف تعزز المدرسة العلاقات الإيجابية مع مختلف فئات المجتمع المدرسي (المعلمين، المتعلمين، الإداريين)؟|كيف تتابع المدرسة أثر الأنشطة المشتركة في تعزيز العلاقات الإيجابية والعمل بروح الفريق؟'),
I('1-1-3-3','تفعل المدرسة الشراكة المجتمعية في تلبية احتياجات المتعلمين، والتأثير الإيجابي في المجتمع.','1-2,3-4,5,6+','تختار المدرسة شركاءها من المجتمع بناءً على دراسة احتياجات متعلميها بمختلف فئاتهم|تعقد المدرسة شراكات مجتمعية متنوعة تدعم تعلم المتعلمين|توظف المدرسة الشراكات المجتمعية لدعم تعلم المتعلمين بمختلف فئاتهم، ومنهم ذوو الإعاقة والموهوبون|تنفذ المدرسة من خلال شراكاتها أنشطة وفعاليات متنوعة ومبتكرة ذات أثر إيجابي في المجتمع المحلي|تتابع المدرسة أثر الشراكات المجتمعية في تعلم المتعلمين وخدمة المجتمع المحلي|توظف المدرسة نتائج متابعة أثر الأنشطة والفعاليات وتطورها بما يعزز تحقيق أهدافها','كيف تختار المدرسة شركاءها من المجتمع بما يتناسب مع احتياجات متعلميها؟|ما الشراكات المجتمعية التي عقدتها المدرسة، وكيف تنوعت مجالاتها لدعم تعلم المتعلمين؟|كيف توظف المدرسة الشراكات المجتمعية لدعم تعلم المتعلمين بمختلف فئاتهم؟|كيف توظف المدرسة الشراكات المجتمعية في تنفيذ أنشطة وفعاليات ذات أثر إيجابي في المجتمع المحلي؟|كيف تتابع المدرسة أثر الشراكات المجتمعية في تعلم المتعلمين وخدمة المجتمع المحلي؟|كيف توظف المدرسة نتائج متابعة أثر الأنشطة والفعاليات وتطورها؟'),
I('1-1-4-1','تطبق المدرسة إجراءات محددة في استقطاب الكادر التعليمي المؤهل، واستبقائهم.','1-2,3-4,5,6+','تعتمد المدرسة معايير واضحة لاختيار الكادر التعليمي المؤهل بما يتوافق مع احتياجاتها|تطبق المدرسة إجراءات منظمة لاستقطاب الكادر التعليمي المؤهل وفق المعايير المعتمدة|تضمن المدرسة توافق تخصص الكادر التعليمي مع المجال الذي يدرّسه|تنفذ المدرسة برنامجًا منظمًا لتهيئة المعلمين الجدد ودعم اندماجهم في بيئة العمل|توفر المدرسة بيئة مهنية جاذبة ومحفزة تسهم في دعم الاستقرار الوظيفي لكادرها التعليمي|تطبق المدرسة إجراءات داعمة للمحافظة على الكادر التعليمي المؤهل والمتميز وتعزيز استقراره المهني','ما المعايير التي تعتمدها المدرسة في اختيار الكادر التعليمي المؤهل؟|ما الإجراءات التي تطبقها المدرسة لاستقطاب الكادر التعليمي المؤهل؟|كيف تضمن المدرسة توافق تخصص الكادر التعليمي مع المجال الذي يدرّسه؟|كيف تهيئ المدرسة المعلمين الجدد؟|كيف توفر المدرسة بيئة مهنية جاذبة ومحفزة تدعم الاستقرار الوظيفي لكادرها التعليمي؟|كيف تحافظ المدرسة على الكادر التعليمي المؤهل والمتميز؟',HR),
I('1-1-4-2','تطبق المدرسة إجراءات محددة؛ لاستقطاب الكادر الإداري، وتعمل على استبقائهم.','1-2,3-4,5,6+','تعتمد المدرسة معايير واضحة لاختيار الكادر الإداري المؤهل بما يتناسب مع احتياجاتها|تطبق المدرسة إجراءات منظمة لاستقطاب الكادر الإداري المؤهل وفق المعايير المعتمدة|تضمن المدرسة توافق تخصص الكادر الإداري مع المهام الموكلة له|تطبق المدرسة إجراءات داعمة للمحافظة على الكادر الإداري المؤهل وتعزيز استقراره الوظيفي|توفر المدرسة بيئة مهنية جاذبة ومحفزة تسهم في دعم الاستقرار الوظيفي لكادرها الإداري|توفر المدرسة كادرًا إداريًا مكتملًا وتحقق تغطية المهام الإدارية بكفاءات مناسبة','ما المعايير التي تعتمدها المدرسة في اختيار الكادر الإداري المؤهل؟|ما الإجراءات التي تطبقها المدرسة لاستقطاب الكادر الإداري المؤهل؟|كيف تضمن المدرسة توافق تأهيل الكادر الإداري مع المهام الموكلة له؟|كيف تحافظ المدرسة على الكادر الإداري المؤهل وتدعم استقراره الوظيفي؟|كيف توفر المدرسة بيئة مهنية جاذبة ومحفزة تدعم الاستقرار الوظيفي لكادرها الإداري؟|كيف تحقق المدرسة اكتمال الكادر الإداري وتغطي جميع المهام الإدارية؟',HR),
I('1-1-4-3','تطبق المدرسة إجراءات محددة في توزيع الموارد المالية وفق أولوياتها، وتحافظ على استدامتها. (*)','1-2,3-4,5,6+','توظف المدرسة مواردها المالية لدعم الجودة التعليمية والوفاء بالتزاماتها المالية|توزع المدرسة المخصصات المالية وفق احتياجاتها وأولوياتها المعتمدة|تطبق المدرسة إجراءات متنوعة وواضحة لإدارة مخصصاتها المالية وضبط الصرف وفق الميزانية المعتمدة|تطبق المدرسة سياسة معلنة للرسوم والتحصيل وتنشرها لأولياء الأمور وأصحاب المصلحة|توضح المدرسة ملاءتها المالية|تحافظ المدرسة على استدامة مواردها المالية بما يضمن استمرارية عملها على المدى الطويل','كيف توظف المدرسة مواردها المالية لدعم الجودة التعليمية وتغطية التزاماتها؟|كيف تحدد المدرسة أولويات توزيع المخصصات المالية؟|ما الإجراءات التي تطبقها المدرسة في إدارة مخصصاتها المالية وضبط الصرف وفق الميزانية المعتمدة؟|كيف تطبق المدرسة سياسة الرسوم والتحصيل وتنشرها لأولياء الأمور وأصحاب المصلحة؟|كيف تتحقق المدرسة من ملاءتها المالية؟|كيف تحافظ المدرسة على استدامة مواردها المالية؟','الرجوع للإدارة المالية'),
I('1-1-4-4','تطبق المدرسة إجراءات محددة؛ لدعم الحصول على الرخص المهنية، وتتابعها.','1-2,3-4,5-6,7+','تطبق المدرسة إجراءات واضحة وداعمة لحصول المعلمين على الرخص المهنية|يوجد معلم أو أكثر على رتبة «متقدم»|تحقق المدرسة نسبة 90% فأكثر من المعلمين الحاصلين على الرخصة المهنية من إجمالي المعلمين المستهدفين|تشجع المدرسة المعلمين على تحقيق رتبتي «متقدم» و«خبير»|يوجد معلم أو أكثر على رتبة «خبير»|تقدم المدرسة الدعم اللازم لرفع نسبة الحصول على الرخص المهنية ومستوياتها بأساليب متنوعة|تتابع المدرسة بيانات الرخص المهنية ومستوياتها بأساليب متنوعة أو مبتكرة','كيف تدعم المدرسة حصول المعلمين على الرخص المهنية؟|كم نسبة المعلمين الحاصلين على الرخصة المهنية؟|كيف تشجع المدرسة المعلمين على تحقيق رتب مهنية متقدمة؟|ما أعداد الحاصلين على رتبة «متقدم» و«خبير»؟|كيف تتابع المدرسة حصول المعلمين على الرخص المهنية ورفع مستوياتها؟'),
I('1-1-4-5','تدعم المدرسة منسوبيها على التطوير المهني المستمر بطرق متنوعة.','1-3,4-5,6-7,8+','تبني المدرسة خطة تطوير مهني شاملة تلبي احتياجات جميع منسوبيها|تربط المدرسة خطة التطوير المهني بنتائج التقويم المدرسي وأولويات التحسين|تتضمن خطة التطوير المهني أنشطة وبرامج متنوعة|تتضمن خطة التطوير المهني أنشطة وبرامج مبتكرة|تتضمن خطة التطوير المهني برامج وأنشطة تعزز الابتكار في التعليم والتعلم والتقويم|تشجع المدرسة منسوبيها على المشاركة في مجتمعات التعلم المهنية وإجراء البحوث الإجرائية|نسبة الحاصلين على برامج تدريبية تفوق 90% من إجمالي منسوبي المدرسة|تقيس المدرسة أثر خطة التطوير المهني في تحسين أداء منسوبيها','كيف تحدد المدرسة احتياجات منسوبيها التطويرية عند بناء خطة التطوير المهني؟|كيف تربط المدرسة خطة التطوير المهني بنتائج التقويم المدرسي؟|ما الأنشطة والبرامج التي تتضمنها خطة التطوير المهني؟|كيف تدعم برامج التطوير المهني الابتكار في عمليات التعليم والتعلم والتقويم؟|كيف تشجع المدرسة منسوبيها على المشاركة في مجتمعات التعلم المهنية وإجراء البحوث الإجرائية؟|كم نسبة الحاصلين على برامج تدريبية من إجمالي منسوبي المدرسة؟|كيف تقيس المدرسة أثر برامج وأنشطة التطوير المهني في تحسين أداء منسوبيها؟'),
I('1-1-4-6','تطبق المدرسة إجراءات التقويم الذاتي وأدواته وفقًا للأدلة المعتمدة من الهيئة.','1-2,3-4,5-6,7+','تطبق المدرسة التقويم الذاتي بشكل مستمر خلال العام الدراسي وفق جدولة زمنية واضحة|تُطبّق المدرسة إجراءات واضحة وموثقة للتقويم الذاتي وفق الأدلة والنماذج المعتمدة من هيئة تقويم التعليم والتدريب|تشرك المدرسة منسوبيها وأصحاب المصلحة في تطبيق عمليات التقويم الذاتي|تطلع المدرسة منسوبيها وأصحاب المصلحة على نتائج التقويم الذاتي|تعزز المدرسة ثقافة التقويم الذاتي بين جميع منسوبيها بأساليب متنوعة|تعزز المدرسة ثقافة التقويم الذاتي بين جميع منسوبيها بأساليب مبتكرة|تتحقق المدرسة من دقة بيانات التقويم الذاتي وموثوقيتها واتساقها مع واقعها الفعلي','متى تطبق المدرسة التقويم الذاتي خلال العام الدراسي؟|كيف تطبق المدرسة إجراءات التقويم الذاتي؟|كيف تشرك المدرسة منسوبيها وأصحاب المصلحة في عمليات التقويم الذاتي؟|من يطلع على نتائج التقويم الذاتي؟|كيف تعزز المدرسة ثقافة التقويم الذاتي بين جميع منسوبيها؟|كيف تتحقق المدرسة من دقة بيانات التقويم الذاتي واتساقها مع واقعها الفعلي؟'),
I('1-1-4-7','تطبق المدرسة إجراءات محددة في تطوير خطة التحسين، وتتابع تنفيذها.','1-2,3-4,5,6+','تبني المدرسة خطة تحسين شاملة تستند إلى نتائج التقويم المدرسي|تحدد المدرسة أولويات التحسين وفق نتائج التقويم المدرسي|تنفذ المدرسة خطة التحسين بشكل مستمر ومنظم وفق جدول زمني محدد خلال العام الدراسي|تقوّم المدرسة خطة التحسين بأدوات محددة وتوثق نسبة تحقق أولويات التحسين المستهدفة|تطور المدرسة خطة التحسين في ضوء نتائج التقويم والمتابعة والتغذية الراجعة|تتابع المدرسة تنفيذ خطة التحسين بأساليب متنوعة ومبتكرة وفق مؤشرات الأداء بشكل مستمر','كيف تبني المدرسة خطة تحسين شاملة استنادًا إلى نتائج التقويم المدرسي؟|كيف تحدد المدرسة أولويات التحسين والاستدامة في خطتها؟|كيف تنفذ المدرسة خطة التحسين خلال العام الدراسي؟|ما أدوات التقويم التي توظفها المدرسة في تقويم خطة التحسين؟|كيف تطور المدرسة خطة التحسين؟|كيف تتابع المدرسة تنفيذ خطة التحسين؟'),
I('4-1-1-1','تطبق المدرسة إجراءات لمتابعة جودة الخدمات المساندة وتفعيلها بما يلبي متطلبات العملية التعليمية.','1-2,3-4,5,6+','تتحقق المدرسة من استيفاء مبناها للمواصفات والاشتراطات المعتمدة من الجهات المختصة|تُطبّق المدرسة إجراءات منتظمة لمتابعة جودة المرافق التعليمية وجاهزيتها|توفر المدرسة خدمات مساندة متنوعة تلبي احتياجات المتعلمين بمختلف فئاتهم|تعزز المدرسة المظهر الحضاري في المبنى والمرافق|تتابع المدرسة كفاءة مرافقها وخدماتها بأساليب متنوعة لتحقيق سلامة المتعلمين|تهيئ المدرسة مرافقها وخدماتها لتحقيق راحة المتعلمين وسلامتهم، وتتابع كفاءتها بأساليب متنوعة ومبتكرة','كيف تتحقق المدرسة من استيفاء مبناها للمواصفات والاشتراطات المعتمدة من الجهات المختصة؟|كيف تتابع المدرسة جودة المرافق التعليمية وجاهزيتها؟|كيف توفر المدرسة خدمات مساندة تلبي احتياجات المتعلمين بمختلف فئاتهم؟|كيف تعزز المدرسة المظهر الحضاري في المبنى والمرافق؟|كيف تتابع المدرسة كفاءة مرافقها وخدماتها لتحقيق سلامة المتعلمين؟|كيف تسهم الخدمات المساندة التي توفرها المدرسة في تحقيق الرفاه للمتعلمين؟'),
I('4-2-1-2','تطبق المدرسة إجراءات لمتابعة جودة صيانة المبنى بجميع مرافقه بشكل دوري.','1-2,3-4,5,6+','تضع المدرسة خطة شاملة لأعمال الصيانة الوقائية للمبنى المدرسي ومرافقه وتجهيزاته|تطبق المدرسة إجراءات محددة لتنفيذ أعمال الصيانة العلاجية للأعطال في الوقت المناسب|تنفذ المدرسة أعمال الصيانة لجميع مرافق المبنى وتجهيزاته بانتظام وفق جدول زمني محدد|تتابع المدرسة تنفيذ أعمال الصيانة ومعالجة البلاغات وإغلاقها وفق جداول زمنية محددة|تقوّم المدرسة أعمال الصيانة بما يضمن جودتها وفاعليتها في تلبية متطلبات العملية التعليمية|تقوّم المدرسة أعمال الصيانة بما يضمن تحقيق الرفاه للمتعلمين، ومنهم ذوو الإعاقة','كيف تعد المدرسة خطة الصيانة للمبنى المدرسي ومرافقه وتجهيزاته؟|ما الإجراءات التي تطبقها المدرسة لتنفيذ أعمال الصيانة العلاجية؟|ما الإجراءات التي تطبقها المدرسة لتنفيذ أعمال الصيانة الدورية؟|كيف تتابع المدرسة تنفيذ أعمال الصيانة ومعالجة البلاغات؟|كيف تقوّم المدرسة جودة أعمال الصيانة وفاعليتها في تلبية متطلبات العملية التعليمية؟'),
I('4-2-1-3','تطبق المدرسة إجراءات نظافة المبنى وجميع مرافقه بشكل مستمر.','1-2,3-4,5-6,7+','تطبق المدرسة إجراءات منتظمة وشاملة لضمان نظافة المبنى وجميع مرافقه التعليمية|تطبق المدرسة جدولًا زمنيًا يوميًا لمتابعة أعمال النظافة لجميع مرافق المبنى|تتحقق المدرسة من جودة أعمال النظافة من خلال جولات تفقدية دورية موثقة|تحقق المدرسة استمرارية متابعة أعمال النظافة من خلال تحديد المهام والمسؤولين في خطة المتابعة|تعزز المدرسة وعي المتعلمين ومنسوبيها بأهمية النظافة والمحافظة على المرافق بأساليب متنوعة|تعزز المدرسة وعي المتعلمين ومنسوبيها بأهمية النظافة والمحافظة على المرافق بأساليب مبتكرة|تطبق المدرسة أساليب متنوعة لتشجيع المتعلمين على المحافظة على نظافة المدرسة ومرافقها','ما الإجراءات التي تطبقها المدرسة لضمان نظافة المبنى وجميع مرافقه بصورة مستمرة؟|كيف تتابع المدرسة أعمال النظافة اليومية؟|كيف تتحقق المدرسة من جودة أعمال النظافة؟|كيف تحقق المدرسة استمرارية متابعة أعمال النظافة؟|كيف تعزز المدرسة وعي المتعلمين ومنسوبيها بأهمية النظافة والمحافظة على المرافق؟|كيف تشجع المدرسة المتعلمين على المحافظة على نظافة المدرسة ومرافقها؟')

/* ---------- model helpers ---------- */
function bands(b){if(!b||b==='pct')return null;return b.split(',').map(s=>{if(s.endsWith('+'))return [+s.slice(0,-1),1e9];const p=s.split('-');return [+p[0],p[1]?+p[1]:+p[0]];});}
function bandLabel(s){if(s.endsWith('+'))return '('+s.slice(0,-1)+') فأكثر';const n=s.split('-');const hi=+(n[1]||n[0]);return '('+s+') '+(hi<=2?'شاهد':'شواهد');}
function autoLevel(it,n){const bs=bands(it.b);if(!bs||!n)return 0;for(let i=0;i<4;i++)if(n>=bs[i][0]&&n<=bs[i][1])return i+1;return n>=bs[3][0]?4:1;}
function rec(ins,i){return ins.items[i]||(ins.items[i]={ev:[],other:'',ovr:0,note:''});}
function evCount(r){return (r.ev||[]).length+((r.other||'').trim()?(r.otherN||1):0);}
function levelOf(it,r){if(!r)return 0;if(r.ovr)return r.ovr;return autoLevel(it,evCount(r));}
/* مقابلة الطلاب: ابتدائي له نموذج، ومتوسط وثانوي لهم نموذج. ولو فيه نموذج المرحلة الثانية معبّى من قبل (قبل تصحيح المرحلة) يبقى ظاهر عشان ما يختفي شغل */
function cardsFor(v){const own=v.stage==='p'?'st1':'st2',other=own==='st1'?'st2':'st1',keep=((v.cards||{})[other]||[]).length;
  return ['docs','cls','env',own].concat(keep?[other]:[],['tch','cns','adm']);}
function instances(v,cid){return (v.cards[cid]=v.cards[cid]||[]);}
function insProgress(cid,ins){const c=CARD[cid];let d=0;c.items.forEach((it,i)=>{if(levelOf(it,ins.items[i]))d++});return [d,c.items.length];}
function cardProgress(v,cid){const L=instances(v,cid);if(!L.length)return [0,CARD[cid].items.length,0];let d=0,t=0;L.forEach(x=>{const p=insProgress(cid,x);d+=p[0];t+=p[1]});return [d,t,L.length];}
function visitProgress(v){let d=0,t=0;cardsFor(v).forEach(c=>{const p=cardProgress(v,c);if(p[2]){d+=p[0];t+=p[1]}});return t?Math.round(d/t*100):0;}
function newInstance(cid){return {id:uid(),meta:{},items:{},created:Date.now()};}
function fmtDate(iso){if(!iso)return '';const d=new Date(iso+'T12:00:00');try{
  const g=d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long',year:'numeric'});
  const h=d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'});
  const w=d.toLocaleDateString('ar-SA',{weekday:'long'});return {g,h,w};}catch(e){return {g:iso,h:'',w:''}}}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function insLabel(cid,ins,idx){const c=CARD[cid],m=ins.meta||{};if(cid==='cls')return [m.subj,m.grade,m.teacher].filter(Boolean).join(' · ')||('حصة '+(idx+1));
  if(c.multi)return [m.grades||m.specs,m.count?m.count+' مشاركين':''].filter(Boolean).join(' · ')||(c.unit+' '+(idx+1));return '';}

/* ---------- navigation ---------- */
let S={v:'home'};
function go(state,replace){S=state;try{(replace||(history.state&&history.state.m))?history.replaceState(state,''):history.pushState(state,'')}catch(e){}remember();render();window.scrollTo(0,0);}
let skipPop=false;
let afterPop=null;
function runAfterPop(){const f=afterPop;afterPop=null;f&&f();}
window.addEventListener('popstate',e=>{if(skipPop){skipPop=false;runAfterPop();return}const sc=$('#scrim');if(sc){if(typeof stopScan==='function')stopScan();sc.remove();return}S=e.state||{v:'home'};remember();render();});
function remember(){try{localStorage.setItem('taqweem_view',JSON.stringify(S))}catch(e){}}
function back(){if(history.state&&history.length>1)history.back();else go({v:'home'},true);}

/* ---------- UI bits ---------- */
function band(title,sub,right,meter){return '<header class="band"><div class="bandin"><button class="bbtn" onclick="back()" aria-label="رجوع">'+IC.back+'</button><div class="bt"><h1>'+esc(title)+'</h1>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div><span id="savedInd" class="saved"></span><button class="bbtn" onclick="help()" aria-label="شرح هذه الصفحة">؟</button>'+(right||'')+'</div>'+(meter!==undefined?'<div class="meter"><i id="meterBar" style="width:'+meter+'%"></i></div>':'')+'</header>';}
function topbar(t,s,r){return band(t,s,r)+'<div class="wrap">';}
let toastT;function toast(msg,btn,fn){let t=$('#toast');if(t)t.remove();t=document.createElement('div');t.id='toast';t.className='toast';t.innerHTML='<span>'+msg+'</span>'+(btn?'<button>'+btn+'</button>':'');document.body.appendChild(t);if(btn)t.querySelector('button').onclick=()=>{t.remove();fn()};clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),btn?7000:2600);}
function modal(html,cls){const old=$('#scrim');if(old)old.remove();else{try{history.pushState(Object.assign({},S,{m:1}),'')}catch(e){}}const s=document.createElement('div');s.className='scrim';s.id='scrim';s.innerHTML='<div class="modal '+(cls||'')+'">'+html+'</div>';document.body.appendChild(s);setTimeout(wireHijri,0);return s;}
function closeModal(nav,then){const tr=document.getElementById('tour');if(tr)tr.remove();if(typeof stopScan==='function')stopScan();const s=$('#scrim');if(s)s.remove();if(!nav&&history.state&&history.state.m){skipPop=true;afterPop=then||null;history.back();if(then)setTimeout(()=>{if(afterPop===then){skipPop=false;runAfterPop();}},450);}else if(then)then();}
/* gentle reminder: never blocks, always offers to skip */
function nudge(title,msg,fixLabel,onFix,onSkip){modal('<h3>'+title+'</h3><p>'+msg+'</p><div class="acts"><button class="btn primary" id="nFix">'+fixLabel+'</button><button class="btn" id="nSkip">تخطي</button></div>','nudge');
  $('#nFix').onclick=()=>closeModal(false,onFix);$('#nSkip').onclick=()=>closeModal(false,onSkip);}
function hparts(iso){const d=new Date((iso||today())+'T12:00:00');try{const p=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'}).formatToParts(d);const g=t=>(p.find(x=>x.type===t)||{}).value||'';return {d:g('day'),m:g('month'),y:g('year')};}catch(e){return {d:'',m:'',y:''}}}
function levelDist(v,cid){const c=[0,0,0,0,0];instances(v,cid).forEach(ins=>CARD[cid].items.forEach((it,i)=>c[levelOf(it,ins.items[i])]++));return c;}
function distBar(c){const t=c.reduce((a,b)=>a+b,0)||1;return '<div class="dist">'+[4,3,2,1].map(k=>c[k]?'<i class="i'+k+'" style="width:'+(c[k]/t*100)+'%"></i>':'').join('')+'</div>';}

/* ---------- filtering by month, day and date range ---------- */
function allVisits(){return Object.values(DB.visits).filter(v=>!v.deleted).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.updated-a.updated);}
const F=()=>S.f||{};
function mKey(iso){const h=toH(iso||today());return h.y*100+h.m;}
function mName(k){return HM[(k%100)-1]+' '+Math.floor(k/100);}
function hShort(iso){const h=toH(iso);return h.d+' '+HM[h.m-1];}
/* زيارة المدرسة ممكن تكون أكثر من يوم (الأحد للحصص والاثنين للأنشطة): كل أيامها تنحسب في القائمة والتصفية */
function vDays(v){const a=[v.date].concat((v.schedDays||[]).map(x=>x.iso)).filter(Boolean);return a.filter((x,i)=>a.indexOf(x)===i).sort();}
function vNext(v){const t=today(),d=vDays(v);return d.find(x=>x>=t)||d[d.length-1]||'';}
function vLast(v){const d=vDays(v);return d[d.length-1]||v.date||'';}
function dayNames(v){const d=vDays(v);return d.map(i=>fmtDate(i).w).join(' و');}
function filteredVisits(vs){const f=F();return vs.filter(v=>{const D=vDays(v);if(f.m&&!D.some(i=>mKey(i)===f.m))return false;if(f.d&&!D.includes(f.d))return false;if(f.from&&!D.some(i=>i>=f.from))return false;if(f.to&&!D.some(i=>i<=f.to))return false;return true;});}
function setF(p){S.f=Object.assign({},F(),p);Object.keys(S.f).forEach(k=>{if(!S.f[k])delete S.f[k]});try{history.replaceState(S,'')}catch(e){}remember();render();}
function filterBar(vs){const f=F();const months={};vs.forEach(v=>{[...new Set(vDays(v).map(mKey))].forEach(k=>{months[k]=(months[k]||0)+1})});const mk=Object.keys(months).map(Number).sort((a,b)=>b-a);
  let h='<section class="fbox"><div class="fhead"><b>'+IC.cal+'اختر الشهر</b>'+((f.m||f.d||f.from||f.to)?'<button class="fclear" data-fclear>'+IC.x+'إلغاء التصفية</button>':'')+'</div>';
  h+='<div class="mchips"><button class="mchip'+(!f.m&&!f.from&&!f.to?' on':'')+'" data-fm="0">كل الأشهر<span>'+vs.length+'</span></button>'+mk.map(k=>'<button class="mchip'+(f.m===k?' on':'')+'" data-fm="'+k+'">'+mName(k)+'<span>'+months[k]+'</span></button>').join('')+'</div>';
  if(f.m){const days={};vs.forEach(v=>vDays(v).filter(i=>mKey(i)===f.m).forEach(i=>{(days[i]=days[i]||[]).push(v)}));const dk=Object.keys(days).sort();
    h+='<div class="dlabel">أيام '+mName(f.m)+'</div><div class="dgrid">'+dk.map(iso=>{const hh=toH(iso);return '<button class="dcard'+(f.d===iso?' on':'')+'" data-fd="'+iso+'"><b>'+hh.d+'</b><span>'+esc(fmtDate(iso).w)+'</span><i>'+days[iso].map(v=>esc(v.school||'مدرسة')).join('، ')+'</i></button>'}).join('')+'</div>';}
  h+='<div class="frow2"><span class="sortc"><b>الترتيب</b>'+[['near','الأقرب أول'],['new','الأحدث أول'],['old','الأقدم أول']].map(([k,t])=>'<button class="mchip'+(sortMode()===k?' on':'')+'" data-sort="'+k+'">'+t+'</button>').join('')+'</span><button class="btn sm" data-frange>'+IC.cal+'فترة من … إلى …</button>'+(f.from||f.to?'<span class="fpill">من '+(f.from?hShort(f.from):'البداية')+' إلى '+(f.to?hShort(f.to):'الآن')+'<button data-fclear-range aria-label="إلغاء الفترة">'+IC.x+'</button></span>':'')+'</div></section>';
  return h;}
function hSel(id,iso){const h=toH(iso),y=toH(today()).y;return '<div class="hsel" id="'+id+'"><select class="inp" data-p="d">'+Array.from({length:30},(_,i)=>'<option'+(i+1===h.d?' selected':'')+'>'+(i+1)+'</option>').join('')+'</select><select class="inp" data-p="m">'+HM.map((n,i)=>'<option value="'+(i+1)+'"'+(i+1===h.m?' selected':'')+'>'+n+'</option>').join('')+'</select><select class="inp" data-p="y">'+[y-1,y,y+1].map(x=>'<option'+(x===h.y?' selected':'')+'>'+x+'</option>').join('')+'</select></div>';}
function hRead(id){const b=$('#'+id),g=p=>+b.querySelector('[data-p="'+p+'"]').value;return fromH(g('y'),g('m'),g('d'));}
function rangeModal(){const vs=allVisits(),f=F();const ds=vs.map(v=>v.date).filter(Boolean).sort();
  const from=f.from||(f.m?fromH(Math.floor(f.m/100),f.m%100,1):ds[0]||today()),to=f.to||ds[ds.length-1]||today();
  modal('<h3>اختر الفترة</h3><p>تظهر لك الزيارات اللي بين التاريخين.</p><label class="f" style="margin-top:8px">من</label>'+hSel('rF',from)+'<label class="f" style="margin-top:12px">إلى</label>'+hSel('rT',to)+'<div class="acts"><button class="btn primary" id="rOk">عرض الفترة</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>','nudge');
  $('#rOk').onclick=()=>{let a=hRead('rF'),b=hRead('rT');if(a>b)[a,b]=[b,a];closeModal(false,()=>setF({from:a,to:b,m:0,d:0}));};}
function sortMode(){return DB.settings.sort||'near';}
function sortVisits(vs){const m=sortMode(),t=today(),c=(a,b)=>(a.date||'').localeCompare(b.date||'');if(m==='old')return vs.slice().sort(c);if(m==='new')return vs.slice().sort((a,b)=>-c(a,b));
  return vs.filter(v=>vLast(v)>=t).sort((a,b)=>vNext(a).localeCompare(vNext(b))).concat(vs.filter(v=>vLast(v)<t).sort((a,b)=>vLast(b).localeCompare(vLast(a))));}
/* زيارة على أكثر من يوم = سطر لكل يوم بتاريخه (حصص الأحد في سطر، وأنشطة الاثنين في سطر). زيارة بيوم واحد = سطر واحد */
function vEntries(vs){const f=F(),out=[];vs.forEach(v=>{const D=vDays(v);if(D.length<2){out.push({v,iso:v.date||D[0]||''});return;}
  D.forEach(i=>{if(f.m&&mKey(i)!==f.m)return;if(f.d&&i!==f.d)return;if(f.from&&i<f.from)return;if(f.to&&i>f.to)return;out.push({v,iso:i,day:1});});});return out;}
function sortEntries(E){const m=sortMode(),t=today(),c=(a,b)=>(a.iso||'').localeCompare(b.iso||'');if(m==='old')return E.sort(c);if(m==='new')return E.sort((a,b)=>-c(a,b));
  return E.filter(e=>e.iso>=t).sort(c).concat(E.filter(e=>e.iso<t).sort((a,b)=>-c(a,b)));}
function monthGrouped(vs){const E=sortEntries(vEntries(vs));if(!E.length)return '<div class="empty"><b>ما فيه زيارات هنا</b>جرّب شهر ثاني أو ألغِ التصفية.</div>';const f=F(),R=e=>vRow(e.v,e.day?e.iso:'');
  if(f.m||f.d||f.from||f.to)return '<div class="ledger">'+E.map(R).join('')+'</div>';
  if(sortMode()==='near'){const t=today(),up=E.filter(e=>e.iso>=t),past=E.filter(e=>e.iso<t);
    return (up.length?'<div class="mhead">الجاية<span>'+up.length+'</span></div><div class="ledger">'+up.map(R).join('')+'</div>':'')+(past.length?'<div class="mhead">اللي راحت<span>'+past.length+'</span></div><div class="ledger">'+past.map(R).join('')+'</div>':'');}
  const g={};E.forEach(e=>{const k=mKey(e.iso);(g[k]=g[k]||[]).push(e)});
  return Object.keys(g).map(Number).sort((a,b)=>sortMode()==='old'?a-b:b-a).map(k=>'<div class="mhead">'+mName(k)+'<span>'+g[k].length+'</span></div><div class="ledger">'+g[k].map(R).join('')+'</div>').join('');}
function wireFilters(){const app=$('#app');app.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{DB.settings.sort=b.dataset.sort;saveNow();render();});app.querySelectorAll('[data-fm]').forEach(b=>b.onclick=()=>setF({m:+b.dataset.fm||0,d:0,from:0,to:0}));
  app.querySelectorAll('[data-fd]').forEach(b=>b.onclick=()=>setF({d:F().d===b.dataset.fd?0:b.dataset.fd}));
  app.querySelectorAll('[data-fclear]').forEach(b=>b.onclick=()=>{S.f={};setF({});});
  app.querySelectorAll('[data-fclear-range]').forEach(b=>b.onclick=()=>setF({from:0,to:0}));
  app.querySelectorAll('[data-frange]').forEach(b=>b.onclick=rangeModal);}

/* ---------- export: choose schools, print all their summaries in one go, or back them up ---------- */
let expSel=null,expSubj=[];
function vExport(){const vs=allVisits();if(!expSel)expSel=new Set((S.pre||vs.map(v=>v.id)).filter(id=>DB.visits[id]));
  const st=DB.settings.sumStyle,sel=vs.filter(v=>expSel.has(v.id));
  let h=band('التصدير',sel.length+' من '+vs.length+' '+(vs.length>2&&vs.length<11?'مدارس':'مدرسة'))+'<div class="wrap">';
  h+=hint('علّم على المدارس اللي تبيها، وبعدها اضغط «حفظ PDF أو طباعة».');
  {const cnt={};sel.forEach(v=>instances(v,'cls').forEach(i=>{const n=subjOf(i);cnt[n]=(cnt[n]||0)+1;}));expSubj=(expSubj||[]).filter(n=>cnt[n]);h+=subjChips(Object.keys(cnt).sort().map(n=>[n,cnt[n]]),expSubj,'data-xsj');}
  h+='<div class="row" style="margin-top:14px"><button class="btn sm" data-xall>تحديد الكل</button><button class="btn sm" data-xnone>إلغاء التحديد</button>'+(()=>{const months={};vs.forEach(v=>{months[mKey(v.date)]=1});return Object.keys(months).map(Number).sort((a,b)=>b-a).map(k=>'<button class="btn sm" data-xm="'+k+'">'+mName(k)+'</button>').join('')})()+'</div>';
  const g={};vs.forEach(v=>{const k=mKey(v.date);(g[k]=g[k]||[]).push(v)});
  h+=Object.keys(g).map(Number).sort((a,b)=>b-a).map(k=>'<div class="mhead">'+mName(k)+'</div><div class="ledger">'+g[k].map(v=>{const p=visitProgress(v),hp=hparts(v.date),on=expSel.has(v.id);return '<button class="lrow xrow'+(on?' on':'')+'" data-x="'+v.id+'"><span class="xbox">'+IC.check+'</span><div class="dblock"><div class="d">'+esc(hp.d)+'</div><div class="m">'+esc(hp.m)+'</div></div><div class="grow"><div class="t">'+esc(v.school||'مدرسة بدون اسم')+'</div><div class="s">'+esc(STAGES[v.stage]||'')+'، '+filledCards(v)+'</div></div><div class="pct'+(p===100?' done':'')+'"><b>'+p+'%</b><div class="track"><i style="width:'+p+'%"></i></div></div></button>'}).join('')+'</div>').join('');

  h+='<div class="stepbar"><div class="in"><button class="btn" data-xbk'+(sel.length?'':' disabled')+'>'+IC.save+'نسخة احتياطية</button><span class="grow"></span><button class="btn primary" data-xprint style="min-width:220px"'+(sel.length?'':' disabled')+'>'+IC.print+'حفظ PDF أو طباعة ('+sel.length+')</button></div></div>';
  return h+'</div>';}
function filledCards(v){const n=cardsFor(v).reduce((a,c)=>a+instances(v,c).length,0);return n?n+' '+(n>2&&n<11?'بطاقات معبّاة':'بطاقة معبّاة'):'ما فيها بطاقات معبّاة';}
function afterExport(){const app=$('#app');
  app.onclick=e=>{const t=e.target.closest('[data-x],[data-xall],[data-xnone],[data-xm],[data-xs],[data-xe],[data-xprint],[data-xbk],[data-xsj]');if(!t)return;
    if(t.hasAttribute('data-xsj')){const n=t.dataset.xsj;if(!n)expSubj=[];else{const i=expSubj.indexOf(n);if(i>=0)expSubj.splice(i,1);else expSubj.push(n);}const y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.dataset.x){const id=t.dataset.x;expSel.has(id)?expSel.delete(id):expSel.add(id);}
    else if(t.hasAttribute('data-xall'))allVisits().forEach(v=>expSel.add(v.id));
    else if(t.hasAttribute('data-xnone'))expSel.clear();
    else if(t.dataset.xm){const k=+t.dataset.xm;expSel=new Set(allVisits().filter(v=>mKey(v.date)===k).map(v=>v.id));}
    else if(t.dataset.xs){DB.settings.sumStyle=t.dataset.xs;saveNow();}
    else if(t.dataset.xe){DB.settings.sumExtra=t.dataset.xe==='1';saveNow();}
    else if(t.hasAttribute('data-xprint'))return exportPrint();
    else if(t.hasAttribute('data-xbk'))return exportBackup();
    const y=window.scrollY;render();window.scrollTo(0,y);};}
function exportPrint(){const vs=allVisits().filter(v=>expSel.has(v.id)).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const sj=expSubj&&expSubj.length?expSubj:null;
  const build=()=>{let html='';vs.forEach(v=>(sj?['cls']:cardsFor(v)).forEach(cid=>instances(v,cid).forEach((ins,i)=>{if(sj&&!sj.includes(subjOf(ins)))return;html+=paperHTML(v,cid,ins,i);})));return html;};
  const empty=vs.filter(v=>!cardsFor(v).some(cid=>instances(v,cid).length)).map(v=>v.school);
  if(!build())return toast('المدارس المحددة ما فيها بطاقات معبّاة.');
  const name=sj?('مختصر '+sj.join(' و')+' - '+(vs.length===1?(vs[0].school||''):vs.length+' '+(vs.length>2&&vs.length<11?'مدارس':'مدرسة'))+' - '+fmtFileDate(today())):vs.length===1?('مختصر الزيارة - '+(vs[0].school||'')+' - '+fmtFileDate(vs[0].date)):('مختصرات '+vs.length+' '+(vs.length>2&&vs.length<11?'مدارس':'مدرسة')+' - '+fmtFileDate(today()));
  const go2=()=>askStyle({name,papers:build});
  if(empty.length)return nudge('بعض المدارس فاضية','ما فيها بطاقات معبّاة: '+empty.map(esc).join('، ')+'. بيطلع الباقي.','كمّل',go2,()=>{});
  go2();}
function exportBackup(){const vs=allVisits().filter(v=>expSel.has(v.id));const o={};vs.forEach(v=>o[v.id]=v);saveNow();
  download('نسخة-'+vs.length+'-مدارس-'+today()+'.json',JSON.stringify({kind:'taqweem-backup',v:1,at:Date.now(),visits:o}));DB.lastBackup=Date.now();saveNow();

const APP_TARGET='new',APP_FILE=APP_TARGET==='new'?'index.html':'app.enc';
async function fetchNewApp(){/* returns the fresh app file if it differs from the one this device is using, else null */
  if(APP_FILE==='index.html'){const u=new URL('index.html',location.href).href;const r=await fetch(u+'?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const t=await r.text();
    const b=(t.match(/const BUILD='([^']*)'/)||[])[1];if(!b||b===BUILD)return null;return {u,r:new Response(t,{headers:{'Content-Type':'text/html; charset=utf-8'}})};}
  const u=new URL('app.enc',location.href).href;const r=await fetch(u+'?fresh='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const nb=new Uint8Array(await r.clone().arrayBuffer());
  const old=await caches.match(u);if(old){const ob=new Uint8Array(await old.arrayBuffer());if(ob.length===nb.length&&ob.slice(16,40).every((x,i)=>x===nb[16+i]))return null;}
  return {u,r};}
async function storeNewApp(x){const ks=await caches.keys();for(const k of ks){if(k.indexOf('tq-')===0)await (await caches.open(k)).put(x.u,x.r.clone());}try{const reg=await navigator.serviceWorker.getRegistration();if(reg)reg.update();}catch(e){}}

const BASE_PHR=['ممارسة متميزة تستحق الإشادة','يحتاج إلى دعم ومتابعة','يُوصى بتفعيل استراتيجيات التعلم النشط','يُوصى بتنويع أساليب التقويم','الشواهد غير مكتملة','تم التحقق من خلال الملاحظة الصفية','تم التحقق من خلال السجلات والوثائق','تم التحقق من خلال المقابلة'];
function phraseList(){const P=(DB.settings.phrases||[]).slice().sort((a,b)=>b.n-a.n).map(x=>x.t);BASE_PHR.forEach(b=>{if(P.indexOf(b)<0)P.push(b)});return P.slice(0,8);}

function learnPhrases(text){const L=DB.settings.phrases||(DB.settings.phrases=[]);String(text||'').split(/[،,.\n؛]+/).map(x=>x.trim()).filter(x=>x.length>=6&&x.length<=70).forEach(t=>{const x=L.find(y=>y.t===t);if(x)x.n++;else L.push({t,n:1})});

    if(t.dataset.phr!==undefined){const sec=t.closest('.item');if(!sec)return;const r=rec(ins,+sec.dataset.i),ta=sec.querySelector('[data-note]');const cur=(r.note||'').trim();
      if(cur.indexOf(t.dataset.phr)<0)r.note=cur?cur.replace(/[،.\s]+$/,'')+'، '+t.dataset.phr:t.dataset.phr;if(ta)ta.value=r.note;usePhrase(t.dataset.phr);touch(v,true);return;}
    if(t.dataset.jump!==undefined){const j=+t.dataset.jump;if(DB.settings.mode==='step'){jump(j)}else{const el=j===-1?$('#metaCard'):$('#it'+j);el&&el.scrollIntoView({behavior:'smooth'})}return;}
    if(t.dataset.pad==='ins'){openPad(ins.ink,img=>{ins.ink=img;touch(v);const y=window.scrollY;render();window.scrollTo(0,y);});return;}
    const sec=t.closest('.item');if(!sec)return;const i=+sec.dataset.i,it=c.items[i],r=rec(ins,i);
    if(t.dataset.pad==='item'){openPad(r.ink,img=>{r.ink=img;touch(v);const y=window.scrollY;render();window.scrollTo(0,y);});return;}
    if(t.dataset.ev!==undefined){const k=+t.dataset.ev,a=r.ev||(r.ev=[]),p=a.indexOf(k);if(p>=0)a.splice(p,1);else a.push(k);a.sort((x,y)=>x-y);t.classList.toggle('on',p<0);}
    else if(t.dataset.lv){const k=+t.dataset.lv;r.ovr=(r.ovr===k&&it.b!=='pct')?0:k;if(it.b!=='pct'&&r.ovr===autoLevel(it,evCount(r)))r.ovr=0;if(it.b==='pct'&&r.ovr===0)r.ovr=k;}
    else if(t.dataset.reset!==undefined){r.ovr=0;}
    if(levelOf(it,r))delete r.skip;
    touch(v);refreshItem(sec,it,r);refreshProg(c,ins);};
  app.oninput=e=>{const t=e.target;
    if(t.dataset.subj!==undefined){(ins.metaEdited=ins.metaEdited||{}).subj=true;const ci=t.parentElement.querySelector('[data-custom]');if(t.value==='__other'){ci.style.display='';ci.value='';ins.meta.subj='';ci.focus();}else{ci.style.display='none';ins.meta.subj=t.value;}touch(v,true);return;}
    if(t.dataset.stage!==undefined){setClsStage(v,ins,t.value);touch(v);const y=window.scrollY;render();window.scrollTo(0,y);return;}
    if(t.dataset.meta){const prevSt=S.cid==='cls'?clsStage(v,ins):'';ins.meta[t.dataset.meta]=t.value;(ins.metaEdited=ins.metaEdited||{})[t.dataset.meta]=true;
      if(t.dataset.meta==='grade'&&S.cid==='cls'){const gs=gradeStage(t.value);if(gs&&gs!==prevSt){setClsStage(v,ins,gs);touch(v);const y=window.scrollY;render();window.scrollTo(0,y);return;}}
      touch(v,true);return;}
    const sec=t.closest('.item');if(!sec)return;const i=+sec.dataset.i,it=c.items[i],r=rec(ins,i);
    if(t.hasAttribute('data-other')){const had=!!(r.other||'').trim();r.other=t.value;if(had!==!!t.value.trim()){if(levelOf(it,r))delete r.skip;refreshItem(sec,it,r);refreshProg(c,ins);}}
    else if(t.hasAttribute('data-note'))r.note=t.value;else if(t.hasAttribute('data-pct'))r.pct=t.value;
    touch(v,true);};}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.custom!==undefined){const x=t.value.trim();if(x){const L=DB.settings.customSubjects||(DB.settings.customSubjects=[]);if(!L.includes(x)&&!Object.values(SUBJ).some(a=>a.includes(x))){L.push(x);saveNow();}}}});
function refreshItem(sec,it,r){sec.querySelector('[data-score]').innerHTML=sec.classList.contains('fcard')?formScores(it,r):scoreInner(it,r);const fs=sec.querySelector('.fskip');if(fs&&levelOf(it,r))fs.remove();const f=sec.querySelector('.skipflag');if(f&&levelOf(it,r))f.remove();}
function refreshProg(c,ins){const p=insProgress(S.cid,ins);const a=$('#progTxt'),b=$('#meterBar');if(a)a.innerHTML='<b>'+p[0]+'</b> من '+p[1]+' مرصودة';if(b)b.style.width=(p[0]/p[1]*100)+'%';
  const d=$('#dots');if(d)d.outerHTML=dotsHTML(c,ins,DB.settings.mode);
  if(p[0]===p[1]&&!ins.complete){ins.complete=true;touch(DB.visits[S.vid]);if(DB.settings.autoBackup)toast('اكتملت البطاقة','حفظ نسخة احتياطية',()=>backupVisit(S.vid));else toast('اكتملت البطاقة');}
  if(p[0]<p[1])ins.complete=false;}
function jump(j){S.i=j;try{history.replaceState(S,'')}catch(x){}remember();render();window.scrollTo(0,0);}
function step(d){const c=CARD[S.cid],ins=curIns(),min=c.meta.length?-1:0;
  if(d>0&&S.i>=0){const it=c.items[S.i],r=ins.items[S.i];if(!levelOf(it,r)&&!(r&&r.skip)){
    return nudge('الفقرة '+(S.i+1)+' بدون درجة','ما حددت درجة لهذه الفقرة. ترجع لها أو تتخطاها الحين وتلقاها بعدين في قائمة الناقص.','أرجع أحددها',null,()=>{rec(ins,S.i).skip=true;touch(DB.visits[S.vid]);jump(Math.min(c.items.length-1,S.i+1));});}}
  jump(Math.max(min,Math.min(c.items.length-1,S.i+d)));}
function skipItem(){const c=CARD[S.cid],ins=curIns(),it=c.items[S.i],r=rec(ins,S.i);if(!levelOf(it,r)){r.skip=true;touch(DB.visits[S.vid]);}
  if(S.i===c.items.length-1)finishCard();else jump(S.i+1);}
function metaNext(){const c=CARD[S.cid],ins=curIns();if(metaEmpty(c,ins)&&!ins.metaSkip)return nudge('البيانات فاضية','ما عبّيت أي بيان'+(S.cid==='cls'?' للمعلم أو الحصة':'')+'. تقدر تعبيها الحين أو تتخطاها وترجع لها من زر «البيانات».','أعبيها الحين',()=>{const f=document.querySelector('[data-meta]');f&&f.scrollIntoView({behavior:'smooth',block:'center'});},skipMeta);
  jump(0);}
function skipMeta(){const ins=curIns();if(metaEmpty(CARD[S.cid],ins)){ins.metaSkip=true;touch(DB.visits[S.vid]);}jump(0);}
function setMode(m){DB.settings.mode=m;if(m==='step'&&S.i==null)S.i=0;saveNow();render();}
function finishCard(){autoBackup();const c=CARD[S.cid],ins=curIns();const miss=c.items.map((it,i)=>levelOf(it,ins.items[i])?null:i+1).filter(Boolean);
  const goSum=()=>go({v:'sum',vid:S.vid,cid:S.cid,iid:S.iid});
  if(!miss.length)return goSum();
  nudge('باقي '+miss.length+' فقرة بدون درجة','الفقرات: '+miss.join('، ')+'. ترجع لأول فقرة ناقصة أو تتخطى وتفتح المختصر.','أرجع للناقص',()=>jump(miss[0]-1),goSum);}
function delInst(){return askDelInst(S.vid,S.cid,S.iid);const v=DB.visits[S.vid],L=instances(v,S.cid),ins=curIns(),i=L.indexOf(ins);
  modal('<h3>حذف هذه ال'+CARD[S.cid].unit+'؟</h3><p>سيتم حذف كل ما عُبّي فيها، وتقدر تتراجع مباشرة بعد الحذف.</p><div class="acts"><button class="btn danger" id="mOk">'+IC.trash+'حذف</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>','nudge');
  $('#mOk').onclick=()=>{L.splice(i,1);touch(v);closeModal('nav');go({v:'insts',vid:v.id,cid:S.cid},true);toast('تم الحذف','تراجع',()=>{L.splice(i,0,ins);touch(v);render();});};}

/* ---------- pen pad ---------- */
function openPad(existing,onSave){
  const s=modal('<div class="padbar"><b style="font-family:var(--serif);font-size:19px">الكتابة بالقلم</b><span class="sp"></span><button class="swatch on" data-c="#111" style="background:#111"></button><button class="swatch" data-c="#1747A6" style="background:#1747A6"></button><button class="swatch" data-c="#B23A3A" style="background:#B23A3A"></button><div class="seg"><button class="on" data-w="2.4">رفيع</button><button data-w="4.5">عريض</button><button data-tool="erase">ممحاة</button></div><button class="btn sm" id="pUndo">تراجع</button><button class="btn sm" id="pClear">مسح</button></div><div class="canvaswrap"><canvas id="pc"></canvas></div><div class="padbar" style="margin:10px 0 0"><span class="muted">اكتب بالقلم، ويدك لو لمست الشاشة ما تأثر.</span><span class="sp"></span><button class="btn ghost" id="pCancel">إلغاء</button><button class="btn primary" id="pSave">'+IC.check+'حفظ</button></div>','pad');
  const cv=$('#pc'),wrap=cv.parentElement,dpr=Math.min(2,window.devicePixelRatio||1);let ctx,color='#111',width=2.4,erase=false,penSeen=false,drawing=false,last=null,hist=[];
  function size(){const r=wrap.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);ctx=cv.getContext('2d');ctx.scale(dpr,dpr);ctx.lineCap='round';ctx.lineJoin='round';}
  size();
  if(existing){const im=new Image();im.onload=()=>{const r=wrap.getBoundingClientRect();const sc=Math.min(r.width/im.width,r.height/im.height,1/dpr*2);ctx.drawImage(im,0,0,im.width*sc,im.height*sc);};im.src=existing;}
  const snap=()=>{try{hist.push(ctx.getImageData(0,0,cv.width,cv.height));if(hist.length>25)hist.shift()}catch(e){}};
  const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pressure||.5];};
  cv.addEventListener('pointerdown',e=>{if(e.pointerType==='pen')penSeen=true;if(penSeen&&e.pointerType==='touch')return;e.preventDefault();cv.setPointerCapture(e.pointerId);snap();drawing=true;last=pos(e);dot(last);});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;if(penSeen&&e.pointerType==='touch')return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>{const p=pos(ev);line(last,p);last=p;});});
  const up=()=>{drawing=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  function setStyle(p){ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=erase?22:width*(0.55+(p||.5)*0.9);}
  function dot(p){setStyle(p[2]);ctx.beginPath();ctx.arc(p[0],p[1],ctx.lineWidth/2,0,7);ctx.fill();}
  function line(a,b){setStyle(b[2]);ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();}
  s.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{color=b.dataset.c;erase=false;s.querySelectorAll('[data-c]').forEach(x=>x.classList.toggle('on',x===b));s.querySelector('[data-tool]').classList.remove('on');});
  s.querySelectorAll('[data-w],[data-tool]').forEach(b=>b.onclick=()=>{s.querySelectorAll('[data-w],[data-tool]').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(b.dataset.tool){erase=true}else{erase=false;width=+b.dataset.w}});
  $('#pUndo').onclick=()=>{const d=hist.pop();if(d)ctx.putImageData(d,0,0);};
  $('#pClear').onclick=()=>{snap();ctx.clearRect(0,0,cv.width,cv.height);};
  $('#pCancel').onclick=()=>closeModal();
  $('#pSave').onclick=()=>{
    const d=ctx.getImageData(0,0,cv.width,cv.height).data;let minX=cv.width,minY=cv.height,maxX=-1,maxY=-1;
    for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2){if(d[(y*cv.width+x)*4+3]>10){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}}
    if(maxX<0){closeModal();onSave('');return;}
    const pad=16;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(cv.width,maxX+pad);maxY=Math.min(cv.height,maxY+pad);
    const sc=Math.min(1,1400/(maxX-minX));const o=document.createElement('canvas');o.width=Math.round((maxX-minX)*sc);o.height=Math.round((maxY-minY)*sc);
    const oc=o.getContext('2d');oc.fillStyle='#fff';oc.fillRect(0,0,o.width,o.height);oc.drawImage(cv,minX,minY,maxX-minX,maxY-minY,0,0,o.width,o.height);
    let url=o.toDataURL('image/webp',0.8);if(url.indexOf('image/webp')<0)url=o.toDataURL('image/jpeg',0.85);
    closeModal();onSave(url);};
}

/* ---------- summary ---------- */
let sumStyle,sumExtra;
/* مختصر مادة أو مواد محددة: S.subj قائمة المواد المختارة، وإذا فيها شي يطلع مختصر حصص هذي المواد بس */
function subjOf(ins){return ((ins.meta||{}).subj||'').trim()||'بدون مادة';}
function sumTargets(){const v=DB.visits[S.vid];const out=[],sj=S.subj&&S.subj.length?S.subj:null;
  const cids=sj?['cls']:S.all?cardsFor(v):[S.cid];cids.forEach(cid=>instances(v,cid).forEach((ins,i)=>{if(S.iid&&ins.id!==S.iid)return;if(sj&&!sj.includes(subjOf(ins)))return;out.push([cid,ins,i]);}));return out;}
function subjChips(list,sel,attr){if(list.length<2)return '';return '<div style="margin-top:12px"><b style="font-size:14px">مختصر مادة محددة؟</b> <span class="muted" style="font-size:13px">اختر مادة أو أكثر</span><div class="mchips wrap" style="margin-top:6px"><button class="mchip'+(!sel.length?' on':'')+'" '+attr+'="">كل '+(attr==='data-sj'?'البطاقات':'المواد')+'</button>'+list.map(([n,k])=>'<button class="mchip'+(sel.includes(n)?' on':'')+'" '+attr+'="'+esc(n)+'">'+esc(n)+'<span>'+k+'</span></button>').join('')+'</div></div>';}
function setSubj(n){const cur=(S.subj||[]).slice();if(!n)S.subj=[];else{const i=cur.indexOf(n);if(i>=0)cur.splice(i,1);else cur.push(n);S.subj=cur;}try{history.replaceState(S,'')}catch(e){}render();}
function paperDate(v,cid,ins){if(cid==='cls'){const i=insIso(v,ins);if(i)return i;}const sd=(v.schedDays||[]).find(x=>Array.isArray(x.acts)&&actCards(v,x.acts).includes(cid));return (sd&&sd.iso)||v.date;}
function paperHTML(v,cid,ins,idx){const c=CARD[cid],d=fmtDate(paperDate(v,cid,ins)),style=DB.settings.sumStyle,extra=DB.settings.sumExtra;
  let h='<div class="paper"><div class="ph"><div><h2>'+esc(c.title)+'</h2>'+(c.multi?'<div style="font-size:13px;color:#7A5A28;font-weight:600">'+esc(c.unit)+' '+(idx+1)+'</div>':'')+'</div><div class="d">'+esc(d.w)+'<br>'+esc(d.h)+'<br>'+esc(d.g)+'</div></div>';
  const rows=[['المدرسة',v.school],['المرحلة',STAGES[v.stage]],['فريق التقويم',teamOf().join('، ')]];c.meta.forEach(m=>rows.push([m[1],ins.meta[m[0]]||'']));
  h+='<table class="info"><tbody>';for(let i=0;i<rows.length;i+=2){h+='<tr><td class="k">'+esc(rows[i][0])+'</td><td'+(rows[i+1]?'':' colspan="3"')+'>'+esc(rows[i][1])+'</td>'+(rows[i+1]?'<td class="k">'+esc(rows[i+1][0])+'</td><td>'+esc(rows[i+1][1])+'</td>':'')+'</tr>';}h+='</tbody></table>';
  const cnt=[0,0,0,0,0];
  const ex=(it,r)=>{if(!extra||!r)return '';const parts=[];if(it.b!=='pct'&&(r.ev||[]).length)parts.push('<b>الشواهد:</b> '+r.ev.map(k=>esc(it.ev[k])).join('؛ '));if((r.other||'').trim())parts.push('<b>شواهد أخرى:</b> '+esc(r.other));if(r.pct)parts.push('<b>النسبة:</b> '+esc(r.pct)+'%');if((r.note||'').trim())parts.push('<b>ملاحظة:</b> '+esc(r.note));let s=parts.join('<br>');if(r.ink)s+='<img src="'+r.ink+'">';return s?'<div class="extra">'+s+'</div>':'';};
  if(style==='card'){h+=c.items.map((it,i)=>{cnt[levelOf(it,ins.items[i])]++;return formItemHTML(c,ins,i,true)}).join('');}
  else if(style==='table'){h+='<table class="sum"><thead><tr><th>م</th><th>المؤشر</th><th>الفقرة</th><th>الدرجة</th></tr></thead><tbody>'+c.items.map((it,i)=>{const r=ins.items[i],l=levelOf(it,r);cnt[l]++;return '<tr><td class="n">'+(i+1)+'</td><td class="code">'+esc(it.code)+'</td><td>'+esc(it.t)+ex(it,r)+'</td><td class="s">'+(l?l+' – '+LV[l]:'<span style="color:#B23A3A">لم تُرصد</span>')+'</td></tr>'}).join('')+'</tbody></table>';}
  else{h+=c.items.map((it,i)=>{const r=ins.items[i],l=levelOf(it,r);cnt[l]++;return '<div class="q"><div class="qt"><span>'+(i+1)+'.</span><span style="flex:1">'+esc(it.t)+'</span><span class="c">'+esc(it.code)+'</span></div><div class="opts">'+[1,2,3,4].map(k=>'<div class="opt'+(l===k?' sel':'')+'"><span class="o"></span>متحقق بدرجة '+LV[k]+'.</div>').join('')+'</div>'+(l?'':'<div class="unset">لم تُرصد الدرجة</div>')+ex(it,r)+'</div>'}).join('');}
  h+='<div class="stats">'+[4,3,2,1].map(k=>'<span>'+LV[k]+': <b>'+cnt[k]+'</b></span>').join('')+(cnt[0]?'<span style="color:#B23A3A">غير مرصودة: <b>'+cnt[0]+'</b></span>':'')+'</div>';

const STY=[['sheet','مثل الورقة','نفس شكل بطاقة الوزارة'],['table','جدول مختصر','الفقرات ودرجاتها في جدول واحد'],['card','البطاقة كاملة','كل فقرة مع الشواهد']];

/* ---------- PDF file (no print dialog) ---------- */
async function savePDF(html,name){toast('لحظة، أجهّز الملف…');
  try{const blob=await makePDF(html);const fn=safeFile(name)+'.pdf';
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},8000);
    toast('انحفظ الملف «'+esc(fn)+'» في التنزيلات');}
  catch(e){console.warn(e);toast('ما قدرت أجهّز الملف، جرّب «طباعة» واختر حفظ PDF',' طباعة ',()=>{$('#printRoot').innerHTML=html;window.print();});}}
function safeFile(s){return String(s||'مختصر').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim().slice(0,90)||'مختصر';}
async function makePDF(html){const PW=703,PH=1032,SC=1.6;/* A4 minus 12mm margins, at 96dpi */
  const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const host=document.createElement('div');host.setAttribute('dir','rtl');host.style.cssText='position:fixed;left:-20000px;top:0;width:'+PW+'px;background:#fff;zoom:1';host.innerHTML=html;document.body.appendChild(host);
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const pages=[];const papers=[...host.querySelectorAll('.paper')];
    for(const p of papers){p.style.cssText='box-shadow:none;margin:0;padding:0;max-width:none;width:'+PW+'px;border-radius:0';
      const pr=p.getBoundingClientRect(),k=pr.width/PW||1,H=Math.ceil(pr.height/k);
      const cand=new Set([H]),by=e=>Math.round((e.getBoundingClientRect().bottom-pr.top)/k)+2;p.querySelectorAll('tr').forEach(e=>cand.add(by(e)));
      [...p.children].forEach(c=>{cand.add(by(c));if(c.getBoundingClientRect().height/k>PH*0.6)c.querySelectorAll('li,p,img,tr,div').forEach(d=>{if(d.getBoundingClientRect().height/k<PH*0.5)cand.add(by(d))});});
      const C=[...cand].filter(y=>y>0&&y<=H).sort((a,b)=>a-b);
      const img=await renderNode(p,css,PW,H,SC);
      let y=0;while(y<H-2){let end=y+PH;if(end>=H)end=H;else{const ok=C.filter(c=>c>y+PH*0.35&&c<=y+PH);if(ok.length)end=ok[ok.length-1];}
        const cv=document.createElement('canvas');cv.width=PW*SC;cv.height=(end-y)*SC;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
        g.drawImage(img,0,y*SC,PW*SC,(end-y)*SC,0,0,PW*SC,(end-y)*SC);
        pages.push({w:cv.width,h:cv.height,data:b64bytes(cv.toDataURL('image/jpeg',0.8).split(',')[1])});y=end;}}
    return pdfFromJpegs(pages,PW,PH);}
  finally{host.remove();}}
function renderNode(node,css,W,H,SC){return new Promise((res,rej)=>{
  const x=new XMLSerializer().serializeToString(node);
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+W*SC+'" height="'+H*SC+'" viewBox="0 0 '+W+' '+H+'"><foreignObject x="0" y="0" width="'+W+'" height="'+H+'"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl" style="width:'+W+'px;background:#fff;color:#111"><style><![CDATA['+css.replace(/\]\]>/g,'')+']]></style>'+x+'</div></foreignObject></svg>';
  const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('svg render failed'));im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
function b64bytes(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function pdfFromJpegs(pages,PW,PH){const enc=new TextEncoder(),parts=[],xref=[];let off=0;const put=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);off+=b.length;};
  const A4W=595.28,A4H=841.89,M=34.02,IW=A4W-2*M,n=pages.length;const obj=(i,body)=>{xref[i]=off;put(i+' 0 obj\n');body();put('\nendobj\n');};
  put('%PDF-1.4\n');
  obj(1,()=>put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>put('<< /Type /Pages /Count '+n+' /Kids ['+pages.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] >>'));
  pages.forEach((p,i)=>{const pg=3+3*i,ct=pg+1,im=pg+2,ih=IW*p.h/p.w,y=A4H-M-ih;
    obj(pg,()=>put('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+A4W+' '+A4H+'] /Resources << /XObject << /Im'+i+' '+im+' 0 R >> >> /Contents '+ct+' 0 R >>'));
    const cs='q '+IW.toFixed(2)+' 0 0 '+ih.toFixed(2)+' '+M.toFixed(2)+' '+y.toFixed(2)+' cm /Im'+i+' Do Q';
    obj(ct,()=>{put('<< /Length '+cs.length+' >>\nstream\n');put(cs);put('\nendstream');});
    obj(im,()=>{put('<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.data.length+' >>\nstream\n');put(p.data);put('\nendstream');});});
  const xs=off,N=3+3*n;put('xref\n0 '+N+'\n0000000000 65535 f \n');for(let i=1;i<N;i++)put(String(xref[i]).padStart(10,'0')+' 00000 n \n');
  put('trailer\n<< /Size '+N+' /Root 1 0 R >>\nstartxref\n'+xs+'\n%%EOF');return new Blob(parts,{type:'application/pdf'});}

/* ---------- backup ---------- */
function download(name,text){const b=new Blob([text],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);}
function safe(s){return String(s||'').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,40)||'زيارة';}
function backupName(){const ds=Object.values(DB.visits).filter(v=>!v.deleted&&v.date).map(v=>v.date).sort();const h=iso=>{const x=toH(iso);return x.d+'-'+x.m+'-'+x.y};
  return 'نسخة بطاقات التقويم'+(ds.length?' من '+h(ds[0]):'')+' إلى '+h(today())+'.json';}
function writeBackup(){saveNow();const st=Object.assign({},DB.settings);delete st.syncPass;
  download(backupName(),JSON.stringify({kind:'taqweem-backup',v:1,at:Date.now(),visits:DB.visits,settings:st}));
  DB.lastBackup=Date.now();DB.changedSinceBackup=false;DB.unbackedSince=0;saveNow();}
/* automatic copy at natural stopping points (finishing a card, printing, exporting) — only when there is new work, at most every 20 min */
function autoBackup(){if(DB.settings.autoBackup===false||!DB.changedSinceBackup)return;if(Date.now()-(DB.lastBackup||0)<15*60e3)return;writeBackup();}
function backupAll(){writeBackup();if(S.v==='home')render();modal('<h3>انحفظت النسخة الاحتياطية</h3><p>تلقاها في مجلد <b>التنزيلات</b> باسم «'+esc(backupName())+'». بعض المتصفحات تسميها «download»، وهذا طبيعي.</p><p>كل نسخة فيها كل الزيارات لين اليوم، فيكفي آخر نسخة.</p><div class="acts"><button class="btn primary" onclick="closeModal()">تمام</button></div>','nudge');}
function backupVisit(id){const v=DB.visits[id];saveNow();download('زيارة-'+safe(v.school)+'-'+(v.date||today())+'.json',JSON.stringify({kind:'taqweem-backup',v:1,at:Date.now(),visits:{[id]:v}}));DB.lastBackup=Date.now();saveNow();toast('انحفظت نسخة الزيارة في التنزيلات (قد يكون اسمها download)');}
function importFile(){const i=document.createElement('input');i.type='file';i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.visits)throw 0;let n=0,u=0;
  Object.values(d.visits).forEach(v=>{const cur=DB.visits[v.id];if(!cur){DB.visits[v.id]=v;n++}else if((v.updated||0)>(cur.updated||0)){DB.visits[v.id]=v;u++}});
  /* نقل لجهاز جديد: ترجع معه إعداداته (اسمه، الفريق، المواد اللي أضافها، عباراته المحفوظة، الخط والشكل) بدون ما تمسح شي في الجهاز الجديد */
  const os=d.settings||{},ns=DB.settings;['name','team','theme','fs','fz','mode','sumStyle','sumExtra','sort','autoBackup','hints','sheetId'].forEach(k=>{if(os[k]!=null&&(ns[k]==null||ns[k]===''))ns[k]=os[k];});
  if(Array.isArray(os.customSubjects)){ns.customSubjects=ns.customSubjects||[];os.customSubjects.forEach(x=>{if(!ns.customSubjects.includes(x))ns.customSubjects.push(x)});}
  if(os.phrases&&typeof os.phrases==='object'){if(Array.isArray(os.phrases)){ns.phrases=ns.phrases||[];os.phrases.forEach(x=>{const t=x&&x.t;if(!t)return;const e=ns.phrases.find(y=>y.t===t);if(e)e.n=Math.max(e.n||0,x.n||0);else ns.phrases.push(x);});}}
  if(os.seenGuide)ns.seenGuide=true;
  saveNow();try{applyTheme()}catch(e){}render();toast('تم الاسترجاع: '+n+' زيارة جديدة'+(u?' و'+u+' محدّثة':''));}catch(e){toast('هذا الملف مو نسخة احتياطية من التطبيق. اختر ملف النسخة (قد يكون اسمه download).')}};rd.readAsText(f);};filePick(i);}

/* ---------- schedule import (جدول العمل اليومي) ---------- */
function parseHdate(x){const m=String(x||'').match(/(\d+)\s*\/\s*(\d+)\s*\/\s*(\d+)/);return m?fromH(+m[3],+m[2],+m[1]):null;}
/* المرحلة من اسم المدرسة في أي مكان فيه (مثل «بدر المتوسطة»)، مو بس إذا الاسم يبدأ فيها. لو الاسم فيه أكثر من مرحلة أو ولا وحدة، نحكم من الصفوف */
function stageOf(school,grades){const n=norm(school),hit=[['p',/ابتدا/],['m',/متوسط/],['s',/ثانوي/]].filter(x=>x[1].test(n)).map(x=>x[0]);if(hit.length===1)return hit[0];
  grades=grades||[];if(grades.some(g=>/متوسط/.test(g)))return 'm';if(grades.some(g=>/ثانوي/.test(g)))return 's';if(grades.some(g=>/ابتدائ/.test(g)))return 'p';return hit[0]||'p';}
function gradeIn(g,stage){const o=String(g||'').replace(/\s*(الابتدائي|المتوسط|الثانوي|ابتدائي|متوسط|ثانوي)\s*$/,'').trim();if(!o)return '';return (GRADES[stage]||[]).includes(o)?o+' '+STG_SFX[stage]:String(g).trim();}
/* تصحيح مرحلة زيارة: الصف يتعدل للمرحلة الصحيحة (إلا اللي عدّله الوالد بيده)، والتقييمات ما تنلمس */
function fixStage(v,st){if(!v||!st||v.stage===st)return false;v.stage=st;
  instances(v,'cls').forEach(ins=>{const ed=ins.metaEdited||{},m=ins.meta||{};if(ins.stage)return;if(m.grade&&!ed.grade)m.grade=gradeIn(m.grade,st);if(m.subj&&!ed.subj&&ins.src)m.subj=mapSubj(m.subj,st);});return true;}
/* تغيير مرحلة حصة: الصف يتحول لنفس رقمه بالمرحلة الجديدة (أو يتفرغ لو ما له مقابل)، والمادة تتحول لمقابلها.
   ولو باقي حصص المدرسة ما لها مرحلة ثانية واضحة، تتغير مرحلة المدرسة كلها معها (ونموذج مقابلة الطلاب) */
function setClsStage(v,ins,ns){if(!GRADES[ns])return;ins.stage=ns;const ed=(ins.metaEdited=ins.metaEdited||{});
  const g=ins.meta.grade;if(g&&gradeStage(g)!==ns){const o=String(g).replace(/\s*(الابتدائي|المتوسط|الثانوي)\s*$/,'').trim();ins.meta.grade=GRADES[ns].includes(o)?o+' '+STG_SFX[ns]:'';ed.grade=true;}
  if(ins.meta.subj){const m2=mapSubj(ins.meta.subj,ns);if(m2!==ins.meta.subj){ins.meta.subj=m2;ed.subj=true;}}
  if(v.stage!==ns&&instances(v,'cls').every(x=>x===ins||!(x.stage||gradeStage(x.meta&&x.meta.grade))||(x.stage||gradeStage(x.meta.grade))===ns)){v.stage=ns;v.stageEdited=true;}}
function normalizeStages(){let n=0;Object.values(DB.visits).forEach(v=>{if(v.src!=='sched'||v.stageEdited)return;
  const st=v.schedStage||stageOf(v.srcSchool||v.school,instances(v,'cls').map(i=>(i.meta||{}).grade||''));if(fixStage(v,st))n++;});if(n)saveNow();return n;}
function bare(x){return norm(x).split(' ').map(w=>w.replace(/^ال/,'')).join(' ');}
const SUBJ_ALIAS={'اسلاميه':'الدراسات الإسلامية','دراسات اسلاميه':'الدراسات الإسلامية','اجتماعيات':'الدراسات الاجتماعية','دراسات اجتماعيه':'الدراسات الاجتماعية','انجليزي':'اللغة الإنجليزية','لغه انجليزيه':'اللغة الإنجليزية','قران':'القرآن الكريم','قران كريم':'القرآن الكريم','حاسب':'المهارات الرقمية','بدنيه':'التربية البدنية والدفاع عن النفس','فنيه':'التربية الفنية','تربيه فنيه':'التربية الفنية'};
function mapSubj(x,stage){const b=bare(x),L=SUBJ[stage]||SUBJ.p;if(!b)return '';if(b==='لغتي'||b==='لغتي خالده'||b==='لغه عربيه')return stage==='m'?'لغتي الخالدة':stage==='s'?'اللغة العربية':'لغتي';
  const al=SUBJ_ALIAS[b];if(al)return al;const hit=L.find(s=>bare(s)===b)||L.find(s=>bare(s).includes(b)||b.includes(bare(s)));return hit||x.trim();}
function mapGrade(g,stage){g=String(g||'').trim();if(!g)return '';return /(ابتدائ|متوسط|ثانوي)/.test(g)?g:g+' '+(STG_SFX[stage]||'');}
function isMine(members,me){return (members||[]).includes('*')||(members||[]).some(m=>norm(m)===norm(me));}
function schedPlan(o,mineOnly){const me=o.for||DB.settings.name||'';const by={};
  /* نفس المدرسة لو تكررت زيارتها بعد أكثر من ١٠ أيام تصير زيارة ثانية مستقلة */
  const clu={};(o.days||[]).map(d=>[norm(d.school),parseHdate(d.date)]).filter(x=>x[1]).sort((a,b)=>a[1].localeCompare(b[1])).forEach(([s,i])=>{const L=clu[s]||(clu[s]=[]);const last=L[L.length-1];if(!last||Math.abs(new Date(i+'T12:00')-new Date(last.e+'T12:00'))>10*864e5)L.push({s:i,e:i,n:L.length});else last.e=i;});
  const keyOf=(school,iso)=>{const s=norm(school),L=clu[s]||[];const c=L.find(x=>iso&&iso>=x.s&&iso<=x.e);return s+(c&&c.n?'#'+c.n:'');};
  (o.days||[]).forEach(d=>{const iso=parseHdate(d.date);
    if(d.acts){const k=keyOf(d.school,iso);(by[k]=by[k]||{key:k,school:(d.school||'').trim(),days:[],rows:[]});if(d.stage)by[k].st=d.stage;const ex=by[k].days.find(x=>x.iso===iso);if(ex)ex.acts=d.acts;else by[k].days.push({iso,name:d.dayName,date:d.date,acts:d.acts});}
    (d.periods||[]).forEach(per=>(per.rows||[]).forEach(r=>{if(r.t!=='v')return;if(mineOnly&&!isMine(r.members,me))return;

function latD(x){return String(x||'').replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/\s+/g,'');}
function decodeClasses(text,pass){pass=latD(pass);const c=extractCode(text);if(!c)return {err:'nocode'};
  let raw;try{raw=b64d(c.b)}catch(e){return {err:'nocode'}}if(raw.length<41)return {err:'nocode'};
  const salt=raw.slice(0,16),nonce=raw.slice(16,40),box=raw.slice(40);let out=nacl.secretbox.open(box,nonce,kdf(pass,salt));if(!out)return {err:'pass'};
  try{if(c.v===2)out=fflate.inflateSync(out);return {o:expandPayload(JSON.parse(new TextDecoder().decode(out)))}}catch(e){return {err:'nocode'}}}
/* compact payload {k:'tq',f,r,d:[[dayId,dayName,'d/m/y',school,[[period,subject,grade,section,teacher,nid,rowId]]]]} -> schedule shape */
function expandPayload(o){if(!o||o.k!=='tq')return o;const who=o.f||'';
  return {for:who,roster:o.r||[],days:(o.d||[]).map(([dayName,date,school,rows,stage,acts])=>{const ps=[];(rows||[]).forEach(([pn,subject,grade,section,teacher,nid,co])=>{let p=ps.find(x=>x.name===pn);if(!p)ps.push(p={name:pn,rows:[]});p.rows.push({id:pn+'|'+(nid||norm(teacher)),t:'v',subject,grade,section,teacher,nid,members:[who],co:Array.isArray(co)?co:null});});
    return {id:'d'+date,dayName,date:String(date).split('/').join(' / ')+' هـ',school,stage:STG_SFX[stage]?stage:'',acts:Array.isArray(acts)?acts:null,periods:ps};})};}

/* ---------- بصمات التغيير ---------- */
const HDR=['school','srcSchool','date','stage','src','schedDays','schedStage','deleted','dateEdited','stageEdited','created','id'];
/* كل بطاقة تتغير ياخذ ختم وقت جديد، والمحذوفة ينحفظ لها أثر عشان ما ترجع من جهاز ثاني */
function stampVisit(v){const S2=DB.stamps||(DB.stamps={}),seen=S2[v.id]||(S2[v.id]={i:{},h:''});let ch=false;const now=Date.now(),cur={};
  Object.keys(v.cards||{}).forEach(cid=>(v.cards[cid]||[]).forEach(ins=>{const c=Object.assign({},ins);delete c.u;const h=hsh([cid,c]);cur[ins.id]=1;
    if(seen.i[ins.id]!==h){seen.i[ins.id]=h;if(!ins.u||seen.i[ins.id+'#']||(v.gone&&v.gone[ins.id]>=(ins.u||0))){ins.u=now;}if(v.gone)delete v.gone[ins.id];seen.i[ins.id+'#']=1;ch=true;}}));
  Object.keys(seen.i).forEach(k=>{if(k.slice(-1)==='#'||cur[k])return;
    /* حذف تلقائي من الجدول (حصة فاضية) يختلف عن حذف الوالد: ما يحذف أبد نسخة فيها رصد من جهاز ثاني */
    if(DB.autoDel&&DB.autoDel[k]){(v.goneAuto=v.goneAuto||{})[k]=now;delete DB.autoDel[k];}else (v.gone=v.gone||{})[k]=now;delete seen.i[k];delete seen.i[k+'#'];ch=true;});
  const hd={};HDR.forEach(k=>hd[k]=v[k]);const hh=hsh(hd);if(seen.h!==hh){if(seen.h||!v.hu)v.hu=now;seen.h=hh;ch=true;}
  return ch;}
/* بعد الدمج: نحفظ البصمات الحالية بدون ما نغيّر أختام الوقت (اللي جا من جهاز ثاني يبقى بختمه) */

  const hd={};HDR.forEach(k=>hd[k]=v[k]);seen.h=hsh(hd);S2[v.id]=seen;}
function visitHash(v){const c=Object.assign({},v);delete c.updated;return hsh(c);}

/* دمج نسختين من نفس الزيارة: كل بطاقة الأحدث يمشي، والمحذوف يبقى محذوف، وبيانات المدرسة من الأحدث */
function mergeVisit(L,R){const out=L;const ga=Object.assign({},R.goneAuto||{},L.goneAuto||{});const gone=Object.assign({},R.gone||{},L.gone||{});Object.keys(R.gone||{}).forEach(k=>{gone[k]=Math.max(gone[k]||0,R.gone[k]);});

  const bak=[];const cids={};Object.keys(L.cards||{}).concat(Object.keys(R.cards||{})).forEach(c=>cids[c]=1);out.cards=out.cards||{};
  Object.keys(cids).forEach(cid=>{const A=(L.cards||{})[cid]||[],B=(R.cards||{})[cid]||[],res=A.slice();
    B.forEach(rb=>{const i=res.findIndex(x=>x.id===rb.id);if(i<0){res.push(rb);return;}const la=res[i],nu=x=>{const c=Object.assign({},x);delete c.u;return canon(c)};if(nu(la)===nu(rb)){if((rb.u||0)>(la.u||0))la.u=rb.u;return;}
      const open=S&&S.v==='fill'&&S.iid===la.id,rWin=!open&&(rb.u||0)>(la.u||0),win=rWin?rb:la,lose=rWin?la:rb;
      /* نفس البطاقة تعدّلت في الجهازين: الأحدث يمشي، وأي فقرة رصدها في الثاني وما هي في الأحدث تنضاف له عشان ما تضيع */
      win.items=win.items||{};Object.keys(lose.items||{}).forEach(k=>{const w=win.items[k],l=lose.items[k];if((!w||!levelOf(CARD[cid].items[k],w)&&!(w.note||'').trim())&&l)win.items[k]=l;});
      if(!win.ink&&lose.ink)win.ink=lose.ink;bak.push({v:L.id,cid,ins:lose});res[i]=win;});
    out.cards[cid]=res.filter(x=>!(gone[x.id]&&gone[x.id]>=(x.u||0))&&!(ga[x.id]&&!insHasData(cid,x)));if(cid==='cls')out.cards[cid].sort((a,b)=>String(insIso(out,a)||'').localeCompare(String(insIso(out,b)||''))||perIdx((a.meta||{}).period)-perIdx((b.meta||{}).period)||String(a.id).localeCompare(String(b.id)));});

/* جهاز جديد جاب الحصص من الجدول قبل ما يدخل للحساب: نفس المدرسة ونفس التاريخ موجودة في الحساب.
   ندمجها في نسخة الحساب بدل ما تطلع المدرسة مرتين، وأي شي رصده على الجهاز الجديد ينضاف */
function absorbLocal(rv){const k=norm(rv.srcSchool||rv.school);const dup=Object.values(DB.visits).filter(x=>x.id!==rv.id&&!(DB.synced||{})[x.id]&&norm(x.srcSchool||x.school)===k&&x.date===rv.date);

      const j=ins.src?R.findIndex(y=>y.src===ins.src):-1;if(j>=0&&!insHasData(cid,R[j])){ins.id=R[j].id;R[j]=ins;}else if(j<0)R.push(ins);else{ins.u=Date.now();ins.id=uid();R.push(ins);}});});
    delete DB.visits[x.id];if(DB.stamps)delete DB.stamps[x.id];});return dup.length;}
/* ---------- المزامنة ---------- */
const PART=800000;
async function pushVisit(uid,v,K){const c=seal(v,K),h=visitHash(v),base='/users/'+uid+'/visits/'+v.id;
  if(c.length<=PART){await fsReq('PATCH',base,fields({c,h,n:0,u:Date.now()}));return h;}
  const n=Math.ceil(c.length/PART);for(let k=0;k<n;k++)await fsReq('PATCH','/users/'+uid+'/parts/'+v.id+'_'+k+'_'+h.replace(/[^A-Za-z0-9]/g,''),fields({c:c.slice(k*PART,(k+1)*PART)}));
  await fsReq('PATCH',base,fields({c:'',h,n,u:Date.now()}));return h;}
async function pullVisit(uid,id,meta,K){const d=meta.n?null:await fsReq('GET','/users/'+uid+'/visits/'+id);let c=d?UF(d.fields).c:'';
  if(meta.n){const tag=meta.h.replace(/[^A-Za-z0-9]/g,'');let s='';for(let k=0;k<meta.n;k++){const p=await fsReq('GET','/users/'+uid+'/parts/'+id+'_'+k+'_'+tag);if(!p)throw new Error('part');s+=UF(p.fields).c;}c=s;}
  return unseal(c,K);}
async function listRemote(uid){const out={};let pt='';do{const j=await fsReq('GET','/users/'+uid+'/visits?pageSize=300&mask.fieldPaths=h&mask.fieldPaths=n&mask.fieldPaths=g&mask.fieldPaths=u'+(pt?'&pageToken='+encodeURIComponent(pt):''));

/* تأكد فعلي من السيرفر: كل زيارة على الجهاز موجودة في الحساب بنفس المحتوى بالضبط، وما فيه شي معلّق */
async function verifySynced(){const a=acct();if(!a)return {ok:false,miss:0};let R;try{R=await listRemote(a.uid)}catch(e){return {ok:false,miss:-1}}
  const miss=Object.values(DB.visits).filter(v=>{const m=R[v.id];return !m||m.g||m.h!==visitHash(v)}).length;
  const pend=Object.keys(DB.purged||{}).filter(id=>!(R[id]&&R[id].g)).length;return {ok:!miss&&!pend,miss:miss+pend};}
function setCloud(st,err){cloudState=st;cloudErr=err||'';const el=$('#cloudInd');if(el)el.innerHTML=cloudBadge();}
function cloudBadge(){if(!acct())return '';const t=DB.acct.last?new Date(DB.acct.last).toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'}):'';
  return cloudState==='busy'?'☁ يزامن…':cloudState==='off'?'☁ بانتظار النت':cloudState==='err'?'☁ ما تمت المزامنة':'☁ محفوظ في الحساب'+(t?' '+t:'');}
async function cloudSync(force){const a=acct();if(a&&!DB.owner){DB.owner=a.uid;saveNow();}if(!a||cloudBusy)return;if(navigator.onLine===false)return setCloud('off');
  cloudBusy=true;setCloud('busy');const K=cloudK(),uid=a.uid,SH=DB.synced||(DB.synced={});let pulled=0,pushed=0;
  try{if(!DB.sub||Date.now()-(DB.sub.at||0)>5*60e3)await checkSub(true);const ro=subLocked();Object.values(DB.visits).forEach(stampVisit);
    const R=await listRemote(uid);
    for(const id of Object.keys(R)){const m=R[id];if(m.g){const lv=DB.visits[id];
      /* محذوفة من جهاز ثاني: تنحذف هنا، إلا لو عدّلها هالجهاز بعد الحذف، وقتها تبقى وترجع للحساب عشان ما يضيع تعديل */
      if(lv&&(lv.updated||0)>(m.u||0)){delete SH[id];continue;}

    if(!ro)for(const v of Object.values(DB.visits)){const h=visitHash(v);if(SH[v.id]===h&&R[v.id])continue;if(R[v.id]&&R[v.id].h===h){SH[v.id]=h;continue;}
      SH[v.id]=await pushVisit(uid,v,K);pushed++;}
    if(!ro)for(const id of Object.keys(DB.purged||{})){if(R[id]&&R[id].g){delete DB.purged[id];continue;}await fsReq('PATCH','/users/'+uid+'/visits/'+id,fields({g:true,h:'gone',n:0,u:Date.now()}));delete DB.purged[id];}

  catch(e){if(e instanceof TypeError){setCloud('off');}else if(/INVALID_REFRESH_TOKEN|TOKEN_EXPIRED|USER_NOT_FOUND|USER_DISABLED/.test(e.code||e.message||'')){setCloud('err');toast('انتهى دخولك للحساب. ادخل مرة ثانية من الإعدادات.');}else setCloud(navigator.onLine===false?'off':'err',e.message);}

/* ================= الاشتراك =================
   حساب كل مشترك له ملف عند منشئ التطبيق فيه: الاسم والفريق والدور ونوع الاشتراك وتاريخ انتهائه.

const LEGACY=['ali@taqweem.app'];
function acctEmail(){const u=normUser((DB.acct&&DB.acct.u)||'');return u.indexOf('@')<0?u+'@'+FB.domain:u;}
async function checkSub(quiet){if(!acct())return;const em=acctEmail();
  /* توكن جديد كل نص ساعة عشان وقت السيرفر يكون محدّث */if(srvSkew==null||Date.now()-srvAt>30*60e3||Date.now()<srvAt)cloudTok=null;

/* الحالة: ok شغال، login يحتاج يدخل، none ما له اشتراك، off موقوف، expired منتهي */

  /* ساعة الجهاز رجعت ورا عن آخر وقت شافه التطبيق: ممكن تحايل على تاريخ الانتهاء */const n=Date.now();if(DB.clk&&n<DB.clk-30*60e3)return 'clock';if(!DB.clk||n>DB.clk)DB.clk=n;
  /* لازم يتصل بالنت مرة كل أسبوع عشان يتأكد اشتراكه */const ok=s.okAt||s.at||0;if(ok&&now-ok>SUB_OFFLINE*864e5)return 'stale';return 'ok';}

/* ================= الحصص من لوحة منشئ التطبيق (بدل جدول جوجل) =================
   كل مشترك له مفتاحين (عام وخاص). العام ينشر عشان منشئ التطبيق يقفل حصصه فيه، والخاص يبقى مقفول بمفتاح بياناته.
   منشئ التطبيق يرسل حصص كل عضو مقفولة بمفتاحه العام، فما أحد يقرأها غير صاحبها. */
async function ensureBox(){const a=acct();if(!a)return null;if(a.box&&a.boxPub)return b64d(a.box);
  const p='/users/'+a.uid+'/meta/box';let d=null;try{d=await fsReq('GET',p);}catch(e){return null;}let sk;
  if(d){try{sk=b64d(unseal(UF(d.fields).c,cloudK()).sk);}catch(e){return null;}}
  else{const kp=nacl.box.keyPair();sk=kp.secretKey;try{await fsReq('PATCH',p+'?currentDocument.exists=false',fields({c:seal({sk:b64e(sk)},cloudK())}));}catch(e){try{const d2=await fsReq('GET',p);sk=b64d(unseal(UF(d2.fields).c,cloudK()).sk);}catch(e2){return null;}}}
  const pk=nacl.box.keyPair.fromSecretKey(sk).publicKey;
  try{await fsReq('PATCH','/keys/'+encodeURIComponent(acctEmail()),fields({pk:b64e(pk),u:Date.now()}));a.box=b64e(sk);a.boxPub=1;saveNow();}catch(e){a.box=b64e(sk);saveNow();}
  return sk;}
/* يجيب آخر حصص أرسلها منشئ التطبيق. يرجّع null إذا ما فيه شي جديد */
/* الحصص من اللوحة: مقفولة بمفتاح توصيل مشترك يقرأه المشتركين بس (حسب قواعد الحماية)، وكل مشترك ما يقدر يقرأ إلا حصصه هو */
async function inboxKey(){if(DB.settings.ik)return b64d(DB.settings.ik);let d;try{d=await fsReq('GET','/cfg/inbox');}catch(e){return null;}if(!d)return null;const k=UF(d.fields).k;if(!k)return null;DB.settings.ik=k;saveNow();return b64d(k);}
async function inboxFetch(force){const a=acct();if(!a||navigator.onLine===false)return null;
  let d;try{d=await fsReq('GET','/inbox/'+encodeURIComponent(acctEmail()));}catch(e){return {err:'fetch',status:e&&e.status||0,msg:String(e&&e.message||e)};}if(!d)return {none:true};
  const o=UF(d.fields);if(!force&&DB.settings.inboxTs&&+o.ts<=DB.settings.inboxTs)return {same:true,ts:+o.ts};
  try{const u=b64d(o.c);let m=null;
    if(+o.v===2){const k=await inboxKey();if(!k)return {err:'key'};m=nacl.secretbox.open(u.slice(24),u.slice(0,24),k);if(!m){DB.settings.ik='';const k2=await inboxKey();if(k2)m=nacl.secretbox.open(u.slice(24),u.slice(0,24),k2);}}
    else{const sk=await ensureBox();if(sk)m=nacl.box.open(u.slice(56),u.slice(32,56),u.slice(0,32),sk);}
    if(!m)return {err:'key'};
    return {ts:+o.ts,o:expandPayload(JSON.parse(m[0]===123?cDec(m):cDec(fflate.inflateSync(m))))};}catch(e){return {err:'bad',msg:String(e&&e.message||e),ts:+o.ts};}}

/* ---------- شغل كل حساب منفصل على نفس الجهاز ----------
   لو دخل حساب ثاني على نفس الجهاز: شغل الحساب الأول ينحفظ جانب (ما ينحذف ولا ينرفع لحساب غيره)،
   ويرجع كامل أول ما يدخل صاحبه مرة ثانية، وينرفع لحسابه هو. */
function swapOwner(nu){if(!nu)return;const KEEP=['acct','lastK','sub','owner','stash','v','savedAt','clk'];
  /* الوالد: الشغل اللي على جهازه من قبل الدخول شغله هو، فيبقى معه مثل ما هو */if(DB.acct&&LEGACY.indexOf(acctEmail())>=0&&(!DB.owner||DB.owner==='anon'||DB.owner===ALI_OLD_UID)){DB.owner=nu;saveNow();return;}
  /* جهاز ما دخل فيه أحد قبل: شغله المحلي ما ينضم لأي حساب إلا لو كان لنفس الحساب */if(!DB.owner&&Object.keys(DB.visits||{}).length&&!(DB.lastK&&DB.lastK.uid===nu))DB.owner='anon';
  if(DB.owner&&DB.owner!==nu){const cur={};Object.keys(DB).forEach(k=>{if(KEEP.indexOf(k)<0){cur[k]=DB[k];delete DB[k];}});
    DB.stash=DB.stash||{};DB.stash[DB.owner]=cur;const prev=DB.stash[nu];delete DB.stash[nu];
    if(prev)Object.assign(DB,prev);else{const b=blank(),o=cur.settings||{};b.settings.name='';b.settings.team='';['theme','fz','mode'].forEach(k=>{if(o[k]!=null)b.settings[k]=o[k]});Object.assign(DB,{visits:b.visits,settings:b.settings,lastBackup:0,changedSinceBackup:false});}}
  DB.owner=nu;saveNow();}

   كل شي هنا إضافة: ما يغيّر الحصص ولا الدرجات، وحساب الوالد يبقى مثل ما هو (الأزرار الجديدة له بالإعدادات بس). */

/* ---------- جدولي هذا الأسبوع (داخل ملخص الأسبوع) ---------- */
function mySchedule(sun){const end=addDays(sun,6),by={};
  allVisits().forEach(v=>instances(v,'cls').forEach(ins=>{const iso=insIso(v,ins);if(!iso||iso<sun||iso>end)return;(by[iso]||(by[iso]=[])).push({v,ins})}));

/* ---------- إحصائياتي ---------- */
function vStats(){const vs=allVisits(),schools=new Set(),subj={},mon={};let cls=0,clsDone=0,cards=0,cardsDone=0;const lv=[0,0,0,0,0];
  vs.forEach(v=>{if(v.school)schools.add(norm(v.school));cardsFor(v).forEach(cid=>instances(v,cid).forEach(ins=>{if(!insStarted(cid,ins))return;
    CARD[cid].items.forEach((it,i)=>lv[levelOf(it,ins.items[i])]++);
    if(cid==='cls'){cls++;if(insDone(cid,ins))clsDone++;const s=(ins.meta&&ins.meta.subj)||'بدون مادة';subj[s]=(subj[s]||0)+1;
      const iso=insIso(v,ins)||v.date;if(iso){const h=toH(iso),k=h.y+'-'+String(h.m).padStart(2,'0');mon[k]=(mon[k]||0)+1}}
    else{cards++;if(insDone(cid,ins))cardsDone++}}))});
  const av=avgOf(lv),top=Object.entries(subj).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=top.length?top[0][1]:1,mk=Object.keys(mon).sort().slice(-6),mm=Math.max(1,...mk.map(k=>mon[k]));
  let h=band('إحصائياتي','من كل زياراتك')+'<div class="wrap">';
  h+='<div class="wstats"><div><b>'+schools.size+'</b><small>'+(schools.size===1?'مدرسة':schools.size===2?'مدرستين':'مدارس')+'</small></div><div><b>'+cls+'</b><small>حصة قيّمتها</small></div><div><b>'+cards+'</b><small>بطاقة أخرى</small></div></div>';
  h+='<div class="wstats"><div><b>'+(cls?Math.round(clsDone/cls*100):0)+'%</b><small>الحصص المكتملة</small></div><div><b>'+(av?av.toFixed(1):'—')+'</b><small>متوسط المستوى من 4</small></div><div><b>'+vs.length+'</b><small>زيارة</small></div></div>';
  if(lv.some(Boolean))h+='<div class="sec"><h2>توزيع الدرجات</h2></div><div class="panel">'+distBar(lv)+'<div class="muted" style="margin-top:8px;font-size:13px">'+[1,2,3,4].map(k=>LV[k]+': '+lv[k]).join(' · ')+'</div></div>';
  if(top.length)h+='<div class="sec"><h2>أكثر المواد</h2></div><div class="panel">'+top.map(([s,n])=>'<div class="sbar"><span>'+esc(s)+'</span><i style="width:'+Math.max(6,Math.round(n/mx*100))+'%"></i><b>'+n+'</b></div>').join('')+'</div>';
  if(mk.length)h+='<div class="sec"><h2>الحصص بالأشهر</h2></div><div class="panel">'+mk.map(k=>'<div class="sbar"><span>'+HM[+k.split('-')[1]-1]+'</span><i style="width:'+Math.max(6,Math.round(mon[k]/mm*100))+'%"></i><b>'+mon[k]+'</b></div>').join('')+'</div>';
  if(!cls&&!cards)h+='<div class="empty"><b>ما فيه أرقام للحين</b>أول ما تبدأ تقيّم الحصص تطلع إحصائياتك هنا.</div>';
  h+='<p class="muted" style="margin-top:18px">إحصائياتك خاصة فيك، ما يشوفها أحد غيرك.</p>';
  return h+'</div>';}
